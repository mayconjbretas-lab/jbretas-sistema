<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movimentação por posto — botão Atualizar rollup</title>
<link rel="stylesheet" href="/shared/css/base.css">
<style>
  html, body { height: auto; overflow: visible; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:var(--mono); font-size:12px; line-height:1.7; }
  .ok  { color:var(--ok); }
  .bad { color:var(--danger); font-weight:700; }
  h3   { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
         color:var(--text2); margin:16px 0 4px; }
  #res { white-space:pre-wrap; }
  iframe { width:1400px; height:300px; border:1px dashed var(--border); margin:8px 0; }
</style>

<div id="res">rodando…</div>
<!-- Dois palcos: a versão ANTERIOR do módulo e a de produção. Ver
     _movpostos-palco.html para por que precisam de documentos separados. -->
<iframe id="fr-antes" src="/testes/_movpostos-palco.html#v=antes"></iframe>
<iframe id="fr-agora" src="/testes/_movpostos-palco.html#v=agora"></iframe>
<iframe id="fr-sup" src="/testes/_movpostos-palco.html#v=agora&perfil=SUPERVISOR"></iframe>

<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// 1. O botão "Atualizar rollup" existe, é o QUARTO dos atalhos (depois de
//    Ontem, 7 dias e Projeção, nessa ordem), e tem as três cores pedidas.
// 2. NADA MAIS MUDOU: o corpo renderizado é IDÊNTICO byte a byte ao da versão
//    anterior do módulo depois de remover só esse botão. Não é uma conferência
//    de amostra — é o HTML inteiro, cards, colunas, lista e detalhe.
// 3. Só ADM vê o botão. Com perfil SUPERVISOR ele não é renderizado.
// 4. Clicar pede confirmação com o dia do filtro "até" e o prazo; recusar não
//    chama nada.
// 5. Confirmando, chama POST /tecnox/rollup-dia UMA VEZ POR PAR posto × dia,
//    em série, varrendo o PERÍODO do filtro: dia por fora, posto por dentro.
//    Com 01–14/09 e 37 postos são 518 chamadas, e a primeira leva o dia
//    01/09 — não o "até".
// 6. O progresso aparece no próprio botão ("Atualizando dia 3/14… 13/37
//    NOME") e a barra anda por par concluído, não por dia.
// 7. Par que falha é anotado COM O DIA e o laço segue: 518 chamadas,
//    ✓ 517/518, e o motivo no title do botão.
// 8. No fim recarrega a movimentação e, 5s depois, o botão volta ao normal.
// 9. Com de = até (um dia só) a pergunta e o rótulo são os de antes, palavra
//    por palavra, e são 37 chamadas.
// 10. O detalhe do posto abre em CINCO seções rotuladas (seis com a
//     Projeção ligada), com régua entre elas e nenhuma na última, e os
//     valores de canal/lucro coloridos. O contraste de cada cor sobre o
//     fundo do painel é MEDIDO — as três são escuras e o tema padrão é o
//     escuro.
//
// O fixture é a resposta REAL de GET /tecnox/movimentacao-postos de 01–14/09.
// ════════════════════════════════════════════════════════════════
var linhas = [], falhas = 0;
function h3(t) { linhas.push('\n<h3>' + t + '</h3>'); }
function hesc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function eh(cond, rot, obtido, esperado) {
  if (!cond) falhas++;
  linhas.push((cond ? '<span class="ok">OK  </span>' : '<span class="bad">FALHA</span>') +
    ' ' + hesc(rot) + (obtido === undefined ? '' : '  →  ' + hesc(obtido) +
      (esperado === undefined ? '' : '   (esperado ' + hesc(esperado) + ')')));
}
function nota(t) { linhas.push('     ' + hesc(t)); }
function pintar() { document.getElementById('res').innerHTML = linhas.join('\n'); }
function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function jan(id) { return document.getElementById(id).contentWindow; }
function doc(id) { return document.getElementById(id).contentDocument; }
async function prontoDe(id) {
  var w = jan(id);
  for (var i = 0; i < 200 && !w.pronto; i++) await esperar(50);
  if (!w.pronto) throw new Error(id + ': o palco não carregou');
  await w.pronto;
}
function atalhos(id) {
  return [].slice.call(doc(id).querySelectorAll('#palco .mp-atalhos > button'));
}
function btnRoll(id) { return doc(id || 'fr-agora').querySelector('#palco #mp-roll'); }

// ════════════════════════════════════════════════════════════════
async function rodar() {
  await prontoDe('fr-antes');
  await prontoDe('fr-agora');
  await prontoDe('fr-sup');
  var W = jan('fr-agora');

  h3('1. O botão, no fim dos atalhos');
  var bs = atalhos('fr-agora');
  var rot = bs.map(function (b) { return b.textContent.trim(); });
  nota('atalhos: ' + rot.join(' · '));
  eh(bs.length === 4, 'quatro botões na barra de atalhos', bs.length + '', '4');
  eh(rot[0] === 'Ontem' && rot[1] === '7 dias' && rot[2] === 'Projeção',
     'os três de antes, na mesma ordem', rot.slice(0, 3).join(' · '), 'Ontem · 7 dias · Projeção');
  eh(rot[3] === '⟳ Atualizar rollup', 'o novo é o último, com o ícone de refresh',
     rot[3], '⟳ Atualizar rollup');
  var b = btnRoll('fr-agora');
  eh(!!b && b.id === 'mp-roll', 'é o #mp-roll');
  eh(bs[2].className.indexOf('mp-atalho') === 0, 'a Projeção segue .mp-atalho', bs[2].className);
  eh(b.className === 'mp-roll', 'o novo tem classe própria, não .mp-atalho', b.className, 'mp-roll');

  h3('2. As três cores pedidas');
  var cs = jan('fr-agora').getComputedStyle(b);
  function hex(rgb) {
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb);
    if (!m) return rgb;
    return '#' + [1, 2, 3].map(function (i) {
      return ('0' + Number(m[i]).toString(16)).slice(-2).toUpperCase();
    }).join('');
  }
  eh(hex(cs.backgroundColor) === '#E1F5EE', 'fundo', hex(cs.backgroundColor), '#E1F5EE');
  eh(hex(cs.color) === '#085041', 'texto', hex(cs.color), '#085041');
  eh(hex(cs.borderTopColor) === '#0F6E56', 'borda', hex(cs.borderTopColor), '#0F6E56');
  eh(cs.fontSize === jan('fr-agora').getComputedStyle(bs[0]).fontSize,
     'mesmo corpo de texto dos atalhos vizinhos', cs.fontSize,
     jan('fr-agora').getComputedStyle(bs[0]).fontSize);

  h3('3. NADA MAIS MUDOU — corpo idêntico ao da versão anterior');
  var antes = jan('fr-antes').corpoHtml();
  // Remove SÓ o botão novo de uma cópia do render de agora. Se qualquer outra
  // coisa tivesse mudado — ordem de botão, cabeçalho, card, coluna, texto —
  // as duas cadeias divergiriam.
  var caixa = doc('fr-agora').createElement('div');
  caixa.innerHTML = jan('fr-agora').corpoHtml();
  var alvo = caixa.querySelector('#mp-roll');
  eh(!!alvo, 'o botão está no HTML do corpo (é de lá que sai a comparação)');
  if (alvo) alvo.parentNode.removeChild(alvo);
  var agoraSemBotao = caixa.innerHTML;
  nota('antes: ' + antes.length + ' bytes · agora sem o botão: ' + agoraSemBotao.length + ' bytes');
  eh(agoraSemBotao === antes, 'byte a byte igual',
     agoraSemBotao === antes ? 'idêntico' : 'DIFERENTE');
  if (agoraSemBotao !== antes) {
    var k = 0;
    while (k < antes.length && antes[k] === agoraSemBotao[k]) k++;
    nota('primeira divergência no byte ' + k + ':');
    nota('  antes: …' + antes.slice(Math.max(0, k - 40), k + 60));
    nota('  agora: …' + agoraSemBotao.slice(Math.max(0, k - 40), k + 60));
  }
  // E o cabeçalho da barra, item por item, para a falha dizer O QUE mudou.
  var cAntes = doc('fr-antes').querySelectorAll('#palco .mp-chips button').length;
  var cAgora = doc('fr-agora').querySelectorAll('#palco .mp-chips button').length;
  eh(cAntes === cAgora && cAgora === 2, 'os dois chips de convênio seguem lá',
     cAgora + '', cAntes + '');
  eh(doc('fr-agora').querySelectorAll('#palco .mp-datas input[type=date]').length === 2,
     'os dois campos de data seguem lá');
  eh(doc('fr-agora').querySelectorAll('#palco .mp-card').length ===
     doc('fr-antes').querySelectorAll('#palco .mp-card').length,
     'mesma quantidade de cards',
     doc('fr-agora').querySelectorAll('#palco .mp-card').length + '',
     doc('fr-antes').querySelectorAll('#palco .mp-card').length + '');

  h3('4. Só ADM vê');
  eh(!btnRoll('fr-sup'), 'com perfil SUPERVISOR o botão não é renderizado',
     btnRoll('fr-sup') ? 'APARECEU' : 'ausente');
  eh(atalhos('fr-sup').length === 3, 'e os três atalhos continuam lá',
     atalhos('fr-sup').length + '', '3');

  // ══════════════════════════════════════════════════════════════
  h3('5. A confirmação, com o período inteiro');
  var pedidos = [];
  W.confirm = function (msg) { pedidos.push(msg); return false; };
  W.CHAMADAS.length = 0;
  b.click();
  await esperar(60);
  eh(pedidos.length === 1, 'pediu confirmação', pedidos.length + '', '1');
  nota('texto: ' + (pedidos[0] || ''));
  eh((pedidos[0] || '') === 'Atualizar dados de 01/09 a 14/09? São 14 dias × 37 postos, ~233 min (3,9 h).',
     'a pergunta traz os dois dias, a conta e o prazo', pedidos[0],
     'Atualizar dados de 01/09 a 14/09? São 14 dias × 37 postos, ~233 min (3,9 h).');
  // 518 pares × 27s = 233 min. O prazo em horas aparece porque passa de 90min.
  eh(W.CHAMADAS.length === 0, 'recusar não chama nada', W.CHAMADAS.length + ' chamada(s)', '0');
  eh(b.textContent.trim() === '⟳ Atualizar rollup', 'e o botão nem muda', b.textContent.trim());

  h3('6. Dia por fora, posto por dentro');
  var N = doc('fr-agora').querySelectorAll('#palco .mp-posto').length;
  nota(N + ' postos na lista da tela · 14 dias no filtro → ' + (N * 14) + ' pares');
  var solta = [];
  // Cada chamada fica PENDENTE até a gente soltar: é o único jeito de olhar o
  // botão no meio do laço, par por par.
  W.RESPOSTA_ROLLUP = function () {
    return new Promise(function (r) {
      solta.push(function () { r({ ok: true, cupons: 10, litros: 20, veiculos: 5, linhas: 3 }); });
    });
  };
  W.confirm = function () { return true; };
  W.CHAMADAS.length = 0;
  b.click();
  await esperar(80);

  var rolls = function () { return W.CHAMADAS.filter(function (c) { return c.url.indexOf('/tecnox/rollup-dia') === 0; }); };
  eh(rolls().length === 1, 'em série: só a primeira chamada saiu', rolls().length + '', '1');
  var b1 = btnRoll();
  eh(/^Atualizando dia 1\/14… 1\/37 /.test(b1.textContent),
     'o rótulo mostra o dia E o posto', b1.textContent.trim(), 'Atualizando dia 1/14… 1/37 NOME');
  eh(b1.disabled, 'e está travado', b1.disabled ? 'sim' : 'NÃO');
  eh(JSON.parse(rolls()[0].opts.body).data === '2026-09-01',
     'a PRIMEIRA chamada leva o começo do período, não o fim',
     JSON.parse(rolls()[0].opts.body).data, '2026-09-01');
  eh(/ 0%/.test(b1.getAttribute('style') || ''), 'a barra começa em 0%', b1.getAttribute('style'));

  // Anda três pares e confere que o DIA não mudou e a barra andou pouco.
  for (var i = 0; i < 3; i++) { solta.shift()(); await esperar(30); }
  eh(rolls().length === 4, 'quatro chamadas depois de três respostas', rolls().length + '', '4');
  eh(/^Atualizando dia 1\/14… 4\/37 /.test(btnRoll().textContent),
     'ainda no dia 1, já no posto 4', btnRoll().textContent.trim(), 'Atualizando dia 1/14… 4/37');
  eh(/ 1%/.test(btnRoll().getAttribute('style') || ''),
     'barra em 1% (3 de 518 pares)', btnRoll().getAttribute('style'));
  var corpos = rolls().map(function (c) { return JSON.parse(c.opts.body); });
  eh(corpos.every(function (x) { return x.data === '2026-09-01'; }),
     'os quatro primeiros pares são todos do dia 01/09',
     corpos.map(function (x) { return x.data; }).join(' '), 'todos 2026-09-01');
  eh(new Set(corpos.map(function (x) { return x.posto_id; })).size === 4,
     'e de quatro postos diferentes', new Set(corpos.map(function (x) { return x.posto_id; })).size + '', '4');
  eh(Object.keys(corpos[0]).sort().join(',') === 'data,posto_id',
     'só os dois campos no corpo', Object.keys(corpos[0]).sort().join(','), 'data,posto_id');

  h3('7. O dia vira depois de fechar os 37 postos');
  // Fecha o resto do dia 1: faltam 33 respostas para o 37º sair e o dia virar.
  for (var q = 0; q < 34; q++) { if (solta.length) solta.shift()(); await esperar(6); }
  eh(rolls().length === 38, 'a 38ª chamada é a primeira do dia 2', rolls().length + '', '38');
  var c38 = JSON.parse(rolls()[37].opts.body);
  eh(c38.data === '2026-09-02', 'e ela leva 02/09', c38.data, '2026-09-02');
  eh(/^Atualizando dia 2\/14… 1\/37 /.test(btnRoll().textContent),
     'o rótulo virou para o dia 2', btnRoll().textContent.trim(), 'Atualizando dia 2/14… 1/37');
  var diasPedidos = rolls().slice(0, 37).map(function (c) { return JSON.parse(c.opts.body).data; });
  eh(new Set(diasPedidos).size === 1,
     'o dia 1 saiu INTEIRO antes do dia 2 começar', new Set(diasPedidos).size + ' dia(s) nos 37 primeiros', '1');

  h3('8. Um par falha: anota com o dia e segue até o fim');
  // Daqui para frente responde na hora; o primeiro a responder assim falha.
  var conta = 0;
  W.RESPOSTA_ROLLUP = function () {
    conta++;
    if (conta === 1) return Promise.reject(new Error('timeout 180s'));
    return Promise.resolve({ ok: true, cupons: 1, litros: 1, veiculos: 1, linhas: 1 });
  };
  while (solta.length) solta.shift()();
  for (var t2 = 0; t2 < 400 && !/Atualizado/.test(btnRoll().textContent); t2++) await esperar(50);
  var bf = btnRoll();
  nota('rótulo final: ' + bf.textContent.trim());
  eh(rolls().length === 518, 'chamou os 518 pares (14 × 37), sem parar na falha',
     rolls().length + '', '518');
  eh(bf.textContent.trim() === 'Atualizado ✓ 517/518', 'o rótulo conta 517 de 518',
     bf.textContent.trim(), 'Atualizado ✓ 517/518');
  eh(/^\d{2}\/\d{2} .*timeout 180s/.test(bf.title || ''),
     'o motivo vem com o DIA na frente, para saber o que rerrodar', bf.title);
  eh(/100%/.test(bf.getAttribute('style') || ''), 'a barra chega a 100%', bf.getAttribute('style'));
  // Todos os 14 dias foram pedidos, cada um 37 vezes.
  var porDia = {};
  rolls().forEach(function (c) { var d = JSON.parse(c.opts.body).data; porDia[d] = (porDia[d] || 0) + 1; });
  var chaves = Object.keys(porDia).sort();
  eh(chaves.length === 14, 'os 14 dias do período', chaves.length + '', '14');
  eh(chaves[0] === '2026-09-01' && chaves[13] === '2026-09-14', 'de 01/09 a 14/09',
     chaves[0] + ' … ' + chaves[13], '2026-09-01 … 2026-09-14');
  eh(chaves.every(function (d) { return porDia[d] === 37; }),
     'e 37 postos em cada dia', 'mín ' + Math.min.apply(null, chaves.map(function (d) { return porDia[d]; })) +
     ' / máx ' + Math.max.apply(null, chaves.map(function (d) { return porDia[d]; })), '37 em todos');

  h3('9. Recarrega a movimentação e volta ao normal em 5s');
  var movs = W.CHAMADAS.filter(function (c) { return c.url.indexOf('/tecnox/movimentacao-postos') === 0; });
  eh(movs.length === 1, 'recarregou a movimentação UMA vez ao terminar', movs.length + '', '1');
  eh(/inicio=2026-09-01&fim=2026-09-14/.test(movs[0].url), 'no mesmo período do filtro', movs[0].url);
  await esperar(5400);
  var bv = btnRoll();
  eh(bv.textContent.trim() === '⟳ Atualizar rollup', 'depois de 5s volta ao rótulo normal',
     bv.textContent.trim(), '⟳ Atualizar rollup');
  eh(!bv.disabled && bv.className === 'mp-roll' && !bv.getAttribute('style') && !bv.title,
     'destravado, sem classe de progresso, sem gradiente nem title residual',
     bv.className + ' | ' + (bv.getAttribute('style') || '(sem style)') + ' | ' + (bv.title || '(sem title)'));

  h3('10. Com de = até, tudo igual ao de antes');
  W.__mpPeriodo('inicio', '2026-09-14');
  await esperar(150);
  pedidos = [];
  W.confirm = function (msg) { pedidos.push(msg); return true; };
  // A PRIMEIRA resposta fica pendente: com as 37 respondendo na hora, o laço
  // inteiro terminava antes da leitura e o rótulo já era o do fim — foi o que
  // esta asserção pegou na primeira rodada.
  var vezes = 0, primeira = null;
  var resp10 = { ok: true, cupons: 5, litros: 6, veiculos: 7, linhas: 8 };
  W.RESPOSTA_ROLLUP = function () {
    vezes++;
    if (vezes === 1) return new Promise(function (r) { primeira = function () { r(resp10); }; });
    return Promise.resolve(resp10);
  };
  W.CHAMADAS.length = 0;
  btnRoll().click();
  await esperar(60);
  nota('texto: ' + (pedidos[0] || ''));
  eh((pedidos[0] || '') === 'Atualizar dados de 14/09? Demora ~17 min para 37 postos.',
     'a pergunta é a de um dia só, palavra por palavra', pedidos[0],
     'Atualizar dados de 14/09? Demora ~17 min para 37 postos.');
  eh(/^Atualizando \d+\/37… /.test(btnRoll().textContent) &&
     btnRoll().textContent.indexOf('dia') < 0,
     'e o rótulo não fala de dia', btnRoll().textContent.trim(), 'Atualizando N/37… NOME');
  if (primeira) primeira();
  for (var t3 = 0; t3 < 200 && !/Atualizado/.test(btnRoll().textContent); t3++) await esperar(30);
  eh(rolls().length === 37, 'são 37 chamadas, uma por posto', rolls().length + '', '37');
  eh(rolls().every(function (c) { return JSON.parse(c.opts.body).data === '2026-09-14'; }),
     'todas no dia único', 'ok');
  eh(btnRoll().textContent.trim() === 'Atualizado ✓ 37/37', 'e o fim conta 37/37',
     btnRoll().textContent.trim(), 'Atualizado ✓ 37/37');
  await esperar(5400);

  h3('12. Detalhe do posto: cinco seções rotuladas');
  // Abre o primeiro posto da lista. O detalhe é o mesmo nó que a lista já
  // renderizava; o que se confere aqui é a estrutura nova dentro dele.
  var prim = doc('fr-agora').querySelector('#palco .mp-p-linha');
  prim.click();
  await esperar(200);
  var det = doc('fr-agora').querySelector('#palco .mp-p-det');
  eh(!!det, 'o detalhe abriu');
  if (!det) { pintar(); return; }
  var secs = [].slice.call(det.querySelectorAll('.mp-det-sec'));
  var rots = secs.map(function (x) { return x.querySelector('.mp-det-rot').textContent.trim(); });
  nota('seções: ' + rots.join(' | '));
  eh(secs.length === 5, 'cinco seções (projeção desligada)', secs.length + '', '5');
  eh(rots.join('|') === 'Canais|Mix e produto|Ticket|Venda de combustível|Lucro bruto',
     'na ordem pedida', rots.join('|'),
     'Canais|Mix e produto|Ticket|Venda de combustível|Lucro bruto');
  // Uma linha de cada assunto no lugar certo.
  var linhasDe = function (i) {
    return [].slice.call(secs[i].querySelectorAll('.mp-det-linha span:first-child'))
      .map(function (e) { return e.textContent.trim(); });
  };
  nota('linhas por seção: ' + secs.map(function (x, i) { return linhasDe(i).length; }).join(' · '));
  eh(linhasDe(0).join('|') === 'Soutag|App 99|Pista', 'Canais: os três', linhasDe(0).join('|'),
     'Soutag|App 99|Pista');
  eh(linhasDe(1).join('|') === 'Mix g. aditivada|Venda de produto', 'Mix e produto: as duas',
     linhasDe(1).join('|'), 'Mix g. aditivada|Venda de produto');
  eh(linhasDe(2).join('|') === 'Ticket médio', 'Ticket: uma', linhasDe(2).join('|'), 'Ticket médio');
  eh(linhasDe(3).join('|') === 'Faturamento', 'Venda de combustível: Faturamento',
     linhasDe(3).join('|'), 'Faturamento');
  eh(linhasDe(4).join('|') === 'Venda bruta|Desconto|Venda líquida|Custo total|Lucro|Margem',
     'Lucro bruto: as seis do arquivo, na ordem', linhasDe(4).join('|'),
     'Venda bruta|Desconto|Venda líquida|Custo total|Lucro|Margem');
  eh(det.querySelectorAll('.mp-det-sep').length === 0,
     'a faixa antiga (.mp-det-sep) não é mais usada aqui',
     det.querySelectorAll('.mp-det-sep').length + '', '0');

  h3('13. Régua entre seções, e nenhuma na última');
  var W2 = jan('fr-agora');
  var cs = secs.map(function (x) { return W2.getComputedStyle(x); });
  eh(cs.slice(0, 4).every(function (c) { return parseFloat(c.borderBottomWidth) > 0; }),
     'as quatro primeiras têm borda embaixo',
     cs.map(function (c) { return c.borderBottomWidth; }).join(' '));
  eh(parseFloat(cs[4].borderBottomWidth) === 0, 'a última não tem', cs[4].borderBottomWidth, '0px');
  eh(cs.slice(0, 4).every(function (c) { return c.marginBottom === '16px' && c.paddingBottom === '14px'; }),
     'margin-bottom 16px e padding-bottom 14px nas que separam',
     cs[0].marginBottom + ' / ' + cs[0].paddingBottom, '16px / 14px');
  eh(cs[4].marginBottom === '0px' && cs[4].paddingBottom === '0px',
     'e a última sem sobra embaixo', cs[4].marginBottom + ' / ' + cs[4].paddingBottom, '0px / 0px');
  var cr = W2.getComputedStyle(secs[0].querySelector('.mp-det-rot'));
  eh(cr.fontSize === '11px', 'rótulo com 11px', cr.fontSize, '11px');
  eh(cr.letterSpacing === '0.5px', 'letter-spacing 0.5px', cr.letterSpacing, '0.5px');
  eh(cr.textTransform === 'uppercase', 'e caixa alta', cr.textTransform, 'uppercase');
  var cb = W2.getComputedStyle(secs[0].querySelector('.mp-det-linha b'));
  eh(cb.fontWeight === '500', 'valor com font-weight 500', cb.fontWeight, '500');

  h3('14. O bloco do detalhe');
  var cd = W2.getComputedStyle(det);
  eh(cd.borderRadius === '12px', 'border-radius 12px', cd.borderRadius, '12px');
  eh(cd.paddingTop === '20px' && cd.paddingLeft === '24px', 'padding 20px 24px',
     cd.paddingTop + ' ' + cd.paddingLeft, '20px 24px');
  eh(cd.marginTop === '8px', 'margin-top 8px', cd.marginTop, '8px');
  // --surface-1 não existe neste CSS; o equivalente é --sf (= --surface).
  var fundoSf = W2.getComputedStyle(doc('fr-agora').documentElement).getPropertyValue('--surface').trim();
  nota('fundo do painel: ' + cd.backgroundColor + '  ·  --surface = ' + fundoSf);
  eh(cd.backgroundColor !== 'rgba(0, 0, 0, 0)', 'tem fundo próprio', cd.backgroundColor);
  // O detalhe do CARD não foi tocado: ele dividia a regra com este.
  eh(!doc('fr-agora').querySelector('#palco .mp-detalhe') ||
     W2.getComputedStyle(doc('fr-agora').querySelector('#palco .mp-detalhe')).borderRadius === '10px',
     'o detalhe do CARD segue com os 10px de antes',
     doc('fr-agora').querySelector('#palco .mp-detalhe')
       ? W2.getComputedStyle(doc('fr-agora').querySelector('#palco .mp-detalhe')).borderRadius : '(fechado)');

  h3('15. As cores, e o contraste delas sobre o painel');
  // Contraste WCAG: (L1+0.05)/(L2+0.05) com L = luminância relativa.
  function lum(rgb) {
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb);
    if (!m) return null;
    var c = [1, 2, 3].map(function (i) {
      var v = Number(m[i]) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contraste(fg, bg) {
    var a = lum(fg), b = lum(bg);
    if (a === null || b === null) return null;
    var hi = Math.max(a, b), lo = Math.min(a, b);
    return Math.round((hi + 0.05) / (lo + 0.05) * 10) / 10;
  }
  var bgDet = cd.backgroundColor;
  var alvos = [
    ['Soutag', 'b.mp-v-so', '#3C3489'],
    ['App 99', 'b.mp-v-99', '#854F0B'],
    ['Lucro/Margem', 'b.mp-v-lucro', '#0F6E56'],
  ];
  alvos.forEach(function (a) {
    var el = det.querySelector(a[1]);
    eh(!!el, a[0] + ' tem a classe de cor (' + a[2] + ')');
    if (!el) return;
    var cor = W2.getComputedStyle(el).color;
    var r = contraste(cor, bgDet);
    nota('  ' + a[0] + ': ' + cor + ' sobre ' + bgDet + '  →  contraste ' + r + ':1');
    // NÃO reprova: a cor é a pedida. A linha existe para o número aparecer.
    if (r !== null && r < 4.5) {
      linhas.push('     <span class="bad">contraste abaixo de 4,5:1 para texto — ' + a[0] + ' em ' + r + ':1</span>');
    }
  });
  var zero = det.querySelector('b.mp-v-zero');
  nota('Desconto zero apagado nesta amostra: ' + (zero ? 'sim (' + zero.textContent.trim() + ')' : 'não — o desconto deste posto não é zero'));
  prim.click();
  await esperar(150);
  eh(!doc('fr-agora').querySelector('#palco .mp-p-det'), 'clicar de novo fecha o detalhe');

  h3('11. A tela não se perdeu no caminho');
  eh(doc('fr-agora').querySelectorAll('#palco .mp-card').length === 8,
     'os 8 cards continuam lá', doc('fr-agora').querySelectorAll('#palco .mp-card').length + '', '8');
  eh(doc('fr-agora').querySelectorAll('#palco .mp-posto').length === 37,
     'e os 37 postos', doc('fr-agora').querySelectorAll('#palco .mp-posto').length + '', '37');

  h3(falhas === 0 ? '<span class="ok">TUDO PASSOU</span>'
                  : '<span class="bad">' + falhas + ' FALHA(S)</span>');
  pintar();
}

rodar().catch(function (e) {
  linhas.push('<span class="bad">ERRO: ' + hesc(e.message) + '</span>');
  linhas.push(hesc(String(e.stack || '').split('\n').slice(0, 8).join('\n')));
  pintar();
});
</script>
