<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela App — Soutag/99, cards e lista por posto</title>
<link rel="stylesheet" href="/shared/css/base.css">
<link rel="stylesheet" href="/modulos/painel-adm/painel-adm.css">
<style>
  html, body { height: auto; overflow: visible; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:var(--mono); font-size:12px; line-height:1.7; }
  .ok  { color:var(--ok); }
  .bad { color:var(--danger); font-weight:700; }
  h3   { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
         color:var(--text2); margin:16px 0 4px; }
  #res { white-space:pre-wrap; }
  #palco { border:1px dashed var(--border); padding:10px; margin:12px 0; }
</style>

<div id="res">rodando…</div>
<div id="palco"></div>

<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// A aba App, com o app-cupons.js DE PRODUÇÃO e o payload REAL do
// GET /app/cupons de 14/09/2026 (gerado da própria rota contra o banco —
// 2.412 cupons Soutag em 32 postos, 1.609 do 99 em 28).
//
// 1. Quatro cards com valor, e clicar num card reordena a lista.
// 2. Lista por posto ordenada por litros desc, com REDE no topo.
// 3. REDE = soma dos postos, no combustível do chip.
// 4. Detalhe de um posto abre com TODOS os combustíveis dele.
// 5. Chip GC vs ET troca os valores SEM nova chamada à API.
// 6. Sub-botão Soutag vs 99 troca o canal, as cores e refaz a chamada.
// 7. Sete colunas fixas de 150px (nada de 1fr) e cards 150×96.
// 8. Mobile (375px): cards 2 por linha e colunas de preço fora da linha.
// 9. O toggle "Só preço de app" vem LIGADO, tira os cupons cobrados no
//    preço da placa (GC de 14/09: 1.390 itens → 832), derruba o preço médio
//    e o máximo, NÃO chama a API, e desligado devolve os números cheios.
//    Posto cujos cupons foram todos de placa fica na lista com travessão.
// 10. O chip GNV existe, é o quinto, e recorta sem chamar a API.
// 11. O layout: wrap com teto de 1400px e centrado, linhas que param nele,
//     padding de 10px nas linhas (14 embaixo na REDE), gaps de 12 e 16, e o
//     detalhe indentado 20px. A seção segue display:block.
// ════════════════════════════════════════════════════════════════
var linhas = [], falhas = 0;
function h3(t) { linhas.push('\n<h3>' + t + '</h3>'); }
function hesc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function eh(cond, rot, obtido, esperado) {
  if (!cond) falhas++;
  linhas.push((cond ? '<span class="ok">OK  </span>' : '<span class="bad">FALHA</span>') +
    ' ' + hesc(rot) + (obtido === undefined ? '' : '  →  ' + hesc(obtido) +
      (esperado === undefined ? '' : '   (esperado ' + hesc(esperado) + ')')));
}
function nota(t) { linhas.push('     ' + hesc(t)); }
function pintar() { document.getElementById('res').innerHTML = linhas.join('\n'); }
function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var FIX = {};
var CHAMADAS = [];
window.apiFetch = function (url) {
  CHAMADAS.push(String(url));
  var m = /canal=([^&]+)/.exec(url);
  var canal = m ? decodeURIComponent(m[1]) : 'SOUTAG';
  return Promise.resolve(canal === '99' ? FIX.n99 : FIX.soutag);
};
window.mmFmt = null;   // o módulo tem fallback próprio de formatação

function baixar(u) {
  return new Promise(function (ok, er) {
    var x = new XMLHttpRequest();
    x.open('GET', u);
    x.onload = function () { ok(JSON.parse(x.responseText)); };
    x.onerror = function () { er(new Error(u + ' não carregou')); };
    x.send();
  });
}
function js(src) {
  return new Promise(function (ok, erro) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok;
    s.onerror = function () { erro(new Error(src + ' não carregou')); };
    document.body.appendChild(s);
  });
}
function cards()   { return [].slice.call(document.querySelectorAll('#palco .ap-card')); }
function rot(i)    { var c = cards()[i]; return c ? c.querySelector('.ap-rot').textContent.trim() : null; }
function val(i)    { var c = cards()[i]; return c ? c.querySelector('.ap-num').textContent.trim() : null; }
function linhasP() { return [].slice.call(document.querySelectorAll('#palco .ap-linha')); }
function nomes()   { return linhasP().map(function (l) { return l.querySelector('.ap-nome').textContent.trim(); }); }
function nums(l)   { return [].slice.call(l.querySelectorAll('.ap-n')).map(function (s) { return s.textContent.trim(); }); }
function colsDe(sel) {
  var el = document.querySelector('#palco ' + sel);
  if (!el) return [];
  var v = getComputedStyle(el).gridTemplateColumns.trim();
  var m = /^repeat\((\d+),\s*([\d.]+px)\)$/.exec(v);
  if (m) { var o = []; for (var i = 0; i < Number(m[1]); i++) o.push(m[2]); return o; }
  return v.split(/\s+/);
}
function chip(t) {
  return [].slice.call(document.querySelectorAll('#palco .ap-chip'))
    .filter(function (b) { return b.textContent.trim() === t; })[0];
}
function subBtn(t) {
  return [].slice.call(document.querySelectorAll('#palco .ap-cbtn'))
    .filter(function (b) { return b.textContent.trim() === t; })[0];
}

// ════════════════════════════════════════════════════════════════
async function rodar() {
  if (window.innerWidth < 700) {
    linhas.push('<span class="bad">JANELA ESTREITA (' + window.innerWidth + 'px)</span>');
    nota('Este teste mede a grade de 7 colunas, que só existe a partir de 700px.');
    pintar();
    throw new Error('rode com a janela em 700px ou mais');
  }
  FIX.soutag = await baixar('/testes/fixtures-app-cupons-soutag.json');
  FIX.n99    = await baixar('/testes/fixtures-app-cupons-99.json');
  nota('fixture SOUTAG: ' + FIX.soutag.rede.total_cupons + ' cupons · ' + FIX.soutag.postos.length + ' postos');
  nota('fixture 99    : ' + FIX.n99.rede.total_cupons + ' cupons · ' + FIX.n99.postos.length + ' postos');

  var sec = document.createElement('section');
  sec.className = 'scr active';
  sec.id = 's-app';
  document.getElementById('palco').appendChild(sec);
  await js('/modulos/painel-adm/app-cupons.js');
  renderAppCupons(sec);
  await esperar(300);

  h3('0. A chamada');
  nota('chamadas: ' + CHAMADAS.join(' | '));
  eh(CHAMADAS.length === 1, 'uma chamada na abertura', CHAMADAS.length + '', '1');
  eh(/canal=SOUTAG/.test(CHAMADAS[0]), 'canal padrão = SOUTAG', CHAMADAS[0]);
  eh(/de=\d{4}-\d{2}-\d{2}&ate=\d{4}-\d{2}-\d{2}/.test(CHAMADAS[0]), 'com de e ate (padrão ontem)');

  h3('0b. O toggle "Só preço de app"');
  // Os dois blocos que a rota manda: o cheio e o filtrado, mesma forma.
  var gcDe = function (n) {
    return ((n && n.por_combustivel) || []).filter(function (c) { return c.combustivel === 'GC'; })[0] || null;
  };
  var p3 = function (v) {
    return v == null ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  };
  var gcAll = gcDe(FIX.soutag.rede);
  var gcApp = gcDe(FIX.soutag.so_app && FIX.soutag.so_app.rede);
  eh(!!FIX.soutag.so_app, 'a resposta traz o bloco so_app');
  eh(!!FIX.soutag.preco_placa, 'e o mapa preco_placa',
     FIX.soutag.preco_placa ? Object.keys(FIX.soutag.preco_placa).length + ' chaves' : '(ausente)');
  nota('GC no fixture: ' + gcAll.itens + ' itens / ' + gcAll.cupons + ' cupons no total · ' +
       gcApp.itens + ' itens / ' + gcApp.cupons + ' cupons com preço de app');
  // A MEDIÇÃO DO PEDIDO. 1.390 e 832 são itens (linha de cupom); o cartão da
  // tela mostra CUPONS, que é o distinto — 1.042 e 830. Os dois vão aqui para
  // a diferença não ser confundida com erro de conta.
  eh(gcAll.itens === 1390, '14/09 SOUTAG GC: 1.390 itens sem filtro', gcAll.itens + '', '1390');
  eh(gcApp.itens === 832, 'e 832 com o filtro', gcApp.itens + '', '832');

  var tg = chip('Só preço de app');
  eh(!!tg, 'o botão existe');
  if (!tg) { pintar(); throw new Error('sem o toggle não há o que testar'); }
  eh(tg.getAttribute('aria-pressed') === 'true', 'ligado por padrão', tg.getAttribute('aria-pressed'), 'true');
  eh(!tg.disabled, 'e habilitado', tg.disabled ? 'desabilitado' : 'habilitado');
  // Ao lado dos chips, e FORA do grupo deles: aquele grupo é de escolha única.
  eh(tg.parentElement.className.indexOf('ap-barra') >= 0,
     'está na barra de controles', tg.parentElement.className);
  eh(tg.previousElementSibling && tg.previousElementSibling.className.indexOf('ap-chips') >= 0,
     'logo depois do grupo de chips de combustível',
     tg.previousElementSibling ? tg.previousElementSibling.className : '(nada)');
  eh(/tolerância/.test(tg.title) && /placa/.test(tg.title), 'o title explica a régua', tg.title);

  h3('0c. Ligado: os números são os filtrados');
  nota('card preço médio: ' + val(0));
  eh(val(0).indexOf(p3(gcApp.preco_medio)) >= 0, 'o card mostra o preço médio FILTRADO',
     val(0), 'R$ ' + p3(gcApp.preco_medio));
  eh(gcApp.preco_medio < gcAll.preco_medio, 'que é menor que o cheio',
     p3(gcApp.preco_medio) + ' < ' + p3(gcAll.preco_medio));
  eh(val(2).indexOf(p3(gcApp.preco_max)) >= 0, 'o preço MÁXIMO também é o filtrado', val(2), 'R$ ' + p3(gcApp.preco_max));
  eh(gcApp.preco_max < gcAll.preco_max, 'e cai: o máximo cheio era preço de bomba',
     p3(gcApp.preco_max) + ' < ' + p3(gcAll.preco_max));
  var redeLig = nums(document.querySelector('#palco .ap-rede'));
  eh(redeLig[0] === gcApp.cupons.toLocaleString('pt-BR'), 'a linha REDE conta os cupons filtrados',
     redeLig[0], gcApp.cupons.toLocaleString('pt-BR'));
  eh(linhasP().length === FIX.soutag.postos.length,
     'e a lista segue com todos os postos, nenhum sumiu',
     linhasP().length + '', FIX.soutag.postos.length + '');

  h3('0d. Posto com tudo no preço de placa mostra travessão');
  // Em GC nenhum posto zera; em GA, sete zeram. O chip é trocado para GA de
  // propósito — é onde o caso existe nos dados reais de 14/09.
  chip('GA').click();
  await esperar(150);
  var soPostos = {};
  (FIX.soutag.so_app.postos || []).forEach(function (p) { soPostos[p.posto_id] = p; });
  var zerados = (FIX.soutag.postos || []).filter(function (p) {
    var a = ((p.por_combustivel || []).filter(function (c) { return c.combustivel === 'GA'; })[0]);
    var f = soPostos[p.posto_id] ? ((soPostos[p.posto_id].por_combustivel || []).filter(function (c) { return c.combustivel === 'GA'; })[0]) : null;
    return a && !f;
  });
  nota('postos com GA só no preço de placa: ' + zerados.length + ' — ' +
       zerados.map(function (p) { return p.nome; }).join(', '));
  eh(zerados.length > 0, 'o caso existe nos dados', zerados.length + '', '> 0');
  var alvo = zerados[0];
  var linhaAlvo = linhasP().filter(function (l) {
    return l.querySelector('.ap-nome').textContent.trim() === alvo.nome;
  })[0];
  eh(!!linhaAlvo, 'a linha do ' + alvo.nome + ' continua na lista');
  if (linhaAlvo) {
    var cel = nums(linhaAlvo);
    nota(alvo.nome + ': ' + cel.join(' · '));
    eh(cel.every(function (t) { return t === '—'; }), 'com travessão em todas as células',
       cel.join(' '), 'todas —');
  }
  // O DETALHE DESSE POSTO NÃO FICA VAZIO, e é importante que não fique: ele
  // zerou em GA, mas segue vendendo no preço de app em OUTROS combustíveis.
  // O detalhe mostra os que sobraram e simplesmente não traz a linha de GA —
  // que é a leitura certa de "este posto não teve GA com desconto".
  if (linhaAlvo) {
    linhaAlvo.click();
    await esperar(150);
    var det = document.querySelector('#palco .ap-det');
    eh(!!det, 'o detalhe do ' + alvo.nome + ' abre');
    if (det) {
      var combs = [].slice.call(det.querySelectorAll('tbody tr td:first-child'))
        .map(function (td) { return td.textContent.trim(); });
      nota('combustíveis no detalhe, com o filtro ligado: ' + combs.join(' · '));
      eh(combs.indexOf('GA') < 0, 'sem a linha de GA — era toda a preço de placa',
         combs.join(' '), 'sem GA');
      eh(combs.length > 0, 'mas com os combustíveis que sobraram', combs.length + ' linha(s)', '> 0');
      // A frase "tudo no preço da placa" é para o posto que zera INTEIRO.
      // Em 14/09 nenhum posto zera inteiro (37 de 37 sobrevivem ao filtro nos
      // dois canais), então ela não tem como ser exercitada com este fixture —
      // fica como caminho defensivo, e é o que esta nota registra.
      linhaAlvo.click(); await esperar(120);
    }
  }
  var inteiros = (FIX.soutag.postos || []).filter(function (p) { return !soPostos[p.posto_id]; });
  eh(inteiros.length === 0, 'nenhum posto desaparece INTEIRO do bloco filtrado em 14/09',
     inteiros.length + '', '0');
  chip('GC').click();
  await esperar(150);

  h3('0e. Desligado: volta aos números cheios, sem chamar a API');
  var antesTg = CHAMADAS.length;
  chip('Só preço de app').click();
  await esperar(150);
  var tg2 = chip('Só preço de app');
  eh(tg2.getAttribute('aria-pressed') === 'false', 'desligou', tg2.getAttribute('aria-pressed'), 'false');
  eh(CHAMADAS.length === antesTg, 'sem nova chamada à API (o filtro é de memória)',
     (CHAMADAS.length - antesTg) + ' chamada(s) nova(s)', '0');
  eh(val(0).indexOf(p3(gcAll.preco_medio)) >= 0, 'o card volta ao preço médio cheio',
     val(0), 'R$ ' + p3(gcAll.preco_medio));
  var redeDes = nums(document.querySelector('#palco .ap-rede'));
  eh(redeDes[0] === gcAll.cupons.toLocaleString('pt-BR'), 'e a REDE volta aos cupons cheios',
     redeDes[0], gcAll.cupons.toLocaleString('pt-BR'));
  // DAQUI PARA BAIXO O TOGGLE FICA DESLIGADO: as seções seguintes conferem os
  // números CHEIOS do fixture, que é o que elas sempre conferiram. Ligado,
  // cada uma delas passaria a comparar tela filtrada com fixture cheio.
  nota('o toggle fica DESLIGADO nas seções seguintes (elas conferem o bloco cheio)');

  h3('1. Quatro cards com valor');
  eh(cards().length === 4, 'quatro cards', cards().length + '', '4');
  nota('cards: ' + cards().map(function (c) {
    return c.querySelector('.ap-rot').textContent.trim() + ' ' + c.querySelector('.ap-num').textContent.trim();
  }).join('  ·  '));
  var ROTS = [rot(0), rot(1), rot(2), rot(3)].map(function (t) { return t.toUpperCase(); });
  eh(ROTS.join('|') === 'PREÇO MÉDIO|PREÇO MÍNIMO|PREÇO MÁXIMO|CUPONS',
     'na ordem pedida', [rot(0), rot(1), rot(2), rot(3)].join(' · '));
  var gc = FIX.soutag.rede.por_combustivel.filter(function (c) { return c.combustivel === 'GC'; })[0];
  eh(val(0).indexOf(gc.preco_medio.toLocaleString('pt-BR', {minimumFractionDigits:3, maximumFractionDigits:3})) >= 0,
     'PREÇO MÉDIO = o do GC da rede', val(0), 'R$ ' + gc.preco_medio);
  eh(cards().every(function (c) { return c.offsetWidth === 150 && c.offsetHeight === 96; }),
     'todos 150×96', cards()[0].offsetWidth + '×' + cards()[0].offsetHeight);

  h3('2. Lista, REDE no topo e ordem por litros');
  eh(!!document.querySelector('#palco .ap-rede'), 'a linha REDE existe');
  eh(document.querySelector('#palco .ap-rede .ap-nome').textContent.trim() === 'REDE', 'e diz REDE');
  var cab = document.querySelector('#palco .ap-cab');
  eh(!!cab, 'cabeçalho existe');
  nota('cabeçalho: ' + cab.textContent.replace(/\s+/g, ' ').trim());
  eh(linhasP().length === FIX.soutag.postos.length, 'uma linha por posto',
     linhasP().length + '', FIX.soutag.postos.length + '');
  // Ordem por litros do GC desc — o combustível do chip, não o total.
  var litrosGC = FIX.soutag.postos.map(function (p) {
    var c = p.por_combustivel.filter(function (x) { return x.combustivel === 'GC'; })[0];
    return { nome: p.nome, l: c ? c.litros : -Infinity };
  }).sort(function (a, b) { return b.l - a.l; }).map(function (x) { return x.nome; });
  eh(nomes().join('|') === litrosGC.join('|'), 'ordenada por litros de GC desc',
     nomes().slice(0, 3).join(' · '), litrosGC.slice(0, 3).join(' · '));

  h3('3. REDE = soma dos postos (no combustível do chip)');
  var somaCup = 0, somaLit = 0;
  FIX.soutag.postos.forEach(function (p) {
    var c = p.por_combustivel.filter(function (x) { return x.combustivel === 'GC'; })[0];
    if (c) { somaCup += c.cupons; somaLit += c.litros; }
  });
  var redeNums = nums(document.querySelector('#palco .ap-rede'));
  nota('REDE na tela: ' + redeNums.join(' · '));
  nota('soma dos postos em GC: ' + somaCup + ' cupons · ' + Math.round(somaLit) + ' L');
  eh(redeNums[0] === gc.cupons.toLocaleString('pt-BR'), 'cupons da REDE = os do GC da rede',
     redeNums[0], gc.cupons.toLocaleString('pt-BR'));
  // O cupom distinto da rede é <= a soma dos postos só se houver cupom
  // repetido entre postos; aqui a chave inclui o posto, então bate.
  eh(somaCup === gc.cupons, 'e batem com a soma dos postos', somaCup + '', gc.cupons + '');

  h3('4. Detalhe do posto: TODOS os combustíveis');
  var prim = linhasP()[0];
  var nomePrim = prim.querySelector('.ap-nome').textContent.trim();
  prim.click();
  await esperar(150);
  var det = document.querySelector('#palco .ap-det');
  eh(!!det, 'o detalhe abriu em ' + nomePrim);
  var pFix = FIX.soutag.postos.filter(function (p) { return p.nome === nomePrim; })[0];
  var nLin = det.querySelectorAll('tbody tr').length;
  nota(nomePrim + ' tem ' + pFix.por_combustivel.length + ' combustíveis no período');
  eh(nLin === pFix.por_combustivel.length, 'uma linha por combustível do posto',
     nLin + '', pFix.por_combustivel.length + '');
  eh(det.textContent.indexOf('Itens') >= 0, 'e a coluna ITENS aparece (cupom ≠ item)');
  prim.click();
  await esperar(120);
  eh(!document.querySelector('#palco .ap-det'), 'clicar de novo fecha');

  h3('5. Chip GC → ET: muda valores SEM nova chamada');
  var antes = CHAMADAS.length, medGC = val(0);
  chip('ET').click();
  await esperar(180);
  eh(CHAMADAS.length === antes, 'nenhuma chamada nova', CHAMADAS.length + '', antes + '');
  var et = FIX.soutag.rede.por_combustivel.filter(function (c) { return c.combustivel === 'ET'; })[0];
  nota('GC ' + medGC + '  →  ET ' + val(0));
  eh(val(0) !== medGC, 'o preço médio mudou');
  eh(val(0).indexOf(et.preco_medio.toLocaleString('pt-BR', {minimumFractionDigits:3, maximumFractionDigits:3})) >= 0,
     'e é o do ET', val(0), 'R$ ' + et.preco_medio);
  eh(cards()[0].querySelector('.ap-sub').textContent.indexOf('ET') >= 0, 'a sublinha diz ET');
  chip('GC').click();
  await esperar(150);

  h3('6. Sub-botão 99: canal, cores e nova chamada');
  var antes2 = CHAMADAS.length;
  var corSoutag = getComputedStyle(document.querySelector('#palco .ap-linha .ap-c-med')).color;
  subBtn('99').click();
  await esperar(300);
  eh(CHAMADAS.length === antes2 + 1, 'uma chamada nova', (CHAMADAS.length - antes2) + '', '1');
  eh(/canal=99/.test(CHAMADAS[CHAMADAS.length - 1]), 'com canal=99', CHAMADAS[CHAMADAS.length - 1]);
  eh(linhasP().length === FIX.n99.postos.length, 'a lista virou a do 99',
     linhasP().length + '', FIX.n99.postos.length + '');
  var b99 = subBtn('99');
  nota('botão 99: cor ' + getComputedStyle(b99).color + ' · fundo ' + getComputedStyle(b99).backgroundColor);
  eh(getComputedStyle(b99).backgroundColor === 'rgb(250, 238, 218)', 'fundo âmbar #FAEEDA no ativo',
     getComputedStyle(b99).backgroundColor, 'rgb(250, 238, 218)');
  eh(getComputedStyle(b99).color === 'rgb(99, 56, 6)', 'texto âmbar #633806',
     getComputedStyle(b99).color, 'rgb(99, 56, 6)');
  var corN99 = getComputedStyle(document.querySelector('#palco .ap-linha .ap-c-med')).color;
  eh(corN99 !== corSoutag, 'a coluna PREÇO MÉD. trocou de cor', corSoutag + ' → ' + corN99);
  eh(corN99 === 'rgb(99, 56, 6)', 'e é o âmbar do canal', corN99);
  subBtn('Soutag').click();
  await esperar(300);
  var bS = subBtn('Soutag');
  eh(getComputedStyle(bS).backgroundColor === 'rgb(238, 237, 254)', 'e o Soutag volta ao roxo #EEEDFE',
     getComputedStyle(bS).backgroundColor, 'rgb(238, 237, 254)');

  h3('7. Cards ordenam a lista');
  var porLitros = nomes()[0];
  cards()[3].click();     // CUPONS
  await esperar(150);
  var porCupons = FIX.soutag.postos.map(function (p) {
    var c = p.por_combustivel.filter(function (x) { return x.combustivel === 'GC'; })[0];
    return { nome: p.nome, v: c ? c.cupons : -Infinity };
  }).sort(function (a, b) { return b.v - a.v; })[0].nome;
  nota('por litros: ' + porLitros + '  ·  por cupons: ' + nomes()[0]);
  eh(nomes()[0] === porCupons, 'clicar em CUPONS reordena', nomes()[0], porCupons);
  cards()[3].click();
  await esperar(150);
  eh(nomes()[0] === porLitros, 'clicar de novo volta para litros', nomes()[0], porLitros);

  h3('8. Grade fixa de 7 colunas');
  var cols = colsDe('.ap-cab');
  nota('colunas: ' + cols.join(' '));
  eh(cols.length === 7, 'sete colunas', cols.length + '', '7');
  eh(cols.every(function (c) { return c === '150px'; }), 'todas de 150px (nada de 1fr)', cols.join(' '));
  eh(colsDe('.ap-linha').length === 7 && colsDe('.ap-rede').length === 7,
     'linha e REDE acompanham', colsDe('.ap-linha').length + '/' + colsDe('.ap-rede').length);

  h3('9. "Por motorista" visível e desativado');
  var pm = [].slice.call(document.querySelectorAll('#palco .ap-atalho'))
    .filter(function (b) { return /motorista/i.test(b.textContent); })[0];
  eh(!!pm, 'o botão existe');
  eh(pm.disabled === true, 'está desativado');
  eh(/aguardando dados do convênio/.test(pm.title), 'com o tooltip', pm.title);

  h3('10. Estreito (375px)');
  h3('10. O chip de GNV');
  var chipsComb = [].slice.call(document.querySelectorAll('#palco .ap-chips .ap-chip'))
    .map(function (c) { return c.textContent.trim(); });
  nota('chips: ' + chipsComb.join(' · '));
  eh(chipsComb.join('|') === 'GC|GA|ET|S10|GNV', 'cinco chips, GNV depois de S10',
     chipsComb.join('|'), 'GC|GA|ET|S10|GNV');
  var gnvFix = (FIX.soutag.rede.por_combustivel || [])
    .filter(function (c) { return c.combustivel === 'GNV'; })[0];
  eh(!!gnvFix, 'a resposta traz GNV na rede',
     gnvFix ? gnvFix.itens + ' itens · ' + gnvFix.cupons + ' cupons' : '(ausente)');
  var antesGnv = CHAMADAS.length;
  chip('GNV').click();
  await esperar(150);
  eh(CHAMADAS.length === antesGnv, 'clicar não chama a API', (CHAMADAS.length - antesGnv) + '', '0');
  eh(chip('GNV').getAttribute('aria-pressed') === 'true', 'o chip fica marcado');
  if (gnvFix) {
    eh(val(0).indexOf(p3(gnvFix.preco_medio)) >= 0, 'os cards passam a mostrar o GNV',
       val(0), 'R$ ' + p3(gnvFix.preco_medio));
    eh(cards()[0].querySelector('.ap-sub').textContent.indexOf('GNV') >= 0,
       'e a sublinha diz GNV', cards()[0].querySelector('.ap-sub').textContent.trim());
    var redeGnv = nums(document.querySelector('#palco .ap-rede'));
    eh(redeGnv[0] === gnvFix.cupons.toLocaleString('pt-BR'), 'a REDE conta os cupons de GNV',
       redeGnv[0], gnvFix.cupons.toLocaleString('pt-BR'));
  }
  // Só os postos que venderam GNV têm número; os outros ficam com travessão,
  // que é a regra que já valia para qualquer combustível.
  var comGnv = (FIX.soutag.postos || []).filter(function (p) {
    return (p.por_combustivel || []).some(function (c) { return c.combustivel === 'GNV'; });
  });
  nota('postos com GNV: ' + comGnv.length + ' — ' + comGnv.map(function (p) { return p.nome; }).join(', '));
  var comNumero = linhasP().filter(function (l) {
    return nums(l)[0] !== '—';
  }).length;
  eh(comNumero === comGnv.length, 'e só eles têm número na lista',
     comNumero + '', comGnv.length + '');
  chip('GC').click();
  await esperar(150);

  h3('11. Layout centralizado e com respiro');
  var wrap = document.querySelector('#palco .ap-wrap');
  var sec = document.querySelector('#palco #s-app');
  var cw = getComputedStyle(wrap);
  eh(!!wrap, 'o .ap-wrap existe');
  eh(cw.maxWidth === '1400px', 'teto de 1400px', cw.maxWidth, '1400px');
  eh(cw.marginLeft === cw.marginRight && cw.marginLeft !== '0px',
     'margens laterais iguais (margin:0 auto centrando)', cw.marginLeft + ' / ' + cw.marginRight);
  eh(getComputedStyle(sec).display === 'block', 'a seção segue display:block (não flex)',
     getComputedStyle(sec).display, 'block');
  eh(cw.rowGap === '16px', 'gap de 16px entre filtros, cards e lista', cw.rowGap, '16px');
  // O teto morde de verdade: numa janela mais larga que 1400 o wrap para nele
  // e sobra faixa vazia dos dois lados.
  var larguraPalco = document.getElementById('palco').clientWidth;
  var larguraWrap = wrap.getBoundingClientRect().width;
  nota('palco ' + Math.round(larguraPalco) + 'px · wrap ' + Math.round(larguraWrap) + 'px');
  eh(larguraWrap <= 1400.5, 'o wrap não passa de 1400px', Math.round(larguraWrap) + 'px');
  var linha0 = linhasP()[0];
  eh(linha0.getBoundingClientRect().width <= 1400.5, 'e as linhas da lista param nele também',
     Math.round(linha0.getBoundingClientRect().width) + 'px', '<= 1400px');

  var cl = getComputedStyle(linha0);
  eh(cl.paddingTop === '10px' && cl.paddingBottom === '10px', 'linha da lista: padding 10px 0',
     cl.paddingTop + ' / ' + cl.paddingBottom, '10px / 10px');
  var cr = getComputedStyle(document.querySelector('#palco .ap-rede'));
  eh(cr.paddingBottom === '14px', 'REDE: 4px a mais embaixo', cr.paddingBottom, '14px');
  eh(parseFloat(cr.paddingBottom) - parseFloat(cl.paddingBottom) === 4,
     'que é exatamente 4px de diferença',
     (parseFloat(cr.paddingBottom) - parseFloat(cl.paddingBottom)) + 'px', '4px');
  eh(getComputedStyle(document.querySelector('#palco .ap-cards')).gap === '12px',
     'gap de 12px entre os cards', getComputedStyle(document.querySelector('#palco .ap-cards')).gap, '12px');
  eh(getComputedStyle(document.querySelector('#palco .ap-chips')).gap === '12px',
     'e entre os chips', getComputedStyle(document.querySelector('#palco .ap-chips')).gap, '12px');
  // Os cards seguem 150×96: o gap mudou, a medida do card não.
  eh(cards().every(function (c) { return c.offsetWidth === 150 && c.offsetHeight === 96; }),
     'e os cards continuam 150×96', cards()[0].offsetWidth + '×' + cards()[0].offsetHeight);
  // Detalhe indentado.
  linhasP()[0].click();
  await esperar(150);
  var det2 = document.querySelector('#palco .ap-det');
  eh(!!det2 && getComputedStyle(det2).paddingLeft === '20px', 'detalhe indentado 20px',
     det2 ? getComputedStyle(det2).paddingLeft : '(sem detalhe)', '20px');
  if (det2) { linhasP()[0].click(); await esperar(120); }

  var palco = document.getElementById('palco');
  palco.style.width = '375px';
  await esperar(200);
  // A media query é de viewport, não de contêiner — aqui só se confere que
  // nada estoura. A regra de cards 2×N é conferida no navegador a 375px.
  eh(document.documentElement.scrollWidth <= window.innerWidth + 1,
     'a página não ganha rolagem horizontal');
  palco.style.width = '';

  linhas.push('\n' + (falhas ? '<span class="bad">' + falhas + ' FALHA(S)</span>'
                             : '<span class="ok">TUDO PASSOU</span>'));
  pintar();
  document.title = (falhas ? falhas + ' FALHA(S)' : 'TUDO PASSOU') + ' — tela App';
}

rodar().catch(function (e) {
  linhas.push('\n<span class="bad">ERRO: ' + hesc(e.message) + '</span>');
  linhas.push(hesc(String(e.stack || '').split('\n').slice(0, 6).join('\n')));
  pintar();
  document.title = 'ERRO — tela App';
});
</script>
