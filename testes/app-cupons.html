<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela App — Soutag/99, cards e lista por posto</title>
<link rel="stylesheet" href="/shared/css/base.css">
<link rel="stylesheet" href="/modulos/painel-adm/painel-adm.css">
<style>
  html, body { height: auto; overflow: visible; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:var(--mono); font-size:12px; line-height:1.7; }
  .ok  { color:var(--ok); }
  .bad { color:var(--danger); font-weight:700; }
  h3   { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
         color:var(--text2); margin:16px 0 4px; }
  #res { white-space:pre-wrap; }
  #palco { border:1px dashed var(--border); padding:10px; margin:12px 0; }
</style>

<div id="res">rodando…</div>
<div id="palco"></div>

<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// A aba App, com o app-cupons.js DE PRODUÇÃO e o payload REAL do
// GET /app/cupons de 14/09/2026 (gerado da própria rota contra o banco —
// 2.412 cupons Soutag em 32 postos, 1.609 do 99 em 28).
//
// 1. Quatro cards com valor, e clicar num card reordena a lista.
// 2. Lista por posto ordenada por litros desc, com REDE no topo.
// 3. REDE = soma dos postos, no combustível do chip.
// 4. Detalhe de um posto abre com TODOS os combustíveis dele.
// 5. Chip GC vs ET troca os valores SEM nova chamada à API.
// 6. Sub-botão Soutag vs 99 troca o canal, as cores e refaz a chamada.
// 7. Sete colunas fixas de 150px (nada de 1fr) e cards 150×96.
// 8. Mobile (375px): cards 2 por linha e colunas de preço fora da linha.
// 11. O chip TODOS é o primeiro e o padrão: cards e listas mostram o nível
//     inteiro, com os total_* da resposta (somar por combustível contaria
//     cupom duas vezes).
// 12. A vista "Soutag vs TecnoX": importa um .xlsx no navegador, cruza por
//     posto + dia + combustível + valor (±R$ 0,50) e separa em conferido /
//     só TecnoX / só Soutag. A planilha do teste é GERADA com o SheetJS a
//     partir dos itens REAIS, então o cruzamento é exercitado de ponta a
//     ponta — inclusive a razão social ("POSTO BRUNA LTDA" → "P. BRUNA").
// 10. A vista "Por cupom": botão ao lado de "Por posto", lista item a item
//     com as seis colunas, badge do posto na cor do canal, chip de
//     combustível filtrando, cabeçalho ordenando, REDE no topo, aviso do
//     teto de 2.000, e troca de vista sem rebuscar.
// 9. O toggle "Só preço de app" vem LIGADO, tira os cupons cobrados no
//    preço da placa (GC de 14/09: 1.390 itens → 832), derruba o preço médio
//    e o máximo, NÃO chama a API, e desligado devolve os números cheios.
//    Posto cujos cupons foram todos de placa fica na lista com travessão.
// 10. O chip GNV existe, é o quinto, e recorta sem chamar a API.
// 11. O layout: wrap com teto de 1400px e centrado, linhas que param nele,
//     padding de 10px nas linhas (14 embaixo na REDE), gaps de 12 e 16, e o
//     detalhe indentado 20px. A seção segue display:block.
// 12. Os vãos VERTICAIS entre os três blocos, medidos em pixels de tela:
//     20px dos filtros aos cards, 20px dos cards ao cabeçalho da lista.
// ════════════════════════════════════════════════════════════════
var linhas = [], falhas = 0;
function h3(t) { linhas.push('\n<h3>' + t + '</h3>'); }
function hesc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function eh(cond, rot, obtido, esperado) {
  if (!cond) falhas++;
  linhas.push((cond ? '<span class="ok">OK  </span>' : '<span class="bad">FALHA</span>') +
    ' ' + hesc(rot) + (obtido === undefined ? '' : '  →  ' + hesc(obtido) +
      (esperado === undefined ? '' : '   (esperado ' + hesc(esperado) + ')')));
}
function nota(t) { linhas.push('     ' + hesc(t)); }
function pintar() { document.getElementById('res').innerHTML = linhas.join('\n'); }
function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var FIX = {};
var DET_ERRO = null;
var CHAMADAS = [];
// ════════ AS DUAS ROTAS DA SOUTAG ════════
// A comparação SAIU DO NAVEGADOR: o cruzamento mora em jbretas-api/lib/soutag.js,
// atrás da GET /app/soutag-comparar, e esta tela só desenha o que ela devolve.
//
// O dublê abaixo REPRODUZ o cruzamento para poder devolver um payload realista.
// Ele NÃO é a prova de que a conta está certa — essa é do harness da própria
// função, jbretas-api/teste-soutag.js, que roda sobre lib/soutag.js e cobre o
// um-para-um, o par mais próximo, os dois passos e a normalização de nome.
// O que ESTE arquivo prova é o lado de cá: que a tela lê a planilha, manda o
// corpo certo para a importação e desenha corretamente o que volta.
var SG_POST = null;      // o corpo do último POST /app/soutag-importar
var SG_LINHAS = [];      // o que está "gravado" no banco de mentira
var SG_ITENS = [];       // os itens da TecnoX que o servidor usaria
var SG_ARQ = null;
var SG_SO_APP = false;
function sgCruzarDuble() {
  var itens = SG_ITENS.map(function (i, k) {
    return { k: k, posto: i.nome_posto, data: i.data, comb: i.combustivel,
             valor: Number(i.valor_liquido) || 0, litros: Number(i.litros) || 0,
             preco: i.preco_litro, id: i.id_cupom,
             cupom: i.nome_posto + '|' + i.data + '|' + i.id_cupom, usado: false };
  });
  var porChave = {};
  itens.forEach(function (it) {
    var c = it.posto + '|' + it.data + '|' + it.comb;
    (porChave[c] = porChave[c] || []).push(it);
  });
  var achar = function (l, tol) {
    var cand = porChave[l.posto + '|' + l.data + '|' + l.comb] || [], achou = null, melhor = Infinity;
    for (var k = 0; k < cand.length; k++) {
      if (cand[k].usado) continue;
      var d = Math.abs(cand[k].valor - l.valor);
      if (tol && d > 1.00) continue;
      if (d < melhor) { melhor = d; achou = cand[k]; }
    }
    return achou;
  };
  var r2 = function (v) { return Math.round(v * 100) / 100; };
  var semPosto = [], pend = [];
  SG_LINHAS.forEach(function (l) { (l.posto ? pend : semPosto).push(l); });
  var par = function (l, it, st) {
    return { status: st, data: l.data, posto: it.posto, comb: l.comb, valor: l.valor,
             valor_tecnox: it.valor, dif: r2(l.valor - it.valor), litros: l.litros,
             litros_tecnox: it.litros, preco: it.preco, id: l.id, id_cupom: it.id,
             cupom: it.cupom, usuario: l.usuario, posto_planilha: l.posto_planilha };
  };
  var conferido = [], resto = [];
  pend.forEach(function (l) {
    var it = achar(l, true);
    if (it) { it.usado = true; conferido.push(par(l, it, 'conferido')); } else resto.push(l);
  });
  var divergente = [], soSoutag = [];
  resto.forEach(function (l) {
    var it = achar(l, false);
    if (it) { it.usado = true; divergente.push(par(l, it, 'divergente')); }
    else soSoutag.push({ status: 'soutag', data: l.data, posto: l.posto, comb: l.comb,
      valor: l.valor, litros: l.litros, id: l.id, usuario: l.usuario, posto_planilha: l.posto_planilha });
  });
  var soTecnox = itens.filter(function (it) { return !it.usado; }).map(function (it) {
    return { status: 'tecnox', data: it.data, posto: it.posto, comb: it.comb,
             valor_tecnox: it.valor, litros_tecnox: it.litros, preco: it.preco,
             id_cupom: it.id, cupom: it.cupom };
  });
  var sgV = 0, semV = 0, txV = 0, txL = 0, cup = {};
  SG_LINHAS.forEach(function (l) { sgV += l.valor; });
  semPosto.forEach(function (l) { semV += l.valor; });
  itens.forEach(function (it) { txV += it.valor; txL += it.litros; cup[it.cupom] = 1; });
  var mapa = {}, ordem = [];
  var alvo = function (nome) {
    var n = nome || '(posto não reconhecido)';
    if (!mapa[n]) {
      mapa[n] = { nome: n, sg_n: 0, sg_v: 0, sg_l: 0, tx_n: 0, tx_v: 0, tx_l: 0, cupons: {},
                  conferido: 0, divergente: 0, soutag: 0, tecnox: 0, linhas: [], nao_reconhecido: !nome };
      ordem.push(mapa[n]);
    }
    return mapa[n];
  };
  var lancar = function (l) {
    var p = alvo(l.posto);
    p.linhas.push(l); p[l.status]++;
    if (l.status !== 'tecnox') { p.sg_n++; p.sg_v += l.valor; if (l.litros != null) p.sg_l += l.litros; }
    if (l.status !== 'soutag') { p.tx_n++; p.tx_v += l.valor_tecnox; p.tx_l += l.litros_tecnox;
      if (l.cupom) p.cupons[l.cupom] = 1; }
  };
  conferido.forEach(lancar); divergente.forEach(lancar); soSoutag.forEach(lancar); soTecnox.forEach(lancar);
  semPosto.forEach(function (l) {
    lancar({ status: 'soutag', data: l.data, posto: '', comb: l.comb, valor: l.valor,
             litros: l.litros, id: l.id, usuario: l.usuario, posto_planilha: l.posto_planilha });
  });
  ordem.forEach(function (p) {
    p.cupons_tx = Object.keys(p.cupons).length; delete p.cupons;
    p.sg_v = r2(p.sg_v); p.tx_v = r2(p.tx_v); p.dif = r2(p.sg_v - p.tx_v);
    p.ok = (p.sg_n === p.tx_n) && Math.abs(p.dif) <= 1.00 && !p.nao_reconhecido;
  });
  var nc = {};
  semPosto.forEach(function (l) {
    if (!nc[l.posto_planilha]) nc[l.posto_planilha] = { nome: l.posto_planilha, n: 0, perto: '', sim: 0, como: 'nenhum' };
    nc[l.posto_planilha].n++;
  });
  var blocoNR = ordem.filter(function (p) { return p.nao_reconhecido; })[0];
  if (blocoNR) blocoNR.linhas.forEach(function (l) { l.perto = ''; l.sim = 0; l.como = 'nenhum'; });
  return {
    success: true,
    consulta: { de: '2026-09-14', ate: '2026-09-14', so_app: SG_SO_APP, canal: 'SOUTAG',
                soutag_linhas: SG_LINHAS.length, tecnox_itens: itens.length,
                tecnox_itens_total: itens.length, itens_placa: 0,
                tolerancia_placa: 0.02, tolerancia_valor: 1.00 },
    preco_placa: {},
    ultima_importacao: SG_LINHAS.length ? { quando: '2026-09-17T18:30:00.000Z',
      arquivo: SG_ARQ, por: null, transacoes: SG_LINHAS.length } : null,
    conferido: conferido, divergente: divergente, soSoutag: soSoutag, soTecnox: soTecnox,
    semPosto: semPosto, itens: itens.length, postos: ordem,
    naoCasou: Object.keys(nc).map(function (k) { return nc[k]; }),
    sg: { valor: r2(sgV), n: SG_LINHAS.length, litros: null, sem_posto_valor: r2(semV) },
    tx: { valor: r2(txV), n: itens.length, litros: txL, cupons: Object.keys(cup).length },
  };
}
// O INVERSO da razaoSocial(), que e o que o servidor faz com lib/soutag.js.
// Aqui e proposital que seja BURRO: o duble so precisa saber a que posto cada
// razao social do teste corresponde, e reimplementar a normalizacao de
// verdade faria o teste medir a si mesmo. A normalizacao real tem harness
// proprio em jbretas-api/teste-soutag.js.
function sgPostoDaRazao(nome) {
  var mapa = window.__SG_DE_RAZAO || {};
  if (mapa[nome]) return mapa[nome];
  var n = String(nome || '').toUpperCase()
    .replace('AUTO POSTO ', '').replace('POSTOS ', '').replace('POSTO ', '')
    .replace(' POSTO DE SERVICO', '').replace(' COMERCIO DE COMBUSTIVEIS E LUBRIFICANTES', '')
    .replace('COMERCIO DE COMBUSTIVEIS ', '').replace(' COMERCIO DE COMBUSTIVEIS', '')
    .replace(' LTDA.', '').replace(' LTDA', '').replace(' ME', '').replace(' EIRELI', '').trim();
  var nomes = Object.keys(mapa).map(function (k) { return mapa[k]; });
  for (var i = 0; i < nomes.length; i++) {
    if (String(nomes[i]).toUpperCase().replace('P. ', '') === n) return nomes[i];
  }
  return '';
}
window.apiFetch = function (url, opts) {
  CHAMADAS.push(String(url));
  if (String(url).indexOf('/app/soutag-importar') === 0) {
    SG_POST = JSON.parse(opts.body);
    SG_ARQ = SG_POST.arquivo;
    // O servidor resolve o posto; aqui o dublê usa o mapa que o próprio teste
    // montou ao gerar a planilha (razão social -> nome do sistema).
    SG_LINHAS = SG_POST.transacoes.map(function (t) {
      return { posto: sgPostoDaRazao(t.posto_nome),
               posto_planilha: t.posto_nome, data: String(t.data).slice(0, 10),
               comb: t.combustivel, valor: Number(t.valor) || 0, litros: null,
               usuario: t.usuario, id: t.id_soutag };
    });
    var semP = SG_LINHAS.filter(function (l) { return !l.posto; }).length;
    return Promise.resolve({ success: true, periodo: { de: '2026-09-14', ate: '2026-09-14' },
      recebidas: SG_POST.transacoes.length, gravadas: SG_LINHAS.length, recusadas: 0,
      apagadas: 0, sem_posto: semP, nao_casou: [], arquivo: SG_ARQ,
      importado_por: 'HARNESS', importado_por_gravado: false });
  }
  if (String(url).indexOf('/app/soutag-comparar') === 0) {
    SG_SO_APP = /so_app=1/.test(String(url));
    return Promise.resolve(sgCruzarDuble());
  }
  // A rota de detalhe: dois fixtures REAIS de 14/09, um com so_app e um sem.
  if (String(url).indexOf('/app/cupons-detalhe') === 0) {
    if (DET_ERRO) return Promise.reject(DET_ERRO);
    return Promise.resolve(/so_app=1/.test(String(url)) ? FIX.detApp : FIX.det);
  }
  var m = /canal=([^&]+)/.exec(url);
  var canal = m ? decodeURIComponent(m[1]) : 'SOUTAG';
  return Promise.resolve(canal === '99' ? FIX.n99 : FIX.soutag);
};
window.mmFmt = null;   // o módulo tem fallback próprio de formatação

function baixar(u) {
  return new Promise(function (ok, er) {
    var x = new XMLHttpRequest();
    x.open('GET', u);
    x.onload = function () { ok(JSON.parse(x.responseText)); };
    x.onerror = function () { er(new Error(u + ' não carregou')); };
    x.send();
  });
}
function js(src) {
  return new Promise(function (ok, erro) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok;
    s.onerror = function () { erro(new Error(src + ' não carregou')); };
    document.body.appendChild(s);
  });
}
// rgb() -> #RRGGBB, para comparar com os hex do pedido.
function hexDe(rgb) {
  var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb);
  if (!m) return rgb;
  return '#' + [1, 2, 3].map(function (i) {
    return ('0' + Number(m[i]).toString(16)).slice(-2).toUpperCase();
  }).join('');
}
// litros() e reais() vivem DENTRO do IIFE do modulo — o harness nao os
// alcanca. Estes formatam igual: litros sem decimal + " L", reais com duas
// casas. toLocaleString e nao Math.round: no empate os dois arredondam para
// lados diferentes.
function litrosT(v) {
  return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' L';
}
function reaisT(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// pt-BR -> número. O ponto de milhar cai no [^0-9,] e o menos (o de teclado
// e o U+2212 que a tela usa) volta pelo sinal, que a limpeza tiraria.
function numBR(t) {
  var neg = /[-\u2212]/.test(String(t));
  var v = parseFloat(String(t).replace(/[^0-9,]/g, '').replace(',', '.'));
  return isNaN(v) ? NaN : (neg ? -v : v);
}
function precoT(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
}
// A TELA AGRUPA POR CUPOM e a rota devolve ITEM; o harness precisa do mesmo
// agrupamento para saber o que esperar. Mesma chave da tela: posto|data|cupom.
function agrupa(itens) {
  var m = {}, ord = [];
  itens.forEach(function (i) {
    var k = i.posto_id + '|' + i.data + '|' + i.id_cupom;
    if (!m[k]) {
      m[k] = { chave: k, combs: [], litros: 0, valor: 0, n: 0, posto: i.nome_posto, data: i.data };
      ord.push(m[k]);
    }
    var g = m[k];
    g.n++; g.litros += i.litros; g.valor += i.valor_liquido;
    if (g.combs.indexOf(i.combustivel) < 0) g.combs.push(i.combustivel);
  });
  return ord;
}
// CONTÉM, não "é": o chip GC mostra o cupom de GC+ET.
function contem(gs, c) {
  return gs.filter(function (g) { return g.combs.indexOf(c) >= 0; });
}
// "P. BRUNA" -> "POSTO BRUNA LTDA": a planilha da Soutag traz razão social,
// e é isso que a normalização da tela tem de desfazer. Sem regex de
// propósito — a barra invertida dentro de um patch gerado é onde o erro mora.
// O mapa INVERSO fica guardado: quem normaliza agora e o servidor, e o duble
// da rota precisa saber a que posto cada razao social corresponde — e nao vai
// reimplementar a normalizacao para descobrir (ela tem harness proprio em
// jbretas-api/teste-soutag.js).
window.__SG_DE_RAZAO = {};
function razaoSocial(nome) {
  var t = String(nome == null ? '' : nome);
  if (t.indexOf('P. ') === 0) t = t.slice(3);
  var r = 'POSTO ' + t + ' LTDA';
  window.__SG_DE_RAZAO[r] = String(nome == null ? '' : nome);
  return r;
}
function cards()   { return [].slice.call(document.querySelectorAll('#palco .ap-card')); }
function rot(i)    { var c = cards()[i]; return c ? c.querySelector('.ap-rot').textContent.trim() : null; }
function val(i)    { var c = cards()[i]; return c ? c.querySelector('.ap-num').textContent.trim() : null; }
function linhasP() { return [].slice.call(document.querySelectorAll('#palco .ap-linha')); }
function nomes()   { return linhasP().map(function (l) { return l.querySelector('.ap-nome').textContent.trim(); }); }
function nums(l)   { return [].slice.call(l.querySelectorAll('.ap-n')).map(function (s) { return s.textContent.trim(); }); }
function colsDe(sel) {
  var el = document.querySelector('#palco ' + sel);
  if (!el) return [];
  var v = getComputedStyle(el).gridTemplateColumns.trim();
  var m = /^repeat\((\d+),\s*([\d.]+px)\)$/.exec(v);
  if (m) { var o = []; for (var i = 0; i < Number(m[1]); i++) o.push(m[2]); return o; }
  return v.split(/\s+/);
}
// VÃO REAL entre dois blocos: o topo do de baixo menos a base do de cima.
// É o que se mede aqui, e não o valor declarado de gap/margin — foi
// exatamente essa a falha que deixou passar um `gap:16px` no .ap-wrap que
// não separava nada (o wrap tem um filho só, o #ap-corpo). Valor declarado
// prova que o CSS foi escrito; vão prova que ele produziu espaço.
function vao(a, b) {
  var ea = document.querySelector('#palco ' + a), eb = document.querySelector('#palco ' + b);
  if (!ea || !eb) return null;
  return Math.round(eb.getBoundingClientRect().top - ea.getBoundingClientRect().bottom);
}
function chip(t) {
  return [].slice.call(document.querySelectorAll('#palco .ap-chip'))
    .filter(function (b) { return b.textContent.trim() === t; })[0];
}
function subBtn(t) {
  return [].slice.call(document.querySelectorAll('#palco .ap-cbtn'))
    .filter(function (b) { return b.textContent.trim() === t; })[0];
}

// ════════════════════════════════════════════════════════════════
async function rodar() {
  if (window.innerWidth < 700) {
    linhas.push('<span class="bad">JANELA ESTREITA (' + window.innerWidth + 'px)</span>');
    nota('Este teste mede a grade de 7 colunas, que só existe a partir de 700px.');
    pintar();
    throw new Error('rode com a janela em 700px ou mais');
  }
  FIX.soutag = await baixar('/testes/fixtures-app-cupons-soutag.json');
  FIX.n99    = await baixar('/testes/fixtures-app-cupons-99.json');
  nota('fixture SOUTAG: ' + FIX.soutag.rede.total_cupons + ' cupons · ' + FIX.soutag.postos.length + ' postos');
  nota('fixture 99    : ' + FIX.n99.rede.total_cupons + ' cupons · ' + FIX.n99.postos.length + ' postos');

  var sec = document.createElement('section');
  sec.className = 'scr active';
  sec.id = 's-app';
  document.getElementById('palco').appendChild(sec);
  await js('/modulos/painel-adm/app-cupons.js');
  renderAppCupons(sec);
  await esperar(300);

  h3('0. A chamada');
  nota('chamadas: ' + CHAMADAS.join(' | '));
  eh(CHAMADAS.length === 1, 'uma chamada na abertura', CHAMADAS.length + '', '1');
  eh(/canal=SOUTAG/.test(CHAMADAS[0]), 'canal padrão = SOUTAG', CHAMADAS[0]);
  eh(/de=\d{4}-\d{2}-\d{2}&ate=\d{4}-\d{2}-\d{2}/.test(CHAMADAS[0]), 'com de e ate (padrão ontem)');

  h3('0b. O toggle "Só preço de app"');
  // Os dois blocos que a rota manda: o cheio e o filtrado, mesma forma.
  var gcDe = function (n) {
    return ((n && n.por_combustivel) || []).filter(function (c) { return c.combustivel === 'GC'; })[0] || null;
  };
  var p3 = function (v) {

       (cd.querySelector('.ap-cd-nota') || {}).textContent || '(sem nota)');

  // O SheetJS é o MESMO que a tela usa (carregado sob demanda pelo módulo).

  var XLSX;
  try {
    XLSX = await new Promise(function (ok, er) {
      var sc = document.createElement('script');

    })[0];
    eh(!!avisoN && /INEXISTENTE/.test(avisoN.textContent),
       'e o aviso nomeia o que não casou', avisoN ? avisoN.textContent.trim() : '(nenhum)');

    h3('25b. Clicar no posto expande os cupons');
    eh(!document.querySelector('#palco .ap-sg-det'), 'nenhum posto aberto antes do clique');
    lp.click();
    await esperar(240);
    var detP = document.querySelector('#palco .ap-sg-det');
    eh(!!detP, 'clicar expande');
    if (detP) {
      var linsD = [].slice.call(detP.querySelectorAll('.ap-sg-lin'));
      eh(linsD.length > 0, 'com os cupons individuais do posto', linsD.length + ' linha(s)');
      var tagsD = {};
      linsD.forEach(function (l) { tagsD[l.querySelector('.ap-sg-tag').textContent.trim()] = 1; });
      nota('fontes no detalhe: ' + Object.keys(tagsD).join(' · '));
      eh(!!tagsD['conferido'], 'cada linha com o badge da fonte, e o conferido está entre elas',
         Object.keys(tagsD).join(','));
      var tgOk = linsD.filter(function (l) {
        return l.querySelector('.ap-sg-tag').textContent.trim() === 'conferido';
      })[0].querySelector('.ap-sg-tag');
      eh(hexDe(getComputedStyle(tgOk).color) === '#0F6E56', 'conferido em verde',
         hexDe(getComputedStyle(tgOk).color), '#0F6E56');
      // As duas colunas de valor, uma de cada fonte.
      var lConf = linsD.filter(function (l) {
        return l.querySelector('.ap-sg-tag').textContent.trim() === 'conferido';
      })[0];
      nota('linha conferida: ' + [].slice.call(lConf.children).map(function (e) { return e.textContent.trim(); }).join(' | '));
      eh(lConf.children[2].textContent.trim() !== '—' && lConf.children[3].textContent.trim() !== '—',
         'o conferido mostra o R$ dos DOIS lados',
         lConf.children[2].textContent.trim() + ' × ' + lConf.children[3].textContent.trim());
      var lTx = linsD.filter(function (l) {
        return l.querySelector('.ap-sg-tag').textContent.trim() === 'só TecnoX';
      })[0];
      if (lTx) {
        eh(lTx.children[2].textContent.trim() === '—',
           'e o só TecnoX deixa o lado Soutag em travessão', lTx.children[2].textContent.trim(), '—');
      }
    }
    lp.click();
    await esperar(200);
    eh(!document.querySelector('#palco .ap-sg-det'), 'clicar de novo fecha');

    h3('25c. Os cards de status filtram');
    var stBtn = function (rot) {
      return [].slice.call(document.querySelectorAll('#palco .ap-sg-cd--bt')).filter(function (b) {
        return b.querySelector('.ap-sg-cd-r').textContent.trim() === rot;
      })[0];
    };
    stBtn('valor divergente').click();
    await esperar(240);
    var pDiv = linhasSgp();
    nota('postos com valor divergente: ' + pDiv.map(nomeDe).join(' · '));
    eh(pDiv.length > 0 && pDiv.length < todosPostos.length,
       'o card "valor divergente" reduz a lista aos postos que têm alguma',
       pDiv.length + ' de ' + todosPostos.length);
    eh(stBtn('valor divergente').getAttribute('aria-pressed') === 'true', 'e o card fica aceso',
       stBtn('valor divergente').getAttribute('aria-pressed'), 'true');
    pDiv[0].click();
    await esperar(220);
    var linsF = [].slice.call(document.querySelectorAll('#palco .ap-sg-det .ap-sg-lin'));
    eh(linsF.length > 0 && linsF.every(function (l) {
         return l.querySelector('.ap-sg-tag').textContent.trim() === 'valor divergente';
       }), 'e o detalhe do posto mostra só as divergentes', linsF.length + ' linha(s)');
    pDiv[0].click();
    await esperar(180);
    // CLICAR DE NOVO SOLTA: sem isso quem clica num dos quatro cards fica
    // preso nele procurando um botão "todos" que não existe.
    stBtn('valor divergente').click();
    await esperar(240);
    eh(linhasSgp().length === todosPostos.length, 'clicar de novo no card solta o filtro',
       linhasSgp().length + '', todosPostos.length + '');
    eh(stBtn('valor divergente').getAttribute('aria-pressed') === 'false', 'e o card apaga',
       stBtn('valor divergente').getAttribute('aria-pressed'), 'false');

    h3('28. Normalização de razão social: os casos reais');
    // CADA CASO É UMA LINHA COPIADA DE UM ITEM VERDADEIRO daquele posto. Se o
    // nome casar, a linha confere; se não casar, cai em posto não reconhecido.
    // Uma coisa prova a outra, sem precisar alcançar a função de dentro do
    // IIFE. Esta planilha TEM coluna de litros — o caminho oposto ao da 24c.
    var porPosto = {};
    fonte.itens.forEach(function (i) {
      (porPosto[i.nome_posto] = porPosto[i.nome_posto] || []).push(i);
    });
    var CASOS = [
      ['AUTO POSTO ESPACO REAL LTDA', 'P. ESPAÇO REAL', 'AUTO POSTO + acento'],
      ['AVIVA COMERCIO DE COMBUSTIVEIS E LUBRIFICANTES LTDA', 'P. AVIVA', 'LUBRIFICANTES'],
      ['PLANALTO POSTO DE SERVICO LTDA', 'P. PLANALTO', 'POSTO DE SERVICO'],
      ['POSTOS URBANO FERRAZ LTDA', 'P. URBANO FERRAZ', 'POSTOS no plural'],
      ['COMERCIO DE COMBUSTIVEIS ALEX LTDA', 'P. ALEX', 'COMERCIO DE COMBUSTIVEIS na frente'],
      ['POSTO BOM BOM LTDA', 'P. BOMBOM FILIAL', 'espaço a mais + matriz/filial ambíguo'],
      ['POSTO ESPASSO REAL LTDA', 'P. ESPAÇO REAL', 'escrito errado (similaridade)'],
    ];
    var rows2 = [], usados = {};
    CASOS.forEach(function (cs, k) {
      // Um item AINDA NÃO USADO do posto: ESPAÇO REAL entra duas vezes (o
      // certo e o errado), e os dois disputando o mesmo item deixariam o
      // segundo sem par — o teste culparia a normalização por um problema de
      // cruzamento.
      var it = (porPosto[cs[1]] || []).filter(function (x) { return !usados[x.id]; })[0];
      usados[it.id] = 1;
      cs.push(it);
      rows2.push({ 'Posto': cs[0], 'Data/Hora': it.data + ' 07:0' + k + ':00',
                   'Valor': it.valor_liquido, 'Combustível': COMBNOME[it.combustivel] || it.combustivel,
                   'Litros': it.litros, 'ID': 'NR' + k });
    });
    var ws2 = XLSX.utils.json_to_sheet(rows2);
    var wb2 = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2, ws2, 'Transacoes');
    var buf2 = XLSX.write(wb2, { type: 'array', bookType: 'xlsx' });
    var inp2 = document.getElementById('ap-sg-file');
    var dt2 = new DataTransfer();
    dt2.items.add(new File([buf2], 'soutag-razao-social.xlsx',
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    inp2.files = dt2.files;
    await window.__apSgArquivo(inp2);
    await esperar(400);
    nota('casos: ' + CASOS.map(function (c) { return c[0] + ' → ' + c[1]; }).join(' | '));
    eh(!document.querySelector('#palco .ap-erro'), 'a planilha de razão social foi lida',
       (document.querySelector('#palco .ap-erro') || {}).textContent || 'sem erro');

    // ════════ A NORMALIZAÇÃO NÃO É MAIS DAQUI ════════
    // Ela vivia neste módulo e foi para jbretas-api/lib/soutag.js, porque o
    // posto passou a ser resolvido NA IMPORTAÇÃO e gravado em
    // soutag_transacao.posto_id. Estes sete casos continuam cobertos — um a
    // um, com o nome do sistema esperado — no harness da própria função:
    //
    //     cd jbretas-api && npm run test:soutag
    //
    // Afirmar aqui que "POSTO ESPASSO REAL LTDA" vira "P. ESPAÇO REAL"
    // exigiria reimplementar a normalização dentro deste arquivo, e o teste
    // passaria a medir a própria cópia — verde dos dois lados no dia em que
    // o servidor mudasse. O que SOBRA para este harness provar é o contrato
    // do lado de cá: a razão social sai CRUA no corpo da importação, sem a
    // tela tentar adivinhar nada.
    var enviados = (SG_POST && SG_POST.transacoes || []).map(function (t) { return t.posto_nome; });
    nota('enviados crus: ' + enviados.join(' | '));
    eh(enviados.length === CASOS.length,
       'as ' + CASOS.length + ' linhas foram para a rota', enviados.length + '', CASOS.length + '');
    var crus = CASOS.every(function (c) { return enviados.indexOf(c[0]) >= 0; });
    eh(crus, 'cada razão social foi enviada EXATAMENTE como está na planilha',
       crus ? 'todas' : enviados.join(','), CASOS.map(function (c) { return c[0]; }).join(','));
    eh(enviados.every(function (n) { return !/^P\. /.test(n); }),
       'e nenhuma chegou já normalizada (quem normaliza é o servidor)',
       enviados.filter(function (n) { return /^P\. /.test(n); }).join(',') || 'nenhuma');
    var comSg = linhasSgp().filter(function (l) { return numBR(nums(l)[0]) > 0; }).map(nomeDe).sort();
    nota('postos com linha da Soutag (pelo dublê, que não normaliza de verdade): ' + comSg.join(' · '));
    // ════════ O QUE MUDOU AO O CRUZAMENTO IR PARA O SERVIDOR ════════
    // "BOM BOM" casa por prefixo com BOMBOM MATRIZ e BOMBOM FILIAL, e o nome
    // não desempata. ANTES quem desempatava era o VALOR, no cruzamento: a
    // linha vinha de um item da FILIAL e ia para lá.
    //
    // AGORA NÃO MAIS, e isso é consequência do desenho pedido: o posto é
    // resolvido NA IMPORTAÇÃO e gravado em soutag_transacao.posto_id, e nesse
    // momento o cruzamento ainda não aconteceu — não há valor para desempatar.
    // Ambíguo grava posto_id NULL.
    //
    // O DADO NÃO SE PERDE: a linha aparece como "posto não reconhecido" com o
    // nome original, entra no total da planilha e é nomeada no aviso. O que se
    // perde é a atribuição automática ao posto certo.
    eh(comSg.indexOf('P. BOMBOM FILIAL') < 0 && comSg.indexOf('P. BOMBOM MATRIZ') < 0,
       'e "POSTO BOM BOM LTDA" fica AMBÍGUO (não é mais desempatado pelo valor)',
       comSg.filter(function (n) { return /BOMBOM/.test(n); }).join(',') || '(nenhum)',
       '(nenhum)');
    // ════════ OS LITROS NÃO SOBREVIVEM À GRAVAÇÃO ════════
    // ESTA planilha TRAZ a coluna de litros, e antes disso o lado Soutag saía
    // do travessão por causa dela. Agora não: a tabela soutag_transacao não
    // tem coluna de litros (não está na especificação dela), então o volume
    // morre na importação e o bloco volta ao travessão.
    //
    // A tela NÃO quebra — ela já sabia lidar com "a planilha não traz volume",
    // e é esse mesmo caminho que ela toma. O que se perde é a conferência de
    // litros, que passa a não existir nunca, e não só quando o arquivo não
    // tem a coluna.
    //
    // O front JÁ MANDA os litros no corpo da importação e a rota já os monta:
    // criando a coluna (bloco OPCIONAL no fim de sql/soutag_transacao.sql),
    // isto volta a funcionar sem uma linha de código — e estas três asserções
    // voltam a ser as de cima, que ficam no git para quando isso acontecer.
    var blSg2 = document.querySelector('#palco .ap-sg-bloco--sg');
    nota('Soutag: ' + blSg2.textContent.replace(/\s+/g, ' ').trim());
    eh(!!SG_POST && SG_POST.transacoes[0].litros > 0,
       'a tela MANDA os litros da planilha para a rota',
       SG_POST && SG_POST.transacoes[0].litros, '> 0');
    eh(/não traz a coluna/.test(blSg2.textContent),
       'mas sem a coluna no banco o volume não volta, e o bloco diz travessão',
       blSg2.textContent.replace(/\s+/g, ' ').trim());
    eh(cardV('Diferença litros') === '—',
       'e o card de diferença de litros fica em travessão (dado que não veio, não divergência)',
       cardV('Diferença litros'), '—');
  }
  // Volta ao estado das seções finais.
  vb('Por posto').click();
  chip('GC').click();
  await esperar(200);

  var palco = document.getElementById('palco');
  palco.style.width = '375px';
  await esperar(200);
  // A media query é de viewport, não de contêiner — aqui só se confere que
  // nada estoura. A regra de cards 2×N é conferida no navegador a 375px.
  eh(document.documentElement.scrollWidth <= window.innerWidth + 1,
     'a página não ganha rolagem horizontal');
  palco.style.width = '';

  linhas.push('\n' + (falhas ? '<span class="bad">' + falhas + ' FALHA(S)</span>'
                             : '<span class="ok">TUDO PASSOU</span>'));
  pintar();
  document.title = (falhas ? falhas + ' FALHA(S)' : 'TUDO PASSOU') + ' — tela App';
}

rodar().catch(function (e) {
  linhas.push('\n<span class="bad">ERRO: ' + hesc(e.message) + '</span>');
  linhas.push(hesc(String(e.stack || '').split('\n').slice(0, 6).join('\n')));
  pintar();
  document.title = 'ERRO — tela App';
});
</script>
