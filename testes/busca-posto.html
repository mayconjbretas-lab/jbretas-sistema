<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logística — busca dentro do dropdown</title>
<link rel="stylesheet" href="/shared/css/base.css">
<link rel="stylesheet" href="/modulos/logistica/logistica.css">
<style>
  html, body { height: auto; overflow: visible; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:var(--mono); font-size:12px; line-height:1.7; }
  .ok  { color:var(--ok); }
  .bad { color:var(--danger); font-weight:700; }
  h3   { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
         color:var(--text2); margin:16px 0 4px; }
  #res { white-space:pre-wrap; }
  /* O palco reproduz a MEDIDA da sidebar de produção (.logi-sidebar), porque
     a largura do campo é a metade do que este teste tem de provar. */
  #palco { border:1px dashed var(--border); padding:10px; margin:12px 0;
           width: 260px; display:flex; flex-direction:column; gap:1rem; }
</style>

<div id="res">rodando…</div>
<div id="palco"></div>

<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// COMBOBOX PROPRIO com a busca DENTRO do dropdown. O <select> nativo nao
// aceita campo no painel dele (quem desenha aquilo e o navegador), entao a
// cara fechada e um <button> com o visual do .sel-posto e o painel aberto e
// um <div> nosso: input colado no topo, lista embaixo. Sem biblioteca.
//
// 1. Fechado, a cara tem a MESMA caixa do <select> de bandeira ao lado.
// 2. Clicar abre; o input esta DENTRO do painel e ACIMA da lista.
// 3. Digitar filtra as opcoes embaixo, por TRECHO e sem acento.
// 4. "Todos os postos" sempre visivel; limpar mostra todos de novo.
// 5. Clicar numa opcao seleciona, fecha e dispara UM change (a matriz
//    carrega uma vez) — o <select> segue sendo quem manda.
// 6. Reabrir vem limpo, com a escolha marcada.
// 7. Clicar fora fecha sem trocar o posto.
// 8. Setas, Enter e Esc.
// 9. Trocar a bandeira remonta a lista e fecha o painel.
// 10. A 375px o painel acompanha a largura e nada estoura.
//
// Com o app.js e o index.html DE VERDADE. A sessao e dublada porque a tela
// redireciona sem ela.
// ════════════════════════════════════════════════════════════════
var linhas = [], falhas = 0;
function h3(t) { linhas.push('\n<h3>' + t + '</h3>'); }
function hesc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function eh(cond, rot, obtido, esperado) {
  if (!cond) falhas++;
  linhas.push((cond ? '<span class="ok">OK  </span>' : '<span class="bad">FALHA</span>') +
    ' ' + hesc(rot) + (obtido === undefined ? '' : '  →  ' + hesc(obtido) +
      (esperado === undefined ? '' : '   (esperado ' + hesc(esperado) + ')')));
}
function nota(t) { linhas.push('     ' + hesc(t)); }
function pintar() { document.getElementById('res').innerHTML = linhas.join('\n'); }
function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function cx(el) {
  if (!el) return null;
  var r = el.getBoundingClientRect();
  return { l: Math.round(r.left), w: Math.round(r.width), h: Math.round(r.height) };
}
function opcoes() {
  return [...document.querySelectorAll('#pb-lista .pb-op')].map(function (li) { return li.textContent; });
}
// .focus() NAO dispara o handler de focus quando a janela do navegador nao
// esta em primeiro plano — e o harness roda num painel que pode estar atras.
// Focar e EMITIR o evento cobre os dois casos, e e o mesmo evento que o
// usuario gera ao clicar no campo.
function focar(el) {
  el.focus();
  el.dispatchEvent(new FocusEvent('focus', { bubbles: false }));
}
function tecla(el, k) {
  el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
}

// ── dublês ───────────────────────────────────────────────────────
var CARGAS = 0, CHANGES = 0;
window.exigirSessao = function () { return { id: 'h', nome: 'Harness', perfil: 'ADM' }; };
window.aplicarTema = function () {};
window.caminhoRaiz = function () { return '/'; };
window.matrizMedicao = { montar: function () {}, desfazer: function () {}, salvar: function () {},
  mesAtual: function () { return null; }, ajustarSticky: function () {},
  carregar: function () { CARGAS++; } };
window.medicaoFabs = { montar: function () {}, setVisivel: function () {} };
window.medicaoPdf = { montar: function () {} };
window.medicaoAlteracoes = { montar: function () {} };
window.solicitacoesLogistica = { montarEm: function () {} };
window.renderCustoMargem = function () {};
window.renderEscala = function () {};
window.renderKpi = function () {};
// Os nomes são os de produção, inclusive os dois que o teste procura por
// trecho e um com acento, que é o ponto do pbSemAcento.
var POSTOS_FIX = [
  { nome: 'P. ANA LUCIA', bandeira: 'IPIRANGA' },
  { nome: 'P. TOPAZIO', bandeira: 'IPIRANGA' },
  { nome: 'P. ESPAÇO REAL', bandeira: 'VIBRA' },
  { nome: 'P. SANTA INES - JOAQUIM', bandeira: 'VIBRA' },
  { nome: 'P. BERNARDO', bandeira: 'ALE' },
];
window.apiFetch = function (url) {
  if (url.indexOf('/postos') === 0) return Promise.resolve({ postos: POSTOS_FIX });
  return Promise.resolve({ total: 0 });
};
try { localStorage.setItem('jb_logi_versao', 'desktop'); } catch (e) {}

async function montarPalco() {
  var doc = new DOMParser().parseFromString(
    await (await fetch('/modulos/logistica/index.html')).text(), 'text/html');
  // Os DOIS blocos da sidebar, do documento real: bandeira e posto.
  var blocos = [...doc.querySelectorAll('.logi-sidebar .sb-block')].slice(0, 2);
  if (blocos.length !== 2) throw new Error('nao achei os dois .sb-block da sidebar');
  blocos.forEach(function (b) { document.getElementById('palco').appendChild(document.importNode(b, true)); });
  if (!document.getElementById('pb-input')) throw new Error('o index.html nao tem o #pb-input');
  // A nav e os hosts que o app.js procura.
  var nav = doc.querySelector('.nav-list');
  if (nav) document.getElementById('palco').appendChild(document.importNode(nav, true));
  ['matriz-host', 'matriz-vazio', 'faixa-pedido', 'tab-matriz'].forEach(function (id) {
    if (document.getElementById(id)) return;
    var d = document.createElement('div'); d.id = id;
    document.getElementById('palco').appendChild(d);
  });
}
function carregarApp() {
  return new Promise(function (ok, erro) {
    var s = document.createElement('script');
    s.src = '/modulos/logistica/app.js';
    s.onload = ok; s.onerror = function () { erro(new Error('app.js nao carregou')); };
    document.body.appendChild(s);
  });
}

// ════════════════════════════════════════════════════════════════
async function rodar() {
  await montarPalco();
  await carregarApp();
  pbMontar();
  var sel  = document.getElementById('sel-posto');
  var face = document.getElementById('pb-face');
  var pnl  = document.getElementById('pb-painel');
  var inp  = document.getElementById('pb-input');
  sel.addEventListener('change', function () { CHANGES++; });
  await carregarPostos();
  await esperar(80);

  function ops() {
    return [].slice.call(document.querySelectorAll('#palco .pb-op')).map(function (li) { return li.textContent; });
  }
  function digitar(t) {
    inp.value = t;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function clicarOp(txt) {
    var li = [].slice.call(document.querySelectorAll('#palco .pb-op'))
      .filter(function (x) { return x.textContent === txt; })[0];
    if (!li) return false;
    li.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
    return true;
  }
  function foraDoCombo() {
    document.body.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
  }

  h3('1. Fechado: a cara do <select>');
  eh(!!face && !!pnl && !!sel, 'cara, painel e select existem');
  eh(getComputedStyle(sel).display === 'none', 'o <select> continua no DOM e ESCONDIDO',
     getComputedStyle(sel).display, 'none');
  eh(pnl.hidden === true, 'o painel começa fechado');
  eh(face.classList.contains('sel-posto'), 'a cara herda .sel-posto (mesmo visual)');
  eh(face.getAttribute('aria-expanded') === 'false', 'aria-expanded=false');
  // Mesma caixa do <select> de bandeira logo acima — é a prova de "visual
  // idêntico ao select atual".
  var selB = document.getElementById('sel-bandeira');
  var cf = cx(face), cb = cx(selB);
  nota('cara ' + cf.w + '×' + cf.h + '  ·  select de bandeira ' + cb.w + '×' + cb.h);
  eh(cf.w === cb.w, 'mesma largura do select de bandeira', cf.w + ' vs ' + cb.w);
  eh(Math.abs(cf.h - cb.h) <= 1, 'e a mesma altura (±1px)', cf.h + ' vs ' + cb.h);
  eh(face.textContent.indexOf('Todos os postos') >= 0, 'mostra o rótulo selecionado',
     face.textContent.replace(/\s+/g, ' ').trim());

  h3('2. Clicar abre o painel com a busca NO TOPO');
  face.click();
  await esperar(60);
  eh(pnl.hidden === false, 'o painel abriu');
  eh(face.getAttribute('aria-expanded') === 'true', 'aria-expanded=true');
  // A busca tem de estar DENTRO do painel, e ACIMA da lista.
  eh(pnl.contains(inp), 'o input está DENTRO do painel');
  var lst = document.getElementById('pb-lista');
  eh(pnl.contains(lst), 'a lista também');
  var rI = inp.getBoundingClientRect(), rL = lst.getBoundingClientRect();
  nota('input top ' + Math.round(rI.top) + ' · lista top ' + Math.round(rL.top));
  eh(rI.bottom <= rL.top + 1, 'e o input fica ACIMA da lista',
     Math.round(rI.bottom) + ' <= ' + Math.round(rL.top));
  // O painel abre POR BAIXO da cara, sem empurrar nada.
  var rF = face.getBoundingClientRect(), rP = pnl.getBoundingClientRect();
  eh(rP.top >= rF.bottom - 1, 'o painel abre abaixo da cara',
     Math.round(rP.top) + ' >= ' + Math.round(rF.bottom));
  eh(getComputedStyle(pnl).position === 'absolute', 'e por cima (position absolute)');
  eh(inp.placeholder === 'Buscar posto…', 'placeholder', inp.placeholder, 'Buscar posto…');
  var lupa = pnl.querySelector('.pb-lupa');
  eh(!!lupa && lupa.textContent.trim() === '🔎', 'a lupa está no campo', lupa && lupa.textContent.trim());
  eh(document.activeElement === inp, 'o foco já está no campo de busca');
  eh(ops().length === 6, 'abre com a lista inteira ("Todos" + 5)', ops().length + '', '6');

  h3('3. Digitar filtra as opções embaixo');
  digitar('ana');
  nota('"ana" → ' + ops().join(' · '));
  eh(ops().indexOf('P. ANA LUCIA') >= 0, '"ana" acha P. ANA LUCIA');
  eh(ops().indexOf('P. TOPAZIO') < 0, 'e tira P. TOPAZIO');
  digitar('topa');
  eh(ops().join('|') === 'Todos os postos|P. TOPAZIO', '"topa" deixa só o TOPAZIO', ops().join('|'));
  digitar('espaco');
  eh(ops().indexOf('P. ESPAÇO REAL') >= 0, '"espaco" acha "P. ESPAÇO REAL" (sem acento)', ops().join('|'));
  digitar('JOAQUIM');
  eh(ops().indexOf('P. SANTA INES - JOAQUIM') >= 0, 'casa por TRECHO, não pelo começo', ops().join('|'));
  eh(pnl.contains(inp) && !pnl.hidden, 'o painel segue aberto enquanto se digita');

  h3('4. "Todos os postos" sempre visível, e limpar mostra todos');
  ['', 'ana', 'topa', 'zzz', 'P.'].forEach(function (t) {
    digitar(t);
    eh(ops()[0] === 'Todos os postos', 'primeira opção com termo ' + JSON.stringify(t), ops()[0]);
  });
  digitar('zzz');
  eh(ops().join('|') === 'Todos os postos', 'termo sem resultado deixa só "Todos os postos"', ops().join('|'));
  digitar('');
  eh(ops().length === 6, 'limpar o texto mostra todos de novo', ops().length + '', '6');

  h3('5. Clicar numa opção seleciona e fecha');
  var c0 = CARGAS, ch0 = CHANGES;
  digitar('bern');
  eh(clicarOp('P. BERNARDO'), 'a opção está na lista filtrada');
  await esperar(80);
  eh(pnl.hidden === true, 'o painel fechou');
  eh(sel.value === 'P. BERNARDO', 'o <select> recebeu o valor', sel.value);
  eh(CHANGES === ch0 + 1, 'o change saiu UMA vez', (CHANGES - ch0) + '', '1');
  eh(CARGAS === c0 + 1, 'e a matriz carregou UMA vez', (CARGAS - c0) + '', '1');
  eh(POSTO_ATUAL === 'P. BERNARDO', 'o app leu o posto', POSTO_ATUAL);
  eh(face.textContent.indexOf('P. BERNARDO') >= 0, 'a cara mostra o posto escolhido',
     face.textContent.replace(/\s+/g, ' ').trim());
  eh(/BERNARDO/.test(decodeURIComponent(location.hash)), 'e o hash acompanha', location.hash || '(vazio)');

  h3('6. Reabrir vem limpo e com a escolha marcada');
  face.click();
  await esperar(60);
  eh(inp.value === '', 'o campo de busca abre vazio', JSON.stringify(inp.value));
  eh(ops().length === 6, 'com a lista inteira', ops().length + '', '6');
  var marcada = pnl.querySelector('.pb-op.pb-sel');
  eh(!!marcada && marcada.textContent === 'P. BERNARDO', 'e a opção atual vem marcada',
     marcada && marcada.textContent);

  h3('7. Clicar fora fecha, sem trocar o posto');
  var ch1 = CHANGES;
  foraDoCombo();
  await esperar(60);
  eh(pnl.hidden === true, 'o painel fechou');
  eh(CHANGES === ch1, 'sem change nenhum', (CHANGES - ch1) + '', '0');
  eh(sel.value === 'P. BERNARDO', 'e o posto continua o mesmo', sel.value);

  h3('8. Teclado');
  face.click();
  await esperar(60);
  digitar('p.');
  tecla(inp, 'ArrowDown');
  var sob = pnl.querySelector('.pb-op.pb-on');
  eh(!!sob, 'a seta marca uma opção', sob && sob.textContent);
  tecla(inp, 'Escape');
  await esperar(60);
  eh(pnl.hidden === true, 'Esc fecha');
  eh(sel.value === 'P. BERNARDO', 'sem trocar o posto', sel.value);
  // Enter escolhe a primeira da lista filtrada.
  face.click();
  await esperar(60);
  digitar('topa');
  var ch2 = CHANGES;
  tecla(inp, 'Enter');
  await esperar(80);
  eh(sel.value === 'P. TOPAZIO', 'Enter escolhe a primeira filtrada', sel.value);
  eh(CHANGES === ch2 + 1, 'e dispara UM change', (CHANGES - ch2) + '', '1');
  eh(pnl.hidden === true, 'fechando o painel');

  h3('9. Trocar a bandeira remonta a lista');
  var selB2 = document.getElementById('sel-bandeira');
  if (selB2) {
    selB2.value = 'ALE';
    selB2.dispatchEvent(new Event('change', { bubbles: true }));
    await esperar(90);
    eh(face.textContent.indexOf('Todos os postos') >= 0, 'a cara volta a "Todos os postos"',
       face.textContent.replace(/\s+/g, ' ').trim());
    eh(pnl.hidden === true, 'e o painel fica fechado');
    face.click();
    await esperar(60);
    eh(ops().indexOf('P. BERNARDO') >= 0, 'a lista é a da bandeira nova', ops().join('|'));
    foraDoCombo();
    await esperar(40);
  } else {
    nota('sem #sel-bandeira no palco — pulado');
  }

  h3('10. Estreito (375px)');
  var palco = document.getElementById('palco');
  var antes = palco.style.width;
  palco.style.width = '375px';
  await esperar(60);
  face.click();
  await esperar(60);
  var rF2 = face.getBoundingClientRect(), rP2 = pnl.getBoundingClientRect();
  eh(Math.abs(rP2.width - rF2.width) <= 1, 'o painel tem a largura da cara',
     Math.round(rP2.width) + ' vs ' + Math.round(rF2.width));
  eh(document.documentElement.scrollWidth <= window.innerWidth + 1,
     'e a página não ganha rolagem horizontal');
  foraDoCombo();
  palco.style.width = antes;

  linhas.push('\n' + (falhas ? '<span class="bad">' + falhas + ' FALHA(S)</span>'
                             : '<span class="ok">TUDO PASSOU</span>'));
  pintar();
  document.title = (falhas ? falhas + ' FALHA(S)' : 'TUDO PASSOU') + ' — busca de posto';
  // Deixa o painel aberto com um filtro, para o print mostrar o que o teste diz.
  await esperar(40);
  face.click();
  await esperar(60);
  digitar('an');
}

rodar().catch(function (e) {
  linhas.push('<span class="bad">ERRO: ' + hesc(e.message) + '</span>');
  linhas.push(hesc(String(e.stack || '').split('\n').slice(0, 6).join('\n')));
  pintar();
});
</script>
