<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logística — busca de posto acima da lista</title>
<link rel="stylesheet" href="/shared/css/base.css">
<link rel="stylesheet" href="/modulos/logistica/logistica.css">
<style>
  html, body { height: auto; overflow: visible; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:var(--mono); font-size:12px; line-height:1.7; }
  .ok  { color:var(--ok); }
  .bad { color:var(--danger); font-weight:700; }
  h3   { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
         color:var(--text2); margin:16px 0 4px; }
  #res { white-space:pre-wrap; }
  /* O palco reproduz a MEDIDA da sidebar de produção (.logi-sidebar), porque
     a largura do campo é a metade do que este teste tem de provar. */
  #palco { border:1px dashed var(--border); padding:10px; margin:12px 0;
           width: 260px; display:flex; flex-direction:column; gap:1rem; }
</style>

<div id="res">rodando…</div>
<div id="palco"></div>

<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// O campo de busca NAO substitui o <select>: sao dois controles separados e
// visiveis ao mesmo tempo, busca EM CIMA e lista EMBAIXO. (A versao anterior
// cobria o select com o input e desenhava uma lista propria em <ul>; este
// teste afirmava aquilo e foi reescrito junto com o desenho.)
//
// 1. Os dois no DOM e os dois a vista; nenhuma lista flutuante sobrou.
// 2. O campo termina antes de o select comecar, com lupa e a mesma largura.
// 3. Digitar filtra as <option> por TRECHO, sem acento e sem caixa.
// 4. "Todos os postos" e sempre a primeira, com ou sem filtro.
// 5. Filtrar NAO dispara change, NAO recarrega a matriz e NAO perde o posto
//    selecionado — que continua na lista mesmo sem casar com o termo.
// 6. O X (e o Esc) limpam, devolvem a lista inteira e mantem a escolha.
// 7. Escolher pelo select dispara UM change: e ele que carrega a matriz.
// 8. Trocar a bandeira remonta a lista e zera o termo.
// 9. A 375px o empilhamento se mantem e nada estoura.
//
// Com o app.js e o index.html DE VERDADE. A sessao e dublada porque a tela
// redireciona sem ela.
// ════════════════════════════════════════════════════════════════
var linhas = [], falhas = 0;
function h3(t) { linhas.push('\n<h3>' + t + '</h3>'); }
function hesc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function eh(cond, rot, obtido, esperado) {
  if (!cond) falhas++;
  linhas.push((cond ? '<span class="ok">OK  </span>' : '<span class="bad">FALHA</span>') +
    ' ' + hesc(rot) + (obtido === undefined ? '' : '  →  ' + hesc(obtido) +
      (esperado === undefined ? '' : '   (esperado ' + hesc(esperado) + ')')));
}
function nota(t) { linhas.push('     ' + hesc(t)); }
function pintar() { document.getElementById('res').innerHTML = linhas.join('\n'); }
function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function cx(el) {
  if (!el) return null;
  var r = el.getBoundingClientRect();
  return { l: Math.round(r.left), w: Math.round(r.width), h: Math.round(r.height) };
}
function opcoes() {
  return [...document.querySelectorAll('#pb-lista .pb-op')].map(function (li) { return li.textContent; });
}
// .focus() NAO dispara o handler de focus quando a janela do navegador nao
// esta em primeiro plano — e o harness roda num painel que pode estar atras.
// Focar e EMITIR o evento cobre os dois casos, e e o mesmo evento que o
// usuario gera ao clicar no campo.
function focar(el) {
  el.focus();
  el.dispatchEvent(new FocusEvent('focus', { bubbles: false }));
}
function tecla(el, k) {
  el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
}

// ── dublês ───────────────────────────────────────────────────────
var CARGAS = 0, CHANGES = 0;
window.exigirSessao = function () { return { id: 'h', nome: 'Harness', perfil: 'ADM' }; };
window.aplicarTema = function () {};
window.caminhoRaiz = function () { return '/'; };
window.matrizMedicao = { montar: function () {}, desfazer: function () {}, salvar: function () {},
  mesAtual: function () { return null; }, ajustarSticky: function () {},
  carregar: function () { CARGAS++; } };
window.medicaoFabs = { montar: function () {}, setVisivel: function () {} };
window.medicaoPdf = { montar: function () {} };
window.medicaoAlteracoes = { montar: function () {} };
window.solicitacoesLogistica = { montarEm: function () {} };
window.renderCustoMargem = function () {};
window.renderEscala = function () {};
window.renderKpi = function () {};
// Os nomes são os de produção, inclusive os dois que o teste procura por
// trecho e um com acento, que é o ponto do pbSemAcento.
var POSTOS_FIX = [
  { nome: 'P. ANA LUCIA', bandeira: 'IPIRANGA' },
  { nome: 'P. TOPAZIO', bandeira: 'IPIRANGA' },
  { nome: 'P. ESPAÇO REAL', bandeira: 'VIBRA' },
  { nome: 'P. SANTA INES - JOAQUIM', bandeira: 'VIBRA' },
  { nome: 'P. BERNARDO', bandeira: 'ALE' },
];
window.apiFetch = function (url) {
  if (url.indexOf('/postos') === 0) return Promise.resolve({ postos: POSTOS_FIX });
  return Promise.resolve({ total: 0 });
};
try { localStorage.setItem('jb_logi_versao', 'desktop'); } catch (e) {}

async function montarPalco() {
  var doc = new DOMParser().parseFromString(
    await (await fetch('/modulos/logistica/index.html')).text(), 'text/html');
  // Os DOIS blocos da sidebar, do documento real: bandeira e posto.
  var blocos = [...doc.querySelectorAll('.logi-sidebar .sb-block')].slice(0, 2);
  if (blocos.length !== 2) throw new Error('nao achei os dois .sb-block da sidebar');
  blocos.forEach(function (b) { document.getElementById('palco').appendChild(document.importNode(b, true)); });
  if (!document.getElementById('pb-input')) throw new Error('o index.html nao tem o #pb-input');
  // A nav e os hosts que o app.js procura.
  var nav = doc.querySelector('.nav-list');
  if (nav) document.getElementById('palco').appendChild(document.importNode(nav, true));
  ['matriz-host', 'matriz-vazio', 'faixa-pedido', 'tab-matriz'].forEach(function (id) {
    if (document.getElementById(id)) return;
    var d = document.createElement('div'); d.id = id;
    document.getElementById('palco').appendChild(d);
  });
}
function carregarApp() {
  return new Promise(function (ok, erro) {
    var s = document.createElement('script');
    s.src = '/modulos/logistica/app.js';
    s.onload = ok; s.onerror = function () { erro(new Error('app.js nao carregou')); };
    document.body.appendChild(s);
  });
}

// ════════════════════════════════════════════════════════════════
async function rodar() {
  await montarPalco();
  await carregarApp();
  pbMontar();
  var sel = document.getElementById('sel-posto');
  var inp = document.getElementById('pb-input');
  var bx  = document.getElementById('pb-x');
  sel.addEventListener('change', function () { CHANGES++; });
  await carregarPostos();
  await esperar(80);

  function digitar(t) {
    inp.value = t;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function ops() { return [...sel.options].map(function (o) { return o.textContent; }); }

  h3('1. Dois controles SEPARADOS, os dois à vista');
  eh(!!sel && !!inp, 'o #sel-posto e o #pb-input existem');
  eh(getComputedStyle(sel).display !== 'none', 'o select está VISÍVEL (não é mais coberto)',
     getComputedStyle(sel).display);
  eh(!document.querySelector('#palco .pb-lista'), 'e não há mais lista flutuante própria (<ul>)');
  eh(cx(inp).h > 0 && cx(sel).h > 0, 'os dois ocupam caixa na tela',
     'input ' + cx(inp).h + 'px · select ' + cx(sel).h + 'px');

  h3('2. A busca fica ACIMA da lista');
  var rI = inp.getBoundingClientRect(), rS = sel.getBoundingClientRect();
  nota('input top ' + Math.round(rI.top) + ' · select top ' + Math.round(rS.top));
  eh(rI.bottom <= rS.top + 1, 'o campo termina antes de o select começar',
     Math.round(rI.bottom) + ' <= ' + Math.round(rS.top));
  eh(inp.placeholder === 'Buscar posto…', 'placeholder', inp.placeholder, 'Buscar posto…');
  var lupa = document.querySelector('#palco .pb-lupa');
  eh(!!lupa && lupa.textContent.trim() === '🔎', 'a lupa está no campo', lupa && lupa.textContent.trim());
  eh(!!lupa && getComputedStyle(lupa).pointerEvents === 'none',
     'e não rouba o clique do campo', lupa && getComputedStyle(lupa).pointerEvents);
  eh(Math.abs(cx(inp).w - cx(sel).w) <= 1, 'campo e lista têm a mesma largura',
     cx(inp).w + 'px vs ' + cx(sel).w + 'px');

  h3('3. Filtra a LISTA por trecho, sem acento e sem caixa');
  eh(ops().length === 6, 'sem filtro: "Todos" + 5 postos', ops().length + '', '6');
  digitar('ana');
  nota('"ana" → ' + ops().join(' · '));
  eh(ops().indexOf('P. ANA LUCIA') >= 0, '"ana" acha P. ANA LUCIA');
  eh(ops().indexOf('P. TOPAZIO') < 0, 'e tira P. TOPAZIO');
  digitar('topa');
  eh(ops().join('|') === 'Todos os postos|P. TOPAZIO', '"topa" deixa só o TOPAZIO', ops().join('|'));
  digitar('espaco');
  eh(ops().indexOf('P. ESPAÇO REAL') >= 0, '"espaco" acha "P. ESPAÇO REAL" (sem acento)', ops().join('|'));
  digitar('JOAQUIM');
  eh(ops().indexOf('P. SANTA INES - JOAQUIM') >= 0, 'casa por TRECHO, não pelo começo', ops().join('|'));
  digitar('zzz');
  eh(ops().join('|') === 'Todos os postos', 'termo sem resultado deixa só "Todos os postos"', ops().join('|'));
  var conta = document.getElementById('pb-conta');
  eh(!!conta && !conta.hidden && /nenhum posto/.test(conta.textContent),
     'e a contagem avisa', conta && conta.textContent);

  h3('4. "Todos os postos" é SEMPRE a primeira');
  ['', 'ana', 'topa', 'zzz', 'P.'].forEach(function (t) {
    digitar(t);
    eh(ops()[0] === 'Todos os postos', 'primeira opção com termo ' + JSON.stringify(t), ops()[0]);
  });

  h3('5. Filtrar NÃO escolhe nem recarrega');
  digitar('');
  sel.value = 'P. BERNARDO';
  sel.dispatchEvent(new Event('change', { bubbles: true }));
  await esperar(60);
  var cargasAntes = CARGAS, changesAntes = CHANGES;
  nota('posto em tela: ' + sel.value + ' · cargas até aqui ' + CARGAS);
  digitar('ana');
  await esperar(40);
  eh(CHANGES === changesAntes, 'digitar não dispara change', CHANGES + '', changesAntes + '');
  eh(CARGAS === cargasAntes, 'e não recarrega a matriz', CARGAS + '', cargasAntes + '');
  // O SELECIONADO NÃO PODE SUMIR: sem isto o select perderia o value e o
  // posto em tela mudaria sozinho por causa de uma letra digitada.
  eh(sel.value === 'P. BERNARDO', 'o posto selecionado continua selecionado', sel.value);
  eh(ops().indexOf('P. BERNARDO') >= 0,
     'e continua NA LISTA mesmo não casando com "ana"', ops().join('|'));

  h3('6. O X limpa');
  digitar('ana');
  eh(!bx.hidden, 'o X aparece quando há texto');
  bx.click();
  await esperar(40);
  eh(inp.value === '', 'clicar no X esvazia o campo', JSON.stringify(inp.value));
  eh(bx.hidden, 'e o X some de novo');
  eh(ops().length === 6, 'a lista volta inteira', ops().length + '', '6');
  eh(document.activeElement === inp, 'o foco volta para o campo');
  eh(sel.value === 'P. BERNARDO', 'e o posto escolhido segue intacto', sel.value);
  digitar('topa');
  tecla(inp, 'Escape');
  await esperar(40);
  eh(inp.value === '', 'Esc também limpa', JSON.stringify(inp.value));

  h3('7. Escolher pelo select segue funcionando (é ele que manda)');
  digitar('ana');
  var c0 = CHANGES;
  sel.value = 'P. ANA LUCIA';
  sel.dispatchEvent(new Event('change', { bubbles: true }));
  await esperar(60);
  eh(CHANGES === c0 + 1, 'o change saiu UMA vez', (CHANGES - c0) + '', '1');
  eh(POSTO_ATUAL === 'P. ANA LUCIA', 'e o app leu o posto', POSTO_ATUAL);
  eh(/ANA/.test(decodeURIComponent(location.hash)), 'o hash acompanha', location.hash || '(vazio)');

  h3('8. Trocar a bandeira remonta a lista e zera a busca');
  digitar('ana');
  var selB = document.getElementById('sel-bandeira');
  if (selB) {
    selB.value = 'ALE';
    selB.dispatchEvent(new Event('change', { bubbles: true }));
    await esperar(80);
    eh(inp.value === '', 'o termo antigo foi zerado', JSON.stringify(inp.value));
    eh(ops().indexOf('P. BERNARDO') >= 0, 'e a lista é a da bandeira nova', ops().join('|'));
  } else {
    nota('sem #sel-bandeira no palco — pulado');
  }

  h3('9. Estreito (375px): empilhado e sem estouro');
  var palco = document.getElementById('palco');
  var larguraAntes = palco.style.width;
  palco.style.width = '375px';
  await esperar(60);
  var rI2 = inp.getBoundingClientRect(), rS2 = sel.getBoundingClientRect();
  eh(rI2.bottom <= rS2.top + 1, 'campo continua acima da lista',
     Math.round(rI2.bottom) + ' <= ' + Math.round(rS2.top));
  eh(rI2.width <= 375 && rS2.width <= 375, 'os dois cabem em 375px',
     Math.round(rI2.width) + ' / ' + Math.round(rS2.width));
  eh(document.documentElement.scrollWidth <= window.innerWidth + 1,
     'e a página não ganha rolagem horizontal');
  palco.style.width = larguraAntes;

  linhas.push('\n' + (falhas ? '<span class="bad">' + falhas + ' FALHA(S)</span>'
                             : '<span class="ok">TUDO PASSOU</span>'));
  pintar();
  document.title = (falhas ? falhas + ' FALHA(S)' : 'TUDO PASSOU') + ' — busca de posto';
  await esperar(40);
  digitar('ana');
}

rodar().catch(function (e) {
  linhas.push('<span class="bad">ERRO: ' + hesc(e.message) + '</span>');
  linhas.push(hesc(String(e.stack || '').split('\n').slice(0, 6).join('\n')));
  pintar();
});
</script>
