<!-- app.js DEPOIS do DOMContentLoaded: o init dele nao roda (sem sessao,
     sem /usuarios, sem topbar) e sobram so as funcoes de movimentacao. -->
<script>
(async () => {
  await new Promise(r => {
    const s = document.createElement('script');
    s.src = '/modulos/painel-ti/app.js';
    s.onload = r; s.onerror = () => { document.getElementById('res').textContent = 'FALHA: app.js nao carregou'; };
    document.head.appendChild(s);
  });
  window.ligarControlesMov();

  const linhas = [];
  let falhas = 0;
  const H = (t) => linhas.push('<h3>' + t + '</h3>');
  const chk = (ok, txt, obtido) => {
    if (!ok) falhas++;
    linhas.push('<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '  ok  ' : ' FALHA ') + '</span>' + txt +
      (obtido !== undefined ? '   <span style="color:var(--text3)">[' + String(obtido).slice(0, 120) + ']</span>' : ''));
  };
  // EQ: igualdade estrutural em cima do chk, para os casos que comparam valor.
  const EQ = (a, b, txt) => chk(JSON.stringify(a) === JSON.stringify(b), txt,
    JSON.stringify(a) + (JSON.stringify(a) === JSON.stringify(b) ? '' : ' != ' + JSON.stringify(b)));
  const corpo = () => document.getElementById('mv-corpo');
  const txt = () => corpo().textContent.replace(/\s+/g, ' ');
  const pintar = (c) => window.mvPintar(JSON.parse(JSON.stringify(CEN[c])));
  // Espera uma condicao virar verdadeira (com teto), em vez de chutar um
  // setTimeout: o que se quer e o estado, nao um numero de milissegundos.
  const ate = async (cond, ms = 2000) => {
    const fim = Date.now() + ms;
    while (Date.now() < fim) { if (cond()) return true; await new Promise(r => setTimeout(r, 5)); }
    return cond();
  };

  // ── 1. Cards: abastecimento exato, cupom marcado ──────────────
  H('1 · cards do dia (P. BERNARDO 08/09, dado real)');
  pintar('bernardo');
  const cards = [...corpo().querySelectorAll('.mv-card')];
  chk(cards.length === 5, 'cinco cards', cards.length);
  const cardPor = (lbl) => cards.find(c => c.querySelector('.mv-card-lbl').textContent.trim() === lbl);
  chk(cardPor('abastecimentos').querySelector('.mv-card-num').textContent.trim() === '588',
      'abastecimentos = 588 (soma de itens, exato)',
      cardPor('abastecimentos').querySelector('.mv-card-num').textContent.trim());
  const numCup = cardPor('cupons').querySelector('.mv-card-num');
  chk(numCup.textContent.trim() === '~585', 'cupons vem com til', numCup.textContent.trim());
  chk(numCup.classList.contains('aprox'), 'card de cupons marcado como aproximado');
  chk(cardPor('litros').querySelector('.mv-card-num').textContent.trim() === '26.955 L',
      'litros sem decimal', cardPor('litros').querySelector('.mv-card-num').textContent.trim());
  chk(cardPor('venda líquida').querySelector('.mv-card-num').textContent.includes('166.283'),
      'venda liquida = combustivel + produto',
      cardPor('venda líquida').querySelector('.mv-card-num').textContent.trim());
  chk(cardPor('R$ / abast.').querySelector('.mv-card-num').textContent.trim() === 'R$ 277,78',
      'ticket = R$ por abastecimento', cardPor('R$ / abast.').querySelector('.mv-card-num').textContent.trim());
  chk(/não existe contagem exata de cupom do dia/.test(txt()),
      'a nota explica por que o cupom nao fecha');
  // R$ 53,41 em R$ 163.388 de bruto = 0,03%. Com uma casa fixa isso lia
  // "0,0%", ou seja: zero. Abaixo de 1% o percentual ganha duas casas.
  chk(/Desconto concedido no dia: R\$ 53,41 \(0,03% do bruto\)/.test(txt()),
      'desconto do dia com percentual que nao arredonda para zero',
      (txt().match(/Desconto concedido[^.]*\./) || [''])[0]);

  // ── 2. Turno: nao inventa o 3 ─────────────────────────────────
  H('2 · quebra por turno');
  const turnos = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR TURNO/i.test(b.querySelector('.mv-bloco-tit').textContent));
  const nomesTurno = [...turnos.querySelectorAll('.mv-nome')].map(n => n.textContent.trim());
  chk(JSON.stringify(nomesTurno) === JSON.stringify(['Turno 1', 'Turno 2', 'Turno 4']),
      'mostra 1, 2 e 4 nesta ordem — e NAO inventa turno 3', nomesTurno.join(' | '));
  chk(!/Turno 3/.test(turnos.textContent), 'turno 3 nao existe na tela');
  chk(/não é contínua nem cronológica/.test(turnos.textContent.replace(/\s+/g, ' ')),
      'avisa que a numeracao nao e continua nem cronologica');
  chk(/~426/.test(turnos.textContent), 'cupom do turno vem com til (somou 2 combustiveis)');

  // ── 3. Pagamento: generico, sem-forma, sem litros ─────────────
  H('3 · quebra por forma de pagamento (cenario sujo: cod 82 + sem forma)');
  pintar('sujo');
  const pgto = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /FORMA DE PAGAMENTO/i.test(b.querySelector('.mv-bloco-tit').textContent));
  const tPgto = pgto.textContent.replace(/\s+/g, ' ');
  chk(/CARTAO \(adquirente não identificada no PDV\)/.test(tPgto),
      'cod 82 sai com a ressalva no rotulo, sem chutar adquirente');
  chk(/cartão cadastrado de forma genérica no PDV/.test(tPgto),
      'aviso explica o cadastro generico e quanto e');
  chk(/Cupom sem forma informada/.test(tPgto), 'sentinela SEM_PAGAMENTO ganha nome legivel');
  chk(!/SEM_PAGAMENTO/.test(tPgto), 'a sentinela crua nao vaza para a tela');
  chk(!/\bL\b/.test([...pgto.querySelectorAll('.mv-met')].map(m => m.textContent).join(' ')),
      'nenhuma metrica de litro na quebra de pagamento');
  chk(/não rateia litro/.test(tPgto), 'a legenda diz por que nao ha litro aqui');
  chk(/val_pagamento é o valor entregue/.test(tPgto), 'explica a diferenca (troco) contra a venda');
  const chips = [...pgto.querySelectorAll('.mv-tipo')].map(c => c.textContent.replace(/\s+/g, ' ').trim());
  chk(chips.length === 5, 'cinco categorias de ind_tipo', chips.length);
  // textContent cola o badge do codigo no rotulo (o espaco e o gap do flex).
  chk(chips.some(c => /^CCCrédito \/ frota R\$ 57\.557 34,5% · 9 forma\(s\)$/.test(c)),
      'chip do balde CC traz codigo, rotulo, valor, % e nº de formas', chips[0]);
  // Combustivel sem mapa nao repete o nome no badge do codigo.
  const linhaGnv = [...corpo().querySelectorAll('.mv-row')]
    .find(r => /GAS NATURAL VEICULAR/.test(r.textContent));
  chk(!linhaGnv.querySelector('.mv-cod'), 'combustivel sem mapa nao mostra badge repetindo o nome',
      linhaGnv.querySelector('.mv-nome').textContent.trim());

  // ── 4. Combustivel sem mapa ───────────────────────────────────
  H('4 · combustivel fora do MAPA_COMB');
  const bComb = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR COMBUSTÍVEL/i.test(b.querySelector('.mv-bloco-tit').textContent));
  chk(/GAS NATURAL VEICULAR/.test(bComb.textContent),
      'descricao crua aparece em vez de sumir do faturamento');

  // ── 5. Turno '?' vai para o fim ───────────────────────────────
  H('5 · balde de turno desconhecido');
  const t2 = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR TURNO/i.test(b.querySelector('.mv-bloco-tit').textContent));
  const nomes2 = [...t2.querySelectorAll('.mv-nome')].map(n => n.textContent.trim());
  chk(nomes2[nomes2.length - 1] === 'Turno ?',
      'turno "?" fica no FIM, nao na frente', nomes2.join(' | '));

  // ── 6. Canal nao promete Good Card ────────────────────────────
  H('6 · quebra por canal');
  const canal = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR CANAL/i.test(b.querySelector('.mv-bloco-tit').textContent));
  const nomesCanal = [...canal.querySelectorAll('.mv-nome')].map(n => n.textContent.trim());
  chk(nomesCanal.length === 3, 'tres canais', nomesCanal.join(' | '));
  chk(/App 99/.test(canal.textContent) && /Soutag/.test(canal.textContent) && /Pista/.test(canal.textContent),
      'os tres sao 99, Soutag e pista');
  chk(/Good Card, Ticket Car, Abastece Aí e afins não são canal/.test(canal.textContent.replace(/\s+/g, ' ')),
      'diz que Good Card e forma de pagamento, nao canal');

  // ── 7. Frentista: lista curta sai inteira ─────────────────
  // 14 nomes esta ABAIXO do gatilho de 30: cortar so esconderia dado sem ganho
  // de leitura. O agrupamento existe para intervalo longo — caso 17.
  H('7 · quebra por frentista (lista curta)');
  const frent = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR FRENTISTA/i.test(b.querySelector('.mv-bloco-tit').textContent));
  chk(frent.querySelectorAll('.mv-row').length === 14, 'os 14 frentistas saem inteiros',
      frent.querySelectorAll('.mv-row').length);
  chk(!document.getElementById('mv-frent-mais'), 'e sem linha de agrupamento');
  chk(/14 frentistas/.test(frent.querySelector('.mv-bloco-tit').textContent),
      'o cabecalho conta os 14');

  // ── 8. Dois vazios diferentes ─────────────────────────────────
  H('8 · dia sem PAGAMENTO x dia sem DADO');
  pintar('sem_pgto');
  const tSem = txt();
  chk(/Sem forma de pagamento neste dia/.test(tSem), 'sem-pagamento diz o que falta');
  chk(/01\/09\/2026/.test(tSem), 'explica que a TecnoX passou a mandar pagamentos em 01/09/2026');
  chk(!/Sem dado para esta data/.test(tSem), 'dia com venda NAO e tratado como sem dado');
  chk(document.querySelector('.mv-card-num').textContent.trim() === '—',
      'card de cupons vira travessao, nao zero nem chute',
      document.querySelector('.mv-card-num').textContent.trim());
  chk([...corpo().querySelectorAll('.mv-row')].length > 0, 'as outras quebras continuam desenhadas');

  pintar('sem_dado');
  chk(/Sem dado para esta data/.test(txt()), 'sem rollup diz "sem dado para esta data"');
  chk(/P\. BAHAMAS/.test(txt()) && /20\/09\/2026/.test(txt()),
      'nomeia posto e data em pt-BR', txt().slice(0, 110));
  chk(corpo().querySelectorAll('.mv-card').length === 0, 'nenhum card com numero inventado');

  // ── 9. Dia zerado: sem NaN ────────────────────────────────────
  H('9 · dia zerado');
  pintar('zerado');
  const tZero = txt();
  chk(!/NaN|Infinity|undefined|null/.test(tZero), 'nenhum NaN/Infinity/undefined na tela', tZero.slice(0, 130));
  chk(/Nenhum desconto concedido/.test(tZero), 'diz que nao houve desconto');
  chk(/Sem quebra por turno/.test(tZero), 'quebra vazia tem mensagem propria');

  // ── 10. mvCarregar de verdade: URL e erro ─────────────────────
  H('10 · mvCarregar (caminho real do fetch)');
  RESPOSTA = CEN.bernardo;
  await window.mvCarregar();
  chk(ULTIMA_URL === '/tecnox/movimentacao?posto_id=11111111-2222-3333-4444-555555555555&data=2026-09-08',
      'URL sai com posto_id e data', ULTIMA_URL);
  chk(corpo().querySelectorAll('.mv-card').length === 5, 'render pelo caminho do fetch');
  RESPOSTA = new Error('Acesso restrito ao TI');
  await window.mvCarregar();
  const msg = document.getElementById('mv-msg');
  chk(msg.style.display !== 'none' && /Acesso restrito ao TI/.test(msg.textContent),
      'erro da rota aparece na faixa, sem apagar a tela em silencio', msg.textContent);


  H('15 - modo INTERVALO: a faixa vira lista de dias');
  pintar('periodo');
  const fxP = corpo().querySelector('.mv-sinais');
  EQ(fxP.querySelector('.mv-sinais-tit').textContent.replace(/\s+/g, ' ').trim(),
     '3 dias com sinal neste intervalode 8 com dado - 1 vermelho - 3 amarelos'.replace(/-/g, '\u00b7'),
     'titulo conta DIAS com sinal, nao sinais');
  const linhasDia = [...fxP.querySelectorAll('.mv-dia-sinal')];
  EQ(linhasDia.length, 3, 'uma linha por dia com sinal');
  EQ(linhasDia.map(x => x.getAttribute('data-dia')), ['2026-09-04', '2026-09-05', '2026-09-07'],
     'os dias saem na ordem que a rota mandou');
  EQ(linhasDia.map(x => x.classList.contains('vermelho') ? 'V' : 'A').join(''), 'AVA',
     'o dia herda a cor do PIOR sinal que teve');
  chk(/04\/09/.test(linhasDia[0].textContent), 'data em pt-BR',
      linhasDia[0].textContent.replace(/\s+/g, ' ').trim());
  chk(/margem fora da faixa \(Gasolina aditivada\)/.test(linhasDia[0].textContent),
      'resumo nomeia o sinal e o escopo');
  chk(/desconto anormal .* pagamento menor que a venda/.test(linhasDia[2].textContent),
      'dia com dois sinais lista os dois', linhasDia[2].textContent.replace(/\s+/g, ' ').trim());
  chk(linhasDia.every(x => x.tagName === 'BUTTON'), 'cada dia e um <button> - foco por teclado');
  chk(/ver o dia/.test(fxP.textContent), 'a linha diz que leva ao dia');
  // Somar sinais no intervalo seria errado: os cards somam, a faixa NAO.
  chk(!/4 sinais neste/.test(fxP.textContent), 'NAO soma os 4 sinais como se fossem do intervalo');
  chk(/nao avaliado/.test(fxP.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g, '')),
      'diz que houve dia com sinal nao avaliado');

  H('16 - clicar num dia troca o filtro para aquele dia');
  RESPOSTA = CEN.bernardo; ULTIMA_URL = null;
  document.getElementById('mv-modo').value = 'periodo';
  linhasDia[1].click();
  // O clique dispara mvCarregar(), que e assincrono: um tick nao basta e a
  // corrida deixava o render do dia chegar DEPOIS do proximo caso.
  await ate(() => (document.getElementById('mv-data') || {}).value === '2026-09-05'
                  && corpo().querySelectorAll('.mv-card').length === 5);
  EQ(document.getElementById('mv-modo').value, 'dia', 'o recorte volta para dia unico');
  EQ(document.getElementById('mv-data').value, '2026-09-05', 'e a data vira a do dia clicado');
  chk(/data=2026-09-05/.test(ULTIMA_URL || ''), 'a rota e chamada com aquele dia', ULTIMA_URL);
  chk(!/de=|ate=/.test(ULTIMA_URL || ''), 'e sem de/ate');
  EQ(document.getElementById('mv-f-data').hidden, false, 'o campo Data reaparece');
  EQ(document.getElementById('mv-f-de').hidden, true, 'e os de/ate somem');
  // O atributo hidden nao basta: .tx-f declara display:flex, que vence o
  // [hidden] do navegador. Sem `.tx-f[hidden]{display:none}` no CSS os tres
  // campos de data apareciam juntos. Afirma sobre o ESTILO COMPUTADO.
  EQ(getComputedStyle(document.getElementById('mv-f-de')).display, 'none',
     'e somem de verdade — display computado, nao so o atributo');
  chk(getComputedStyle(document.getElementById('mv-f-data')).display !== 'none',
      'enquanto o campo Data volta a ocupar espaco');

  H('17 - escopo e teto de frentista no intervalo');
  pintar('periodo');
  const esc = corpo().querySelector('.mv-escopo').textContent.replace(/\s+/g, ' ');
  chk(/01\/09\/2026 a 08\/09\/2026/.test(esc) && /8 dias com dado/.test(esc),
      'escopo diz posto e intervalo', esc);
  let frP = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR FRENTISTA/i.test(b.querySelector('.mv-bloco-tit').textContent));
  EQ(frP.querySelectorAll('.mv-row').length, 20, '34 frentistas -> mostra os 20 maiores');
  const btnFr = document.getElementById('mv-frent-mais');
  chk(/\+ 14 frentistas/.test(btnFr.textContent), 'e agrupa os outros 14',
      btnFr.textContent.replace(/\s+/g, ' ').trim());
  chk(/R\$/.test(btnFr.textContent), 'com o quanto o resto soma');
  btnFr.click();
  frP = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR FRENTISTA/i.test(b.querySelector('.mv-bloco-tit').textContent));
  EQ(frP.querySelectorAll('.mv-row').length, 34, 'clicar no grupo abre os 34');
  // Abaixo do gatilho lista todos - cortar 21 nomes so esconderia dado.
  pintar('bernardo');
  const frD = [...corpo().querySelectorAll('.mv-bloco')]
    .find(b => /POR FRENTISTA/i.test(b.querySelector('.mv-bloco-tit').textContent));
  EQ(frD.querySelectorAll('.mv-row').length, 5, 'lista curta sai inteira, sem agrupar');
  EQ(document.getElementById('mv-frent-mais'), null, 'e sem botao de agrupar');

  H('18 - intervalo limpo x intervalo longo com pouco dado');
  pintar('periodo_limpo');
  chk(/Nenhum sinal neste intervalo/.test(corpo().textContent), 'intervalo limpo diz que esta limpo');
  chk(/8 dia\(s\) conferido\(s\)/.test(corpo().textContent), 'e quantos dias conferiu');
  EQ(corpo().querySelectorAll('.mv-dia-sinal').length, 0, 'sem linhas de dia');
  pintar('periodo_longo');
  const escL = corpo().querySelector('.mv-escopo').textContent.replace(/\s+/g, ' ');
  chk(/19 dias com dado no rollup/.test(escL), 'pediu 8 meses e diz que so 19 dias tem dado', escL);
  chk(/de 21\/08\/2026 a 08\/09\/2026/.test(escL), 'e mostra a janela real que o rollup cobre', escL);

  // ── 12. SINAIS (camada 2) ─────────────────────────────────────
  H('12 · faixa de sinais');
  pintar('sujo');
  const fx = corpo().querySelector('.mv-sinais');
  chk(!!fx, 'a faixa existe');
  // Tem de vir ANTES dos cards: e o motivo de a tela existir.
  chk(fx.compareDocumentPosition(corpo().querySelector('.mv-cards')) & Node.DOCUMENT_POSITION_FOLLOWING,
      'a faixa vem ANTES dos cards do dia');
  EQ(fx.querySelector('.mv-sinais-tit').textContent.replace(/\s+/g, ' ').trim(),
     '3 sinais neste dia1 vermelho · 2 amarelos', 'titulo conta e classifica (textContent cola o contador)',
     fx.querySelector('.mv-sinais-tit').textContent.replace(/\s+/g, ' ').trim());
  const sin = [...fx.querySelectorAll('.mv-sinal')];
  EQ(sin.length, 3, 'tres sinais desenhados');
  // ORDEM: quem ordena e a rota (vermelho primeiro). A tela tem de PRESERVAR
  // essa ordem — nao reordenar, e nao embaralhar.
  EQ(sin.map(x => x.classList.contains('vermelho') ? 'V' : 'A').join(''), 'VAA',
     'a tela preserva a ordem da rota: vermelho primeiro, amarelos depois');
  EQ(sin.filter(x => x.classList.contains('amarelo')).length, 2, 'e dois amarelos');
  // AMARELO E VERMELHO DISTINTOS: classes diferentes, e cores diferentes de
  // verdade no CSS computado (nao so nome de classe).
  const corV = getComputedStyle(sin[0]).borderLeftColor;
  const corA = getComputedStyle(sin.find(x => x.classList.contains('amarelo'))).borderLeftColor;
  chk(corV !== corA, 'vermelho e amarelo tem cor de borda diferente', corV + ' x ' + corA);
  chk(getComputedStyle(sin[0]).backgroundColor !== getComputedStyle(sin.find(x => x.classList.contains('amarelo'))).backgroundColor,
      'e fundo diferente — a distincao nao depende so da borda');
  // MEDIDO E ESPERADO LADO A LADO, como o pedido descreve.
  const tVerm = sin[0].textContent.replace(/\s+/g, ' ');
  chk(/Desconto acima do normal do posto/.test(tVerm), 'o sinal e nomeado', tVerm.slice(0, 60));
  // Uma casa acima de 1%, duas abaixo (mvPct e adaptativo) — e exatamente o
  // formato do pedido: "desconto 3,1% · media do posto 0,9%".
  chk(/3,1%/.test(tVerm), 'traz o valor medido com uma casa');
  chk(/média do posto 0,89%/.test(tVerm), 'e o esperado do posto ao lado', tVerm);
  chk(/250 dias/.test(tVerm), 'com o tamanho da base');
  chk(/R\$ 5\.068,42/.test(tVerm), 'e o desconto em R$, nao so o percentual');
  // Margem: faixa com as duas pontas, em R$/L.
  const tMarg = sin.find(x => /Margem/.test(x.textContent)).textContent.replace(/\s+/g, ' ');
  chk(/R\$ 0,4541\/L/.test(tMarg), 'margem medida em R$/L com 4 casas', tMarg);
  chk(/faixa do posto R\$ 0,5793\/L a R\$ 0,8221\/L/.test(tMarg), 'faixa com as duas pontas', tMarg);
  // Pagamento negativo dentro do teto: o caso que so acende por ser negativo.
  const tPg = sin.find(x => /Pagamentos somam/.test(x.textContent)).textContent.replace(/\s+/g, ' ');
  chk(/-0,44%/.test(tPg), 'delta negativo aparece com sinal', tPg);
  chk(/teto do rollup/.test(tPg), 'e diz contra o que foi comparado');
  // Nao avaliado aparece mesmo havendo sinais.
  chk(/Não avaliado:/.test(fx.textContent), 'o que nao foi avaliado tambem e dito');
  chk(/GAS NATURAL VEICULAR/.test(fx.querySelector('.mv-sinais-na').textContent),
      'nomeando o combustivel sem custo');

  H('13 · dia limpo x dia sem base');
  pintar('limpo');
  const fxL = corpo().querySelector('.mv-sinais');
  chk(/Nenhum sinal neste dia/.test(fxL.textContent), 'dia limpo diz que esta limpo — nao fica em branco');
  EQ(fxL.querySelectorAll('.mv-sinal').length, 0, 'sem itens');
  EQ(fxL.querySelector('.mv-sinais-na'), null, 'e sem linha de "nao avaliado" quando tudo foi avaliado');
  chk(fxL.querySelector('.mv-sinais-tit').classList.contains('limpo'), 'o titulo muda de cor no dia limpo');
  // Fim de semana: limpo E com margem nao avaliada. Sao frases diferentes.
  pintar('fds');
  const fxF = corpo().querySelector('.mv-sinais');
  chk(/Nenhum sinal neste dia/.test(fxF.textContent), 'fim de semana tambem diz "nenhum sinal"');
  chk(/fim de semana e feriado/.test(fxF.querySelector('.mv-sinais-na').textContent),
      'MAS avisa que a margem nao foi avaliada, e por que');
  EQ(fxF.querySelectorAll('.mv-sinais-na b').length, 4, 'um por combustivel nao avaliado');
  pintar('sem_pgto');
  chk(/pagamentos/.test(corpo().querySelector('.mv-sinais-na').textContent),
      'dia sem forma de pagamento explica que o alarme 3 nao rodou');

  H('14 · payload sem o bloco de sinais nao quebra a tela');
  const velho = JSON.parse(JSON.stringify(CEN.bernardo));
  delete velho.sinais;
  window.mvPintar(velho);
  EQ(corpo().querySelector('.mv-sinais'), null, 'sem o bloco, a faixa some em vez de inventar');
  EQ(corpo().querySelectorAll('.mv-card').length, 5, 'e a camada 1 continua desenhada');

  // ── 11. ontemLocal(): o bug de fuso dos DOIS campos de data ───
  // Os campos de data da sonda e da movimentacao usavam
  // `new Date(); setDate(-1); toISOString().slice(0,10)`. toISOString converte
  // para UTC: num fuso negativo, depois das 21h o UTC ja virou o dia, e
  // "ontem" saia como HOJE. Mesmo bug que o teste-medicao-fuso.js documentou
  // na API. Aqui o relogio e congelado para a janela do bug existir de fato.
  H('11 · ontemLocal() e o fuso (janela das 21h)');
  const DateReal = window.Date;
  function comRelogio(iso, fn) {
    const t = new DateReal(iso).getTime();
    window.Date = class extends DateReal {
      constructor() { if (!arguments.length) super(t); else super(...arguments); }
      static now() { return t; }
    };
    try { return fn(); } finally { window.Date = DateReal; }
  }
  // "Ontem" independente da implementacao: -24h e le os getters LOCAIS.
  const ontemEsperado = (iso) => {
    const d = new DateReal(new DateReal(iso).getTime() - 86400000);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  };
  // Como era ANTES, para provar que o teste discrimina.
  const comoEraAntes = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); };

  const offMin = new DateReal().getTimezoneOffset();   // 180 em Brasilia (UTC-3)
  const CASOS = [
    // 21h30 local do ultimo dia do mes: o UTC ja esta no mes seguinte.
    { iso: '2026-10-01T00:30:00Z', nome: '30/09 21:30 BRT (vira o mes em UTC)' },
    { iso: '2027-01-01T02:00:00Z', nome: '31/12 23:00 BRT (vira o ano em UTC)' },
    { iso: '2026-09-30T23:59:00Z', nome: '30/09 20:59 BRT (fora da janela)' },
    { iso: '2026-03-01T02:00:00Z', nome: '28/02 23:00 BRT (ano nao bissexto)' },
    { iso: '2026-09-09T15:00:00Z', nome: '09/09 12:00 BRT (meio-dia comum)' },
  ];
  let divergiu = 0;
  CASOS.forEach(c => {
    const obtido = comRelogio(c.iso, () => window.ontemLocal());
    const antes  = comRelogio(c.iso, comoEraAntes);
    const esp    = ontemEsperado(c.iso);
    chk(obtido === esp, c.nome + ' → ontem local', obtido + (antes !== esp ? '  (antes dava ' + antes + ')' : ''));
    if (antes !== esp) divergiu++;
  });
  // Se em NENHUM caso a versao antiga divergisse, o teste nao provaria nada.
  // Em fuso negativo (Brasilia = +180 de offset) a janela existe.
  chk(offMin <= 0 || divergiu >= 2,
      'o teste discrimina: a versao antiga erra em pelo menos 2 casos',
      divergiu + ' divergência(s), offset ' + offMin + 'min');

  // ── Barra de cenarios p/ inspecao visual ──────────────────────
  const barra = document.getElementById('barra');
  barra.innerHTML = Object.keys(CEN).map(k => '<button data-cen="' + k + '">' + k + '</button>').join('');
  barra.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    RESPOSTA = null; document.getElementById('mv-msg').style.display = 'none';
    pintar(b.getAttribute('data-cen'));
  });
  pintar('sujo');   // cenario default: o que tem TODOS os casos de aviso

  document.getElementById('res').innerHTML =
    '<b>' + (falhas ? '<span class="bad">' + falhas + ' FALHA(S)</span>' : '<span class="ok">TUDO OK</span>') +
    '</b>  ·  ' + (linhas.filter(l => /ok  |FALHA/.test(l)).length) + ' afirmações<br>' + linhas.join('<br>');
})();
</script>
