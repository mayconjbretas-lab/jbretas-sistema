<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faixa "Vendo como" — não pode cortar o rodapé</title>
<link rel="stylesheet" href="/shared/css/base.css">
<style>
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:var(--mono); font-size:12px; line-height:1.7; }
  .ok  { color:var(--ok); }
  .bad { color:var(--danger); font-weight:700; }
  h3   { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
         color:var(--text2); margin:16px 0 4px; }
  #res { white-space:pre-wrap; }
  #palco { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  #palco figure { margin:0; }
  #palco figcaption { font-size:10px; color:var(--text3); padding:3px 0; }
  iframe { width:420px; height:420px; border:1px dashed var(--border); background:#000; }
</style>

<div id="res">rodando…</div>
<div id="palco"></div>

<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// A faixa "Vendo como" é injetada por shared/js/auth.js com um <style> montado
// em JS. Ela empurra o body em FAIXA_H px — e a logística e o painel-adm
// definem `#screen-app{height:100vh}`, que é a viewport INTEIRA e ignora esse
// padding. Com `html,body{overflow:hidden}` nos dois, os px que sobravam
// embaixo NÃO viravam scroll: eram cortados, e o rodapé da tela ficava fora de
// alcance enquanto a impersonação estivesse ligada.
//
// O CSS TESTADO É O DO auth.js, cortado do arquivo em tempo de execução, e o
// FAIXA_H é LIDO DE LÁ TAMBÉM. Uma cópia colada aqui provaria a cópia — e no
// dia em que o auth.js mudasse, este teste seguiria verde sobre a versão
// antiga (foi o que quase aconteceu quando 40 virou 28).
//
// CADA MÓDULO NUM IFRAME, porque os três CSS colidem entre si (o admin tem
// paleta própria e nem carrega o base.css). O iframe é a viewport de verdade
// que o `100vh` e o `calc(100vh - FAIXA_H px)` precisam para significar algo.
// ════════════════════════════════════════════════════════════════
const out = [];
let falhas = 0, total = 0;
let FAIXA_H = null;   // vem do auth.js; o cssDaFaixa() preenche
function H(t) { out.push('\n<h3>' + t + '</h3>'); }
function chk(cond, msg, extra) {
  total++;
  if (!cond) falhas++;
  out.push((cond ? '<span class="ok">  ok  </span>' : '<span class="bad">FALHA </span>') +
    msg + (extra ? '   <span style="color:var(--text3)">[' + extra + ']</span>' : ''));
}
const pintar = () => { document.getElementById('res').innerHTML = out.join('\n'); };

// ── O CSS REAL, cortado do auth.js ──────────────────────────────
async function cssDaFaixa() {
  const src = await fetch('/shared/js/auth.js').then(r => r.text());
  const i = src.indexOf('st.textContent =');
  // Fim do bloco pelo appendChild, e não por uma regra CSS específica: o
  // marcador anterior era "'.topbar{top:'", e no dia em que essa regra saiu
  // do auth.js o teste inteiro morreu com 'não achei o bloco'. O appendChild
  // é o que fecha a atribuição, seja qual for a última regra.
  const ap = src.indexOf('document.head.appendChild(st)', i);
  if (i < 0 || ap < 0) throw new Error('não achei o bloco de estilo no auth.js');
  const fim = src.lastIndexOf(';', ap);
  const expr = src.slice(i + 'st.textContent ='.length, fim);
  // A CONSTANTE TAMBÉM VEM DO ARQUIVO. Fixá-la aqui deixaria o teste verde
  // sobre um FAIXA_H que mudou lá — foi o que aconteceu quando 40 virou 28.
  const mH = src.match(/const FAIXA_H = (\d+)/);
  if (!mH) throw new Error('não achei o FAIXA_H no auth.js');
  const FAIXA_H = Number(mH[1]);
  // eval do MESMO trecho que roda em produção, com a mesma constante.
  return { css: eval(expr), FAIXA_H };
}

const BANNER = '<div id="faixa-visao-ti">' +
  '<span class="fvt-txt">👁️ Vendo como Fulano de Tal da Silva Sauro (P. AVIVA)</span>' +
  '<button type="button">↩ Voltar ao TI</button></div>';

// Esqueletos copiados da marcação real de cada módulo. O que importa em cada
// um é a cadeia que define altura: #screen-app > .topbar + o container flex.
const MODULOS = {
  logistica: {
    css: ['/shared/css/base.css', '/shared/css/medicao-alteracoes.css', '/modulos/logistica/logistica.css'],
    corpo:
      '<div id="screen-app">' +
        '<div class="topbar"><div class="topbar-brand">JBRETAS</div></div>' +
        '<div class="logi-layout">' +
          '<aside class="logi-sidebar"><div class="sb-block">filtros</div></aside>' +
          '<div class="view-panel active" style="flex:1;display:flex;flex-direction:column">' +
            '<div class="malt-faixa"><span class="malt-faixa-txt">✏️ 7 alterações de medição hoje</span>' +
              '<button type="button" class="malt-faixa-btn" id="malt-ver">Ver</button></div>' +
            '<div style="flex:1;overflow:auto">conteúdo</div>' +
            '<div id="rodape" style="flex-shrink:0;height:36px;background:#c33;color:#fff;' +
              'display:flex;align-items:center;justify-content:center">RODAPÉ DA MATRIZ</div>' +
          '</div>' +
        '</div>' +
      '</div>',
  },
  'painel-adm': {
    css: ['/shared/css/base.css', '/modulos/painel-adm/painel-adm.css'],
    corpo:
      '<div id="screen-app" style="display:flex">' +
        '<div class="topbar"><div class="topbar-brand">JBRETAS</div></div>' +
        '<div style="flex:1;min-height:0;display:flex;flex-direction:column">' +
          '<div style="flex:1;overflow:auto">conteúdo da aba</div>' +
          '<div id="rodape" style="flex-shrink:0;height:36px;background:#c33;color:#fff;' +
            'display:flex;align-items:center;justify-content:center">RODAPÉ DA ABA</div>' +
        '</div>' +
      '</div>',
  },
  admin: {
    // O admin NÃO carrega o base.css: paleta própria.
    css: ['/modulos/admin/admin.css'],
    corpo:
      '<div id="screen-app">' +
        '<div class="topbar"><div class="tbbrand">JBRETAS</div></div>' +
        '<div style="flex:1;min-height:0;display:flex;flex-direction:column">' +
          '<div style="flex:1;overflow:auto">conteúdo</div>' +
          '<div id="rodape" style="flex-shrink:0;height:36px;background:#c33;color:#fff;' +
            'display:flex;align-items:center;justify-content:center">RODAPÉ</div>' +
        '</div>' +
      '</div>',
  },
};

function montar(mod, css, opts) {
  opts = opts || {};
  const m = MODULOS[mod];
  const links = m.css.map(h => '<link rel="stylesheet" href="' + h + '">').join('');
  // `sabotar` devolve o #screen-app ao 100vh de antes do conserto: é assim
  // que se prova que a medição abaixo SABE FALHAR.
  const sabot = opts.sabotar ? '<style>#screen-app{height:100vh !important;max-height:none}</style>' : '';
  const doc = '<!doctype html><html data-theme="' + (opts.tema || 'dark') + '">' +
    '<head><meta charset="utf-8">' + links + '<style>' + css + '</style>' + sabot + '</head>' +
    '<body>' + m.corpo + (opts.semFaixa ? '' : BANNER) + '</body></html>';
  const fig = document.createElement('figure');
  const cap = document.createElement('figcaption');
  cap.textContent = mod + (opts.tema === 'light' ? ' · claro' : '') +
    (opts.sabotar ? ' · SABOTADO (100vh)' : '') + (opts.semFaixa ? ' · sem faixa' : '');
  const f = document.createElement('iframe');
  f.srcdoc = doc;
  fig.appendChild(cap); fig.appendChild(f);
  document.getElementById('palco').appendChild(fig);
  return new Promise(r => { f.onload = () => setTimeout(() => r(f), 120); });
}

const medir = (f) => {
  const d = f.contentDocument, w = f.contentWindow;
  const app = d.getElementById('screen-app');
  const rod = d.getElementById('rodape');
  const faixa = d.getElementById('faixa-visao-ti');
  const alt = d.querySelector('.malt-faixa');
  const vh = w.innerHeight;
  const rApp = app.getBoundingClientRect();
  const rRod = rod.getBoundingClientRect();
  return {
    vh,
    appTopo: Math.round(rApp.top), appPe: Math.round(rApp.bottom), appAlt: Math.round(rApp.height),
    rodapePe: Math.round(rRod.bottom), rodapeTopo: Math.round(rRod.top),
    // Quanto do rodapé está ABAIXO da borda de baixo da janela = cortado.
    cortado: Math.max(0, Math.round(rRod.bottom - vh)),
    faixaAlt: faixa ? Math.round(faixa.getBoundingClientRect().height) : 0,
    faixaFundo: faixa ? w.getComputedStyle(faixa).backgroundColor : null,
    faixaCor: faixa ? w.getComputedStyle(faixa).color : null,
    btnFundo: faixa ? w.getComputedStyle(faixa.querySelector('button')).backgroundColor : null,
    btnCor: faixa ? w.getComputedStyle(faixa.querySelector('button')).color : null,
    // O --warning COMO ESTE DOCUMENTO O RESOLVE. Uma sonda, e não
    // getPropertyValue: o token é declarado em hex e a faixa é medida em rgb();
    // comparar string com string daria falso negativo.
    tokenWarning: (() => {
      const sonda = d.createElement('span');
      sonda.style.cssText = 'position:absolute;left:-9999px;background:var(--warning)';
      d.body.appendChild(sonda);
      const v = w.getComputedStyle(sonda).backgroundColor;
      sonda.remove();
      return v;   // rgba(0, 0, 0, 0) quando o módulo não declara o token
    })(),
    // A faixa de alterações não pode ficar debaixo da faixa amarela.
    altTopo: alt ? Math.round(alt.getBoundingClientRect().top) : null,
    altVisivel: alt ? (alt.getBoundingClientRect().top >= FAIXA_H) : null,
  };
};

// Contraste WCAG, para o botão amarelo sobre preto nos dois temas.
const lum = (c) => {
  const [r, g, b] = c.match(/\d+/g).map(Number).map(v => {
    v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
};
const contraste = (a, b) => {
  const l1 = lum(a), l2 = lum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
};

(async () => {
  const r = await cssDaFaixa();
  const css = r.css;
  FAIXA_H = r.FAIXA_H;

  H('0 · o CSS testado é o do auth.js, não uma cópia');
  chk(css.includes('#screen-app{height:calc(100vh - ' + FAIXA_H + 'px) !important'),
      'a regra do #screen-app está no arquivo', css.match(/#screen-app\{[^}]*\}/) || '(ausente)');
  chk(/background:var\(--warning, #d97706\)/.test(css),
      'o fundo vem do token --warning, com #d97706 de fallback');
  chk(css.includes('body{padding-top:' + FAIXA_H + 'px}'), 'o padding do body continua');
  chk(!/\.topbar\{top:/.test(css),
      'e a topbar NÃO é mais reposicionada — a regra .topbar{top:} saiu do auth.js',
      (css.match(/\.topbar\{[^}]*\}/) || ['(ausente, como esperado)'])[0]);
  chk(/\.fvt-txt\{overflow:hidden/.test(css),
      'o .fvt-txt sobreviveu — o span ainda ganha essa classe, e sem a regra um nome longo empurraria o botão para fora');

  // ══════════════════════════════════════════════════════════════
  for (const mod of ['logistica', 'painel-adm', 'admin']) {
    H(mod.toUpperCase() + ' · o rodapé cabe na tela com a faixa ligada');
    const f = await montar(mod, css);
    const m = medir(f);
    chk(m.faixaAlt === FAIXA_H, 'a faixa mede ' + FAIXA_H + 'px', m.faixaAlt + 'px');
    chk(m.appTopo === FAIXA_H, 'e o app começa logo abaixo dela (o body foi empurrado)', m.appTopo + 'px');
    chk(m.appAlt === m.vh - FAIXA_H, 'o #screen-app mede a janela MENOS a faixa',
        m.appAlt + 'px de ' + m.vh + 'px');
    chk(m.appPe <= m.vh + 0.5, 'o pé dele não passa da borda de baixo',
        'pé em ' + m.appPe + ', janela ' + m.vh);
    // O QUE IMPORTA: o rodapé inteiro dentro da janela.
    chk(m.cortado === 0, 'e o RODAPÉ aparece inteiro — nada cortado embaixo',
        m.cortado ? m.cortado + 'px cortados' : 'rodapé termina em ' + m.rodapePe);

    // Sem a faixa nada muda: o conserto não pode custar nada a quem não está
    // impersonando (o <style> nem chega a ser injetado nesse caso).
    const fs = await montar(mod, '', { semFaixa: true });
    const ms = medir(fs);
    chk(ms.appAlt === ms.vh, 'sem a faixa, o app volta a ocupar a janela inteira',
        ms.appAlt + 'px de ' + ms.vh + 'px');
    chk(ms.cortado === 0, 'e o rodapé segue inteiro');

    // A PROVA DE QUE A MEDIDA SABE FALHAR: devolve o 100vh de antes.
    const fb = await montar(mod, css, { sabotar: true });
    const mb = medir(fb);
    if (mod === 'admin') {
      // O ADMIN É IMUNE, e a primeira versão deste teste errou o motivo. Não é
      // o `height:100%` dele: é o `body{display:flex;flex-direction:column}` do
      // admin.css, que faz do #screen-app um ITEM FLEX. O flex-shrink padrão o
      // encolhe para o content box do body seja qual for a altura declarada —
      // por isso nem sabotando com 100vh o rodapé é cortado ali.
      chk(mb.cortado === 0, 'o admin resiste até ao 100vh: o body dele é flex e o item encolhe',
          'altura usada ' + mb.appAlt + 'px numa janela de ' + mb.vh + 'px');
      chk(mb.appAlt === mb.vh - FAIXA_H,
          'e a altura USADA continua sendo janela menos faixa, apesar do height:100vh !important',
          mb.appAlt + 'px');
    } else {
      chk(mb.cortado === FAIXA_H, 'sabotado com 100vh, o rodapé volta a ser cortado em ' + FAIXA_H + 'px',
          mb.cortado + 'px cortados — era exatamente este o defeito');
    }
  }

  // ══════════════════════════════════════════════════════════════
  H('LOGÍSTICA · a faixa de alterações não fica debaixo da amarela');
  const fl = await montar('logistica', css);
  const ml = medir(fl);
  chk(ml.altVisivel === true,
      '"7 alterações de medição hoje" começa abaixo dos ' + FAIXA_H + 'px da faixa',
      'topo em ' + ml.altTopo + 'px');

  // ══════════════════════════════════════════════════════════════
  // A FAIXA DEIXOU DE TER COR FIXA. Ela pinta var(--warning, #d97706), então
  // segue o token de cada módulo e de cada tema: #f9c74f no base.css escuro,
  // #f0a444 no admin escuro, #d97706 nos dois no claro. Não dá mais para
  // exigir um amarelo só — o que ainda se exige é que a faixa seja SEMPRE o
  // --warning daquele documento (e não o fallback por engano), e que o texto
  // #1a1200 continue legível sobre qualquer um dos três.
  H('CORES · a faixa segue o --warning de cada módulo, e continua legível');
  const cores = {};
  for (const mod of ['logistica', 'painel-adm', 'admin']) {
    for (const tema of ['dark', 'light']) {
      const f = await montar(mod, css, { tema });
      cores[mod + '/' + tema] = medir(f);
    }
  }
  const todas = Object.values(cores);
  // O ADMIN NÃO ENTRA NESSA REGRA, e foi a medição que mostrou. Ele só
  // declara --warning DENTRO do #s-kpi (admin.css:72, '--warning:var(--wn)');
  // no :root ele tem --wn e nunca --warning. Como a faixa é filha do <body>,
  // o token não a alcança e ela cai no fallback #d97706 — nos DOIS temas.
  // Consequência visível: no admin escuro a faixa sai laranja-escura, e não o
  // #f0a444 que o resto do módulo usa para 'warning'.
  const SEM_TOKEN = 'rgba(0, 0, 0, 0)';
  for (const [nome, m] of Object.entries(cores)) {
    const admin = nome.startsWith('admin/');
    if (admin) {
      chk(m.tokenWarning === SEM_TOKEN && m.faixaFundo === 'rgb(217, 119, 6)',
          nome + ': sem --warning no :root, a faixa usa o fallback #d97706',
          'faixa ' + m.faixaFundo + ' · token ' + m.tokenWarning);
    } else {
      chk(m.tokenWarning !== SEM_TOKEN && m.faixaFundo === m.tokenWarning,
          nome + ': a faixa é o --warning do documento, não o fallback',
          'faixa ' + m.faixaFundo + ' · token ' + m.tokenWarning);
    }
  }
  chk(cores['logistica/dark'].faixaFundo === 'rgb(249, 199, 79)',
      'logistica/dark é o #f9c74f do base.css', cores['logistica/dark'].faixaFundo);
  chk(cores['logistica/light'].faixaFundo === 'rgb(217, 119, 6)',
      'e o tema claro escurece para #d97706', cores['logistica/light'].faixaFundo);
  chk(cores['admin/dark'].faixaFundo !== 'rgb(240, 164, 68)',
      'no admin escuro a faixa NÃO é o #f0a444 do módulo — o token não a alcança',
      cores['admin/dark'].faixaFundo + ' (o --wn dele vale #f0a444)');

  const textos = [...new Set(todas.map(m => m.faixaCor))];
  chk(textos.length === 1 && textos[0] === 'rgb(26, 18, 0)', 'o texto é #1a1200 em todas', textos.join(' | '));
  for (const [nome, m] of Object.entries(cores)) {
    const c = contraste(m.faixaCor, m.faixaFundo);
    chk(c >= 4.5, nome + ': o texto passa o contraste mínimo do WCAG AA sobre esse fundo',
        c.toFixed(2) + ':1');
  }

  H('BOTÃO "Voltar ao TI" · branco sobre preto, fixo em todo módulo');
  // O botão NÃO segue o token: fundo #1a1200 e texto #fff em toda combinação.
  // É o único elemento da faixa cujo contraste não depende do tema.
  const bf = [...new Set(todas.map(m => m.btnFundo))];
  const bc = [...new Set(todas.map(m => m.btnCor))];
  chk(bf.length === 1 && bf[0] === 'rgb(26, 18, 0)', 'fundo #1a1200 em todas', bf.join(' | '));
  chk(bc.length === 1 && bc[0] === 'rgb(255, 255, 255)', 'texto #fff em todas', bc.join(' | '));
  const cBtn = contraste(bc[0], bf[0]);
  chk(cBtn >= 4.5, 'e passa o contraste mínimo do WCAG AA', cBtn.toFixed(2) + ':1');

  // ══════════════════════════════════════════════════════════════
  // GEOMETRIA · faixa × topbar × barra de alterações, na Logística.
  //
  // Duas perguntas que o resto do teste não faz: sobra BANDA VAZIA entre o pé
  // da faixa e o topo da topbar (era o efeito do .topbar{top:FAIXA_H} que
  // saiu do auth.js), e a topbar SOBREPÕE a barra "alterações de medição"?
  // Os números crus vão para a tela — não só o ok/FALHA.
  const geo = (f) => {
    const d = f.contentDocument, w = f.contentWindow;
    const nome = (el) => el.id ? '#' + el.id
      : (el.getAttribute && el.getAttribute('class')
          ? '.' + el.getAttribute('class').trim().split(/\s+/).join('.')
          : el.tagName.toLowerCase());
    const r = (sel) => {
      const el = d.querySelector(sel);
      if (!el) return null;
      const b = el.getBoundingClientRect();
      const n2 = (v) => Math.round(v * 10) / 10;
      return { top: n2(b.top), bottom: n2(b.bottom), h: n2(b.height) };
    };
    // Scrollport do sticky da topbar: o ancestral mais próximo cujo overflow
    // não é visible. É a caixa contra a qual o top: dela é medido.
    const tb = d.querySelector('.topbar');
    let sp = tb && tb.parentElement, scrollport = '(viewport)';
    while (sp && sp !== d.documentElement) {
      if (w.getComputedStyle(sp).overflowY !== 'visible') { scrollport = nome(sp); break; }
      sp = sp.parentElement;
    }
    // Quem de fato rola: varredura do documento inteiro, porque na Logística
    // o contêiner de scroll é IRMÃO da barra de alterações, não ancestral.
    const roladores = [...d.querySelectorAll('*')].map(el => {
      const ov = w.getComputedStyle(el).overflowY;
      return { el, ov };
    }).filter(x => x.ov === 'auto' || x.ov === 'scroll').map(x => ({
      alvo: nome(x.el),
      overflowY: x.ov,
      scrollTop: x.el.scrollTop,
      rolaAgora: x.el.scrollHeight > x.el.clientHeight,
      scrollHeight: x.el.scrollHeight,
      clientHeight: x.el.clientHeight,
    }));
    return {
      faixa: r('#faixa-visao-ti'), topbar: r('.topbar'), alt: r('.malt-faixa'),
      scrollportDoSticky: scrollport,
      topbarPosition: tb ? w.getComputedStyle(tb).position : null,
      topbarTop: tb ? w.getComputedStyle(tb).top : null,
      roladores,
      janelaScrollY: w.scrollY,
      docScrollTop: d.documentElement.scrollTop,
      bodyScrollTop: d.body.scrollTop,
      bodyPaddingTop: w.getComputedStyle(d.body).paddingTop,
    };
  };
  const linha = (t) => out.push('<span style="color:var(--text3)">' + t + '</span>');

  H('GEOMETRIA · Logística, com e sem a faixa');
  const gCom = geo(await montar('logistica', css));
  const gSem = geo(await montar('logistica', '', { semFaixa: true }));

  for (const [rotulo, g] of [['COM a faixa', gCom], ['SEM a faixa', gSem]]) {
    linha('\n── ' + rotulo + ' ──');
    const mostra = (k, v) => linha('   ' + k.padEnd(22) +
      (v ? ('top ' + String(v.top).padStart(7) + '   bottom ' + String(v.bottom).padStart(7) +
            '   altura ' + String(v.h).padStart(6)) : '(ausente)'));
    mostra('#faixa-visao-ti', g.faixa);
    mostra('.topbar', g.topbar);
    mostra('.malt-faixa', g.alt);
    const banda = g.faixa ? Math.round((g.topbar.top - g.faixa.bottom) * 10) / 10 : null;
    linha('   banda vazia faixa→topbar: ' + (banda === null ? 'n/a (sem faixa)' : banda + 'px'));
    linha('   topbar sobrepõe a barra?  ' + (g.topbar.bottom > g.alt.top
      ? 'SIM — ' + (Math.round((g.topbar.bottom - g.alt.top) * 10) / 10) + 'px de sobreposição'
      : 'não — folga de ' + (Math.round((g.alt.top - g.topbar.bottom) * 10) / 10) + 'px'));
    linha('   .topbar: position ' + g.topbarPosition + ', top ' + g.topbarTop +
          ' · scrollport do sticky: ' + g.scrollportDoSticky);
    linha('   body padding-top: ' + g.bodyPaddingTop +
          ' · scrollY ' + g.janelaScrollY + ' · html.scrollTop ' + g.docScrollTop +
          ' · body.scrollTop ' + g.bodyScrollTop);
    linha('   contêineres de scroll (overflow auto/scroll):');
    if (!g.roladores.length) linha('      (nenhum)');
    for (const rr of g.roladores) {
      linha('      ' + rr.alvo + '  overflow-y:' + rr.overflowY +
            '  scrollTop ' + rr.scrollTop +
            '  ' + (rr.rolaAgora ? 'ROLA' : 'não rola') +
            ' (' + rr.scrollHeight + '/' + rr.clientHeight + ')');
    }
  }
  out.push('');
  const bandaCom = Math.round((gCom.topbar.top - gCom.faixa.bottom) * 10) / 10;
  chk(bandaCom === 0, 'com a faixa, a topbar encosta nela — nenhuma banda vazia',
      bandaCom + 'px entre o pé da faixa (' + gCom.faixa.bottom + ') e o topo da topbar (' + gCom.topbar.top + ')');
  chk(gCom.topbar.bottom <= gCom.alt.top,
      'e a topbar não cobre a barra "alterações de medição"',
      'topbar termina em ' + gCom.topbar.bottom + ', a barra começa em ' + gCom.alt.top);
  chk(gSem.topbar.top === 0, 'sem a faixa, a topbar volta a encostar no topo da janela',
      gSem.topbar.top + 'px');

  out.push('\n' + (falhas
    ? '<span class="bad">FALHAS: ' + falhas + ' de ' + total + '</span>'
    : '<span class="ok">TUDO OK · ' + total + ' afirmações</span>'));
  pintar();
})().catch(e => {
  out.push('<span class="bad">ERRO: ' + e.message + '</span>\n' + (e.stack || ''));
  pintar();
});
</script>
