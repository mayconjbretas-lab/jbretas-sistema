<script>
// ════════════════════════════════════════════════════════════════
// O QUE ESTE TESTE PROVA
//
// A tela le `comparavel` da ROTA e nao recalcula a regua. Entao aqui se prova
// o lado da TELA: dado um `comparavel`, sai a palavra certa, na cor certa, e
// quando ele barra NAO sai porcentagem nenhuma. A regua em si (9 dias x 11
// dias => dias_diferentes) e provada no lado da API, contra o banco de
// verdade, pelo sondar-fatmes.js.
//
// FIXTURES ESCOLHIDAS PARA A CONTA SER CONFERIVEL DE CABECA:
//   GC  10,0 mi <- 9,0 mi  = +11,1%   e 1,60 mi L <- 1,50 mi L = +6,7%   (mesmo sinal)
//   ET   5,0 mi <- 4,5 mi  = +11,1%   e 1,20 mi L <- 1,30 mi L = -7,7%   (OPOSTOS)
//   S10  3,0 mi <- 3,0 mi  =    0%    e 0,50 mi L <- 0,50 mi L =    0%   (quase igual)
//
// NAO USA A URL SEM .html POR ACIDENTE: ver testes/README.md — o `serve`
// redireciona /x.html para /x e DESCARTA a query string. Este teste nao le
// query nenhuma, entao os dois caminhos servem.
// ════════════════════════════════════════════════════════════════
const out = [];
let falhas = 0, total = 0;
function H(t) { out.push('\n<h3>' + t + '</h3>'); }
function chk(cond, msg, extra) {
  total++;
  if (!cond) falhas++;
  out.push((cond ? '<span class="ok">  ok  </span>' : '<span class="bad">FALHA </span>') +
    msg + (extra ? '   <span style="color:var(--text3)">[' + extra + ']</span>' : ''));
}
function EQ(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  chk(sa === sb, msg, sa === sb ? '' : sa + ' != ' + sb);
}
const pintarRes = () => { document.getElementById('res').innerHTML = out.join('\n'); };

// ── Fixtures ────────────────────────────────────────────────────
// A SERIE VARIA POR DIA, e nao e capricho: uma serie constante desenha uma
// RETA, e reta esconde erro de escala — foi o que deixou passar o
// desalinhamento entre ponto e linha ate a inspecao visual. A rampa e
// simetrica em torno do dia 5, entao a soma dos 9 dias da exatamente 9x o
// valor central e continua batendo com o total do mes.
const serie = (mes, dias, fatDia, litDia) => dias.map(d => ({
  data: mes + '-' + String(d).padStart(2, '0'), dia: d,
  faturamento: fatDia + (d - 5) * (fatDia * 0.1),
  litros: litDia + (d - 5) * (litDia * 0.08),
}));

const COMB_BASE = [
  { codigo: 'GC', rotulo: 'Gasolina comum', faturamento: 10000000, litros: 1600000 },
  { codigo: 'ET', rotulo: 'Etanol', faturamento: 5000000, litros: 1200000 },
  { codigo: 'S10', rotulo: 'Diesel S10', faturamento: 3000000, litros: 500000 },
];
const COMB_CMP = [
  { codigo: 'GC', rotulo: 'Gasolina comum', faturamento: 9000000, litros: 1500000 },
  { codigo: 'ET', rotulo: 'Etanol', faturamento: 4500000, litros: 1300000 },
  { codigo: 'S10', rotulo: 'Diesel S10', faturamento: 3000000, litros: 500000 },
];

function ladoBase(opts) {
  const o = opts || {};
  const dias = o.dias || [1, 2, 3, 4, 5, 6, 7, 8, 9];
  return {
    tem_dado: true, de: '2026-09-01', ate: '2026-09-30',
    dias_com_dado: dias.length, dias_numeros: dias, primeiro: '2026-09-01',
    ultimo: '2026-09-' + String(dias[dias.length - 1]).padStart(2, '0'),
    faturamento: 18000000, litros: 3300000,
    por_combustivel: COMB_BASE,
    // `abastecimentos` e a contagem EXATA (itens). Os "cupons" do rollup sao
    // um teto — somam um Set por combustivel, entao um cupom que abasteceu
    // gasolina e etanol conta duas vezes. Numero que nao fecha na conferencia
    // vira desconfianca da tela inteira, entao a tela mostra o exato.
    por_canal: o.canal || [
      { chave: 'NORMAL', rotulo: 'Pista (sem app)', faturamento: 12600000, litros: 2400000, abastecimentos: 92000 },
      { chave: 'SOUTAG', rotulo: 'Soutag', faturamento: 4000000, litros: 700000, abastecimentos: 29738 },
      { chave: '99', rotulo: 'App 99', faturamento: 1400000, litros: 200000, abastecimentos: 15744 },
    ],
    serie: serie('2026-09', dias, 2000000, 366666.7),
  };
}
function ladoCmp(opts) {
  const o = opts || {};
  const dias = o.dias || [1, 2, 3, 4, 5, 6, 7, 8, 9];
  return {
    tem_dado: true, de: '2026-08-01', ate: '2026-08-31',
    dias_com_dado: dias.length, dias_numeros: dias,
    primeiro: '2026-08-' + String(dias[0]).padStart(2, '0'), ultimo: '2026-08-31',
    faturamento: 16500000, litros: 3300000,
    por_combustivel: COMB_CMP,
    por_canal: o.semCanal ? [] : [
      { chave: 'NORMAL', rotulo: 'Pista (sem app)', faturamento: 11500000, litros: 2400000, abastecimentos: 90000 },
      { chave: 'SOUTAG', rotulo: 'Soutag', faturamento: 3500000, litros: 700000, abastecimentos: 27000 },
      { chave: '99', rotulo: 'App 99', faturamento: 1500000, litros: 200000, abastecimentos: 16000 },
    ],
    serie: serie('2026-08', dias, 1833333.3, 366666.7),
  };
}

// ── Fixtures do MODO ANO ────────────────────────────────────────
// Numeros na forma do dado real de 10/09/2026 (medidos pelo
// sondar-fatano.js): combustivel e 99% do faturamento, e jan-abr tem menos
// postos que a rede. A cobertura desigual e o ponto: sem ela nao da para
// afirmar que a barra parcial sai marcada.
const CATS = [
  { codigo: 1, nome: 'COMBUSTIVEIS', faturamento: 627452023.64, quantidade: 113846867.7, unidade: 'L', pct: 99.07 },
  { codigo: 2, nome: 'LUBRIFICANTES', faturamento: 2409821.89, quantidade: 47383, unidade: 'un', pct: 0.38 },
  { codigo: 4, nome: 'ADITIVOS', faturamento: 1247038.95, quantidade: 27840, unidade: 'un', pct: 0.2 },
  { codigo: 14, nome: 'LUBRIFICANTES A GRANEL', faturamento: 681834.63, quantidade: 205025, unidade: 'un', pct: 0.11 },
  { codigo: 17, nome: 'GELO', faturamento: 359690.4, quantidade: 14596, unidade: 'un', pct: 0.06 },
  { codigo: 16, nome: 'PALHETAS', faturamento: 281496.3, quantidade: 4024, unidade: 'un', pct: 0.04 },
  { codigo: 9, nome: 'DIVERSOS', faturamento: 167611.53, quantidade: 7613, unidade: 'un', pct: 0.03 },
  { codigo: 3, nome: 'FILTRO DE OLEO', faturamento: 153193.47, quantidade: 3475, unidade: 'un', pct: 0.02 },
  { codigo: 21, nome: 'FLUIDOS', faturamento: 147003.0, quantidade: 5279, unidade: 'un', pct: 0.02 },
];
// SETEMBRO E O CASO QUE FALTAVA: 37 de 37 postos, mas 9 de 30 dias. Ele sai
// em R$ 22,9 mi contra R$ 77,3 mi de agosto — ao lado de barras cheias isso se
// le como colapso de venda. Por isso `completo` exige postos E dias, e o
// `motivo_parcial` diz qual dos dois falta.
const SERIE_MES = [
  { mes: '2026-01', faturamento: 64068414.16, litros: 11320000, postos: 32, dias: 31, dias_do_mes: 31, completo: false, motivo_parcial: 'postos' },
  { mes: '2026-02', faturamento: 66806620.71, litros: 11940000, postos: 32, dias: 28, dias_do_mes: 28, completo: false, motivo_parcial: 'postos' },
  { mes: '2026-03', faturamento: 83146944.12, litros: 14140000, postos: 32, dias: 31, dias_do_mes: 31, completo: false, motivo_parcial: 'postos' },
  { mes: '2026-04', faturamento: 79354799.21, litros: 13370000, postos: 33, dias: 30, dias_do_mes: 30, completo: false, motivo_parcial: 'postos' },
  { mes: '2026-05', faturamento: 81224484.84, litros: 14680000, postos: 37, dias: 31, dias_do_mes: 31, completo: true, motivo_parcial: null },
  { mes: '2026-06', faturamento: 79050501.87, litros: 14460000, postos: 37, dias: 30, dias_do_mes: 30, completo: true, motivo_parcial: null },
  { mes: '2026-07', faturamento: 79366180.67, litros: 14940000, postos: 37, dias: 31, dias_do_mes: 31, completo: true, motivo_parcial: null },
  { mes: '2026-08', faturamento: 77341051.15, litros: 14920000, postos: 37, dias: 31, dias_do_mes: 31, completo: true, motivo_parcial: null },
  { mes: '2026-09', faturamento: 22954107.12, litros: 4110000, postos: 37, dias: 9, dias_do_mes: 30, completo: false, motivo_parcial: 'dias' },
];
const CONVENIO = {
  tem_dado: true, desde: '2026-08-21', ate: '2026-09-09', dias: 20,
  faturamento: 49296312.15, litros: 9052403,
  por_canal: [
    { chave: 'NORMAL', rotulo: 'Pista (sem app)', faturamento: 37739958.63, litros: 6664293 },
    { chave: 'SOUTAG', rotulo: 'Soutag', faturamento: 8600902.73, litros: 1699746 },
    { chave: '99', rotulo: 'App 99', faturamento: 2955450.79, litros: 688364 },
  ],
};
function respostaAno(o) {
  o = o || {};
  return {
    success: true,
    consulta: {
      ano: '2026', de: '2026-01-01', ate: '2026-09-10',
      posto_id: o.posto_id || null, posto_nome: o.posto_nome || null,
      rede_toda: !o.posto_id, postos_rede: 37,
    },
    ano: o.vazio ? { tem_dado: false } : {
      tem_dado: true,
      faturamento: 633313103.85, litros: 113846867.7, combustivel_rs: 627452023.64,
      por_categoria: CATS,
      serie_mes: o.serie || SERIE_MES,
      postos_rede: 37,
      meses_incompletos: o.completa ? [] : ['2026-01', '2026-02', '2026-03', '2026-04'],
      cobertura_completa: !!o.completa,
    },
    convenio: o.semConvenio ? { tem_dado: false, por_canal: [] } : CONVENIO,
  };
}

const CENARIOS = {
  comparavel: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-08', ate_dia: 9, alcance: 'ate_dia' },
    comparavel: { ok: true, dias: 9 },
    convenio: { base_tem: true, cmp_tem: true, desde: null },
    rollup_desde: null,
    base: ladoBase(), comparacao: ladoCmp(),
  }),
  // O ESTADO DO ITEM 3/4: o mes de comparacao TEM faturamento e NAO tem
  // convenio. Hoje ele nao ocorre — as duas tabelas comecam juntas em
  // 21/08/2026 (conferido: 0 divergencias em 734 pares posto/dia) — mas passa
  // a ocorrer no minuto em que uma for carregada para tras sem a outra, e a
  // tela precisa saber distinguir isso de um filtro quebrado.
  cmp_sem_convenio: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-08', ate_dia: 9, alcance: 'ate_dia' },
    comparavel: { ok: true, dias: 9 },
    convenio: { base_tem: true, cmp_tem: false, desde: '2026-08-21' },
    rollup_desde: '2026-08-21',
    base: ladoBase(), comparacao: ladoCmp({ semCanal: true }),
  }),
  dias_diferentes: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-08', ate_dia: null, alcance: 'mes' },
    // ALINHAVEL: agosto 01–30 TEM os dias 1 a 9, entao o botao resolve.
    comparavel: {
      ok: false, motivo: 'dias_diferentes', dias_base: 9, dias_cmp: 30,
      alinhar_em: 9, cmp_dias_ate_n: 9, alinhavel: true, por_dia: true,
    },
    convenio: { base_tem: true, cmp_tem: true, desde: null },
    base: ladoBase(),
    comparacao: ladoCmp({ dias: Array.from({ length: 30 }, (_, i) => i + 1) }),
  }),
  // A FORMA REAL DE HOJE: setembro 01–09 contra agosto 21–31. O botao
  // "comparar os mesmos dias" cortaria os dois no dia 9, e agosto nao tem
  // esses dias — cmp_dias_ate_n = 0. Prometer o botao aqui e prometer o que
  // nao entrega, e era o que a tela fazia.
  nao_alinhavel: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-08', ate_dia: null, alcance: 'mes' },
    comparavel: {
      ok: false, motivo: 'dias_diferentes', dias_base: 9, dias_cmp: 11,
      alinhar_em: 9, cmp_dias_ate_n: 0, alinhavel: false, por_dia: true,
    },
    convenio: { base_tem: true, cmp_tem: true, desde: null },
    base: ladoBase(),
    comparacao: ladoCmp({ dias: Array.from({ length: 11 }, (_, i) => i + 21) }),
  }),
  sem_dado: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-07', ate_dia: null, alcance: 'mes' },
    comparavel: { ok: false, motivo: 'sem_dado' },
    convenio: { base_tem: true, cmp_tem: false, desde: '2026-08-21' },
    rollup_desde: '2026-08-21',
    base: ladoBase(),
    comparacao: { tem_dado: false, de: '2026-07-01', ate: '2026-07-31', dias_com_dado: 0 },
  }),
  buraco: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-08', ate_dia: null, alcance: 'mes' },
    comparavel: { ok: true, dias: 8 },
    convenio: { base_tem: true, cmp_tem: true, desde: null },
    // Dia 5 AUSENTE da serie: e o buraco que a linha tem de quebrar.
    base: ladoBase({ dias: [1, 2, 3, 4, 6, 7, 8, 9] }),
    comparacao: ladoCmp({ dias: [1, 2, 3, 4, 6, 7, 8, 9] }),
  }),
  sem_99: () => ({
    success: true,
    consulta: { posto_id: 'p1', posto_nome: 'P. ESPAÇO REAL', rede_toda: false, mes: '2026-09', cmp: '2026-08', ate_dia: 9, alcance: 'ate_dia' },
    comparavel: { ok: true, dias: 9 },
    base: ladoBase({ canal: [
      { chave: 'NORMAL', rotulo: 'Pista (sem app)', faturamento: 14000000, litros: 2600000 },
      { chave: 'SOUTAG', rotulo: 'Soutag', faturamento: 4000000, litros: 700000 },
    ] }),
    comparacao: ladoCmp(),
  }),
  ano: () => respostaAno(),
  ano_completo: () => respostaAno({ completa: true, serie: SERIE_MES.map(m => ({ ...m, postos: 37, dias: m.dias_do_mes, completo: true, motivo_parcial: null })) }),
  ano_sem_convenio: () => respostaAno({ semConvenio: true }),
  ano_vazio: () => respostaAno({ vazio: true }),
  ano_posto: () => respostaAno({ posto_id: 'p1', posto_nome: 'P. AVIVA' }),
  base_vazia: () => ({
    success: true,
    consulta: { posto_id: null, posto_nome: null, rede_toda: true, mes: '2026-09', cmp: '2026-08', ate_dia: null, alcance: 'mes' },
    comparavel: { ok: false, motivo: 'sem_dado_base' },
    base: { tem_dado: false, de: '2026-09-01', ate: '2026-09-30', dias_com_dado: 0 },
    comparacao: ladoCmp(),
  }),
};

let _cenario = 'comparavel';
let _ultimaUrl = '';
window.apiFetch = async function (url) {
  _ultimaUrl = url;
  if (url.indexOf('/postos') === 0) {
    return { postos: [{ id: 'p1', nome: 'P. ESPAÇO REAL' }, { id: 'p2', nome: 'P. AVIVA' }] };
  }
  if (url.indexOf('/tecnox/faturamento-ano') === 0) return CENARIOS[_cenario]();
  if (url.indexOf('/tecnox/faturamento-mes') === 0) return CENARIOS[_cenario]();
  throw new Error('rota inesperada no teste: ' + url);
};

// Barra manual, para inspecionar o visual em cada largura.
document.getElementById('barra').innerHTML = Object.keys(CENARIOS)
  .map(k => '<button onclick="__ir(\'' + k + '\')">' + k + '</button>').join('');
// Troca o MODO junto do cenario: pintar() ramifica pelo PAYLOAD, entao sem
// isto a inspecao visual mostraria o corpo do ano sob os filtros do mes —
// combinacao que producao nunca produz, porque la o modo e quem escolhe a
// rota. Botao de inspecao que mostra um estado impossivel ensina errado.
window.__ir = async function (k) {
  _cenario = k;
  window.__mmFiltro('modo', k.indexOf('ano') === 0 ? 'ano' : 'mes');
  await esperar(250);
};

const sec = document.getElementById('s-movmes');
const esperar = (ms) => new Promise(r => setTimeout(r, ms));
async function pintar(cen) {
  _cenario = cen;
  window.renderMovMes(sec);
  // renderMovMes dispara um await; dois turnos de microtask + folga bastam.
  for (let i = 0; i < 40; i++) {
    await esperar(10);
    if (sec.querySelector('.mm-contexto, .mm-aviso-caixa:not(:empty)')) break;
  }
}
const txt = (sel, raiz) => { const e = (raiz || sec).querySelector(sel); return e ? e.textContent.replace(/\s+/g, ' ').trim() : null; };
const cor = (el) => el ? getComputedStyle(el).color : null;
const blocos = (sel) => [...sec.querySelectorAll(sel)];
// COLUNAS DA GRADE, contadas pelo estilo RESOLVIDO (o grid-template-columns
// computado vem como uma lista de larguras em px, uma por coluna). Assim a
// afirmacao vale na largura em que o teste estiver rodando, em vez de supor
// uma. A escada e a do pedido: 3 no desktop, 2 no meio-termo, 1 no celular.
const colunas = (sel) => {
  const e = sec.querySelector(sel);
  return e ? getComputedStyle(e).gridTemplateColumns.trim().split(/\s+/).length : 0;
};
const colunasEsperadas = (max) => (innerWidth <= 700 ? 1 : innerWidth <= 1040 ? Math.min(2, max) : max);
</script>

<script>
(async () => {
  // ══════════════════════════════════════════════════════════════
  H('0 - a janela tem largura de verdade');
  // AS MEDIDAS GEOMETRICAS DESTE ARQUIVO NAO VALEM COM LARGURA ZERO. Com o
  // painel do navegador colapsado innerWidth e 0, o SVG nao tem com o que
  // escalar, e getScreenCTM() degenera para a identidade: as afirmacoes de
  // ponto-sobre-linha passam a falhar por ~200px sem nada estar quebrado, e a
  // propria sabotagem para de discriminar. Isso ja custou uma cacada inteira.
  // Entao falha PRIMEIRO, e dizendo o motivo.
  chk(window.innerWidth > 300, 'a janela mede mais que 300px', window.innerWidth + 'px');
  if (window.innerWidth <= 300) {
    out.push('<span class="bad">   >>> abra o painel do navegador: sem largura, toda medida abaixo mente.</span>');
  }

  H('1 · a tela monta: filtros centralizados e a consulta certa');
  await pintar('comparavel');

  chk(!!sec.querySelector('#mm-filtros'), 'os filtros existem');
  const filtros = sec.querySelector('#mm-filtros');
  chk(getComputedStyle(filtros).justifyContent === 'center',
      'e ficam CENTRALIZADOS', getComputedStyle(filtros).justifyContent);
  // O seletor de MODO entrou na frente de todos: e ele que decide se os
  // tres filtros de mes existem, entao ler a tela de cima para baixo tem de
  // encontrar primeiro a pergunta que muda o resto.
  EQ([...sec.querySelectorAll('#mm-filtros select')].map(s => s.id),
     ['mm-modo', 'mm-posto', 'mm-mes', 'mm-cmp', 'mm-alcance'],
     'os CINCO filtros, com o modo primeiro');
  chk(sec.querySelector('#mm-posto option').value === '' &&
      sec.querySelector('#mm-posto option').textContent === 'Rede toda',
      'o default do posto e REDE TODA');
  const hj = new Date();
  const mesAtual = hj.getFullYear() + '-' + String(hj.getMonth() + 1).padStart(2, '0');
  chk(sec.querySelector('#mm-mes').value === mesAtual,
      'o mes base abre no MES ATUAL', sec.querySelector('#mm-mes').value);
  chk(_ultimaUrl.indexOf('mes=' + mesAtual) > 0 && _ultimaUrl.indexOf('cmp=') > 0,
      'e a consulta sai com mes e cmp', _ultimaUrl);
  chk(_ultimaUrl.indexOf('posto_id') < 0,
      'sem posto_id quando e a rede toda (a rota trata vazio como rede)');

  // ══════════════════════════════════════════════════════════════
  H('2 · CONVENIO: dois blocos, valor grande, palavra com cor');
  const conv = blocos('.mm-2 .mm-bloco');
  chk(conv.length === 2, 'exatamente DOIS blocos de convenio', conv.length + '');
  EQ(conv.map(b => txt('.mm-nome', b)), ['Soutag', 'App 99'],
     'Soutag e 99 — e a Pista NAO vira bloco (nao e convenio)');
  chk(txt('.mm-num', conv[0]) === 'R$ 4,0 mi',
      'o valor sai ABREVIADO e por extenso', txt('.mm-num', conv[0]));
  chk((conv[0].querySelector('.mm-num').getAttribute('title') || '').indexOf('4.000.000,00') > 0,
      'e o cheio fica no title, para quem quiser conferir',
      conv[0].querySelector('.mm-num').getAttribute('title'));
  // Soutag 4,0 <- 3,5 = +14,3% ; 99 1,4 <- 1,5 = -6,7%
  chk(/subiu 14%/.test(txt('.mm-var', conv[0])),
      'Soutag: a variacao vem em PALAVRA', txt('.mm-var', conv[0]));
  chk(/caiu 6,7%/.test(txt('.mm-var', conv[1])),
      '99: caiu, com uma casa por ser menor que 10%', txt('.mm-var', conv[1]));
  chk(txt('.mm-var', conv[0]).indexOf('▲') === 0 && txt('.mm-var', conv[1]).indexOf('▼') === 0,
      'com a seta certa em cada uma');
  chk(conv[0].querySelector('.mm-seta').getAttribute('aria-hidden') === 'true',
      'e a seta e aria-hidden (o leitor de tela le so a palavra)');

  const corSobe = cor(conv[0].querySelector('.mm-var'));
  const corCai = cor(conv[1].querySelector('.mm-var'));
  chk(corSobe !== corCai, 'subiu e caiu tem cores DIFERENTES', corSobe + ' / ' + corCai);
  chk(corSobe !== cor(conv[0].querySelector('.mm-num')),
      'e nenhuma delas e a cor normal do texto (a cor foi mesmo aplicada)', corSobe);
  // ABASTECIMENTOS + LITROS, nesta ordem. Sao duas .mm-sub agora.
  const subs = [...conv[0].querySelectorAll('.mm-sub')].map(e => e.textContent.trim());
  EQ(subs, ['29.738 abastecimentos', '700 mil L'],
     'o convenio mostra ABASTECIMENTOS (exato) e depois os litros');
  chk(!/cupom|cupons/i.test(conv[0].textContent),
      'e NAO fala em cupons — no rollup eles sao um teto, nao uma contagem');

  // ══════════════════════════════════════════════════════════════
  H('3 · POR COMBUSTIVEL: um bloco cada, litro no detalhe, TOTAL no fim');
  const comb = blocos('.mm-3 .mm-bloco');
  chk(comb.length === 3, 'um bloco por combustivel', comb.length + '');
  EQ(comb.map(b => txt('.mm-nome', b)), ['Gasolina comum', 'Etanol', 'Diesel S10'],
     'na ordem que a rota mandou (maior faturamento primeiro)');
  chk(comb.every(b => b.tagName === 'BUTTON'),
      'os blocos sao <button> de verdade (foco por teclado, nao div clicavel)');
  // NUMERO FIXO DE COLUNAS. A primeira versao usava auto-fit com minmax(230px)
  // e cabiam CINCO blocos em 1280 — passava despercebido porque esta fixture
  // tem so 3 combustiveis, mas a producao tem 9.
  chk(colunas('.mm-3') === colunasEsperadas(3),
      'combustivel: 3 colunas no desktop, 2 no meio, 1 no celular',
      innerWidth + 'px -> ' + colunas('.mm-3') + ' colunas');
  chk(colunas('.mm-2') === colunasEsperadas(2),
      'convenio: 2 colunas, 1 no celular', innerWidth + 'px -> ' + colunas('.mm-2') + ' colunas');
  chk(/subiu 11%/.test(txt('.mm-var', comb[0])), 'GC: +11,1% sai como "subiu 11%"', txt('.mm-var', comb[0]));
  // A REGRA DE CASAS: uma casa abaixo de 10%, inteiro acima. Numa tela de ler
  // de relance, "subiu 11,1%" nao diz mais que "subiu 11%" — mas abaixo de 10%
  // a casa decide ("subiu 6,7%" x "subiu 7%"). Afirmado porque a regra nao e
  // obvia e passou despercebida na primeira leitura do proprio teste.
  chk(/subiu 6,7%/.test(txt('.mm-det .mm-var', comb[0])) && /subiu 11%/.test(txt('.mm-var', comb[0])),
      'a casa decimal aparece abaixo de 10% e some acima',
      txt('.mm-var', comb[0]) + ' | ' + txt('.mm-det .mm-var', comb[0]));
  chk(txt('.mm-det-num', comb[0]) === '1,6 mi L', 'e o litro fica no detalhe', txt('.mm-det-num', comb[0]));
  chk(/subiu 6,7%/.test(txt('.mm-det .mm-var', comb[0])),
      'com a variacao DE LITRO propria', txt('.mm-det .mm-var', comb[0]));

  // S10 nao mudou em nada: 0% viraria "subiu 0%", que gasta a palavra a toa.
  chk(txt('.mm-var', comb[2]) === 'quase igual',
      'variacao menor que meio por cento vira "quase igual"', txt('.mm-var', comb[2]));

  const totalB = sec.querySelector('.mm-total');
  chk(!!totalB, 'existe o bloco de TOTAL');
  chk(txt('.mm-num', totalB) === 'R$ 18,0 mi', 'somado: 10 + 5 + 3', txt('.mm-num', totalB));
  chk(/subiu 9,1%/.test(txt('.mm-var', totalB)), 'com a propria variacao', txt('.mm-var', totalB));
  chk(txt('.mm-det-num', totalB) === '3,3 mi L', 'e o litro total', txt('.mm-det-num', totalB));
  chk(totalB.compareDocumentPosition(comb[2]) & Node.DOCUMENT_POSITION_PRECEDING,
      'e ele vem DEPOIS dos blocos, fechando a secao');

  // ══════════════════════════════════════════════════════════════
  H('4 · SINAIS OPOSTOS: o Etanol acende (R$ sobe, litro cai)');
  const et = comb[1];
  chk(et.classList.contains('mm-oposto'),
      'o bloco do Etanol ganha a marca de sinais opostos');
  chk(!comb[0].classList.contains('mm-oposto') && !comb[2].classList.contains('mm-oposto'),
      'e SO ele — GC (os dois sobem) e S10 (nenhum muda) ficam normais');
  chk(et.classList.contains('aberto') && et.getAttribute('aria-expanded') === 'true',
      'ele ja vem ABERTO, senao a informacao ficaria escondida no celular');
  chk(!!txt('.mm-aviso', et) && /lados opostos/.test(txt('.mm-aviso', et)),
      'com a frase dizendo o que houve', txt('.mm-aviso', et));
  chk(/subiu 11%/.test(txt('.mm-var', et)) && /caiu 7,7%/.test(txt('.mm-det .mm-var', et)),
      'e as DUAS variacoes visiveis: R$ +11,1% e litro -7,7%',
      txt('.mm-var', et) + ' | ' + txt('.mm-det .mm-var', et));
  chk(cor(et.querySelector('.mm-var')) !== cor(et.querySelector('.mm-det .mm-var')),
      'em cores opostas — verde no R$, vermelho no litro');
  chk(getComputedStyle(et).borderColor !== getComputedStyle(comb[0]).borderColor,
      'e a borda do bloco muda, para achar de relance');

  // ══════════════════════════════════════════════════════════════
  H('5 · o toque abre e fecha o detalhe');
  const gc = comb[0];
  chk(gc.getAttribute('aria-expanded') === 'false', 'GC comeca fechado');
  gc.click();
  chk(gc.classList.contains('aberto') && gc.getAttribute('aria-expanded') === 'true',
      'o toque abre e anuncia');
  gc.click();
  chk(!gc.classList.contains('aberto') && gc.getAttribute('aria-expanded') === 'false',
      'o segundo toque fecha e desanuncia');
  gc.click(); comb[2].click();
  chk(gc.classList.contains('aberto') && comb[2].classList.contains('aberto'),
      'cada bloco abre sozinho (abrir um nao fecha o outro)');
  gc.click(); comb[2].click();

  // ══════════════════════════════════════════════════════════════
  H('6 · GRAFICO: duas linhas, a do mes base por cima e mais grossa');
  const svg = sec.querySelector('svg.mm-graf');
  chk(!!svg, 'o SVG do grafico existe');
  const lb = sec.querySelectorAll('polyline.mm-lin-base');
  const lc = sec.querySelectorAll('polyline.mm-lin-cmp');
  chk(lb.length === 1 && lc.length === 1, 'uma polilinha por mes, sem buraco no cenario',
      lb.length + ' base / ' + lc.length + ' cmp');
  chk([...svg.children].indexOf(lc[0]) < [...svg.children].indexOf(lb[0]),
      'a do mes de COMPARACAO vem antes, entao a do mes base fica POR CIMA');
  const wBase = parseFloat(getComputedStyle(lb[0]).strokeWidth);
  const wCmp = parseFloat(getComputedStyle(lc[0]).strokeWidth);
  chk(wBase > wCmp, 'e a do mes base e mais GROSSA', wBase + 'px vs ' + wCmp + 'px');
  chk(getComputedStyle(lb[0]).stroke !== getComputedStyle(lc[0]).stroke,
      'em cores diferentes (forte vs clara)');
  chk(lb[0].getAttribute('vector-effect') === 'non-scaling-stroke' &&
      lc[0].getAttribute('vector-effect') === 'non-scaling-stroke',
      'as duas com non-scaling-stroke (o viewBox e esticado; sem isso a espessura sai torta)');
  chk(svg.getAttribute('preserveAspectRatio') === 'none',
      'o viewBox estica mesmo — e o motivo do ponto ser HTML');

  const ptsBase = sec.querySelectorAll('.mm-pt.base');
  const ptsCmp = sec.querySelectorAll('.mm-pt.cmp');
  chk(ptsBase.length === 9 && ptsCmp.length === 9, 'um ponto por dia, nos dois meses',
      ptsBase.length + ' / ' + ptsCmp.length);
  chk(ptsBase[0].tagName === 'SPAN', 'o ponto e SPAN, nao <circle> (redondo em qualquer largura)');
  const cx = getComputedStyle(ptsBase[0]);
  chk(parseFloat(cx.width) === parseFloat(cx.height) && parseFloat(cx.width) >= 8,
      'e ele e quadrado-no-CSS => redondo, e GRANDE', cx.width + ' x ' + cx.height);
  chk(parseFloat(getComputedStyle(ptsBase[0]).width) > parseFloat(getComputedStyle(ptsCmp[0]).width),
      'o ponto do mes base e maior que o do mes de comparacao');

  // ── O PONTO CAI EM CIMA DA LINHA ──
  // A afirmacao que faltava e que teria pego o bug: o SVG media 220px dentro
  // de uma area de 240px, mas os pontos eram posicionados em % da AREA. Eles
  // derivavam ate 20px da linha no pe do grafico. A fixture constante da 1a
  // versao punha tudo no topo, onde a deriva e zero — por isso so a inspecao
  // visual pegou, e por isso a serie agora e uma rampa.
  const plot = sec.querySelector('.mm-graf-plot');
  chk(!!plot, 'o plot e uma caixa propria (a mesma do SVG e dos pontos)');
  const coords = lb[0].getAttribute('points').trim().split(' ').map(par => par.split(',').map(Number));
  chk(coords.length === 9, 'a polilinha tem um vertice por dia', coords.length + '');
  // getScreenCTM E O PONTO DA MEDIDA, e nao uma conta a partir da altura do
  // plot: a matriz diz onde o vertice foi DESENHADO na tela, ja com o
  // preserveAspectRatio aplicado. A 1a versao deste teste calculava o y
  // esperado de novo (coords[i][1]/240*altura) e por isso comparava o ponto
  // com a INTENCAO, nao com a linha — sabotando o SVG para 140px ela seguia
  // passando. Com a matriz, o mesmo sabote da 24px de desvio.
  const medirDesvio = () => {
    const svgEl = sec.querySelector('svg.mm-graf'), ctm = svgEl.getScreenCTM();
    return [...sec.querySelectorAll('.mm-pt.base')].map((sp, i) => {
      const p = svgEl.createSVGPoint(); p.x = coords[i][0]; p.y = coords[i][1];
      const naTela = p.matrixTransform(ctm);
      const r = sp.getBoundingClientRect();
      return Math.hypot(r.left + r.width / 2 - naTela.x, r.top + r.height / 2 - naTela.y);
    });
  };
  const pior = Math.max(...medirDesvio());
  chk(pior <= 1.5, 'e cada ponto cai EM CIMA do seu vertice, do topo ao pe',
      'pior desvio ' + pior.toFixed(2) + 'px');

  // A PROVA DE QUE A PROVA FUNCIONA. Sem isto, "0,04px de desvio" poderia ser
  // um teste cego devolvendo zero — foi exatamente o caso na 1a versao.
  const sabot = document.createElement('style');
  sabot.textContent = 'svg.mm-graf{height:140px !important}';
  document.head.appendChild(sabot);
  await esperar(150);
  const piorSabotado = Math.max(...medirDesvio());
  sabot.remove();
  await esperar(150);
  chk(piorSabotado > 5, 'e a medida SABE FALHAR: encolher so o SVG desalinha e ela acusa',
      'desvio sabotado ' + piorSabotado.toFixed(2) + 'px vs ' + pior.toFixed(2) + 'px normal');
  chk(Math.max(...medirDesvio()) <= 1.5, 'e volta ao normal quando a sabotagem sai');
  // A rampa e o que torna a afirmacao acima capaz de falhar: com serie
  // constante todos os pontos ficariam na mesma altura e o desvio seria igual
  // em todos, inclusive zero.
  const alturas = [...sec.querySelectorAll('.mm-pt.base')].map(p2 => Math.round(parseFloat(p2.style.top)));
  chk(new Set(alturas).size >= 7,
      'a serie de teste VARIA de verdade (senao esta prova nao provaria nada)',
      new Set(alturas).size + ' alturas distintas em 9 pontos');
  chk(Math.max(...alturas) - Math.min(...alturas) > 40,
      'e varre boa parte da altura do grafico',
      (Math.max(...alturas) - Math.min(...alturas)).toFixed(0) + '% de amplitude');

  const rx = [...sec.querySelectorAll('.mm-rx')].map(e => e.textContent);
  chk(rx.length <= 8, 'POUCOS rotulos no eixo X — nao os 30 dias', rx.length + ': ' + rx.join(','));
  chk(rx[0] === '1' && rx[rx.length - 1] === '30', 'do dia 1 ao ultimo do mes', rx.join(','));
  EQ([...sec.querySelectorAll('.mm-leg')].map(e => e.textContent.trim()), ['set/26', 'ago/26'],
     'a legenda diz qual linha e qual mes');

  // ══════════════════════════════════════════════════════════════
  H('7 · o botao troca a metrica sem ir a rede');
  const antes = _ultimaUrl;
  const yBaseFat = sec.querySelector('.mm-pt.base').style.top;
  // O eixo Y e da serie DIARIA (2,0 mi/dia x 1,08 de folga), nao do total do
  // mes — sao grandezas diferentes e confundi-las foi o erro da 1a versao.
  chk(/^R\$ /.test(txt('.mm-graf-y span')), 'o eixo Y esta em R$', txt('.mm-graf-y span'));
  chk(txt('.mm-graf-y span:last-child') === '0',
      'e comeca no ZERO — cortar a base faria 3% parecer o dobro',
      txt('.mm-graf-y span:last-child'));
  window.__mmMetrica('litros');
  await esperar(20);
  chk(_ultimaUrl === antes, 'trocar a metrica NAO refaz a consulta (a serie ja veio inteira)');
  chk(/ L$/.test(txt('.mm-graf-y span')), 'o eixo Y passa a litros', txt('.mm-graf-y span'));
  chk(sec.querySelectorAll('.mm-pt.base').length === 9, 'e continua com os 9 pontos');
  const botoes = [...sec.querySelectorAll('.mm-metrica .fueltab')];
  EQ(botoes.map(b => b.textContent), ['Faturamento', 'Litros'], 'os dois botoes de metrica');
  chk(botoes[1].classList.contains('active') && !botoes[0].classList.contains('active'),
      'e o aceso e o de Litros');
  window.__mmMetrica('faturamento');
  await esperar(20);
  chk(sec.querySelector('.mm-pt.base').style.top === yBaseFat,
      'voltar a Faturamento redesenha igual ao que era', sec.querySelector('.mm-pt.base').style.top);

  // ══════════════════════════════════════════════════════════════
  H('8 · BURACO no meio: a linha QUEBRA, nao atravessa');
  await pintar('buraco');
  const seg = sec.querySelectorAll('polyline.mm-lin-base');
  chk(seg.length === 2, 'o dia 5 ausente parte a linha em DOIS segmentos', seg.length + '');
  chk(sec.querySelectorAll('.mm-pt.base').length === 8, 'e sao 8 pontos, nao 9');
  // Interpolar por cima do buraco inventaria um faturamento que nao houve.
  const todosX = [...sec.querySelectorAll('.mm-pt.base')].map(p => parseFloat(p.style.left));
  chk(todosX.length === new Set(todosX).size, 'nenhum ponto repetido');

  // ══════════════════════════════════════════════════════════════
  H('9 · a linha do mes base PARA onde o dado para');
  await pintar('dias_diferentes');
  const ptsB = [...sec.querySelectorAll('.mm-pt.base')];
  const ptsC = [...sec.querySelectorAll('.mm-pt.cmp')];
  chk(ptsB.length === 9 && ptsC.length === 30, 'base com 9 dias, comparacao com 30',
      ptsB.length + ' / ' + ptsC.length);
  const ultB = Math.max(...ptsB.map(p => parseFloat(p.style.left)));
  const ultC = Math.max(...ptsC.map(p => parseFloat(p.style.left)));
  chk(ultB < ultC - 10, 'a linha do mes base termina bem antes do fim do eixo',
      ultB.toFixed(1) + '% vs ' + ultC.toFixed(1) + '%');
  // O ponto mais baixo do grafico e o topo=100%. Se a linha descesse a zero no
  // dia 10, existiria um ponto la embaixo — e nao existe.
  const maisBaixo = Math.max(...ptsB.map(p => parseFloat(p.style.top)));
  chk(maisBaixo < 99, 'e NAO desce a zero: nenhum ponto no chao do grafico',
      'ponto mais baixo em ' + maisBaixo.toFixed(1) + '%');

  // ══════════════════════════════════════════════════════════════
  H('10 · dias diferentes: o total nao compara, mas a MEDIA POR DIA sim');
  // MUDANCA DELIBERADA. Antes a tela suprimia tudo. Suprimir jogava fora um
  // numero VERDADEIRO: os totais nao se comparam (9 dias contra 30), mas a
  // media diaria compara, e e ela que responde "qual mes rende mais por dia".
  const avisoTxt = txt('.mm-aviso-caixa');
  chk(/9 dias com dado e agosto de 2026 tem 30/.test(avisoTxt),
      'o aviso diz as duas contagens', avisoTxt);
  chk(/variacao falsa|variação falsa/.test(avisoTxt), 'e diz POR QUE o total nao compara');
  chk(/m.dia por dia compara/i.test(avisoTxt),
      'e que a media por dia COMPARA', avisoTxt.slice(0, 140));
  chk(/por dia \(R\$ [^)]*\/dia contra R\$ [^)]*\/dia\)/.test(avisoTxt.replace(/\s+/g, ' ')),
      'com as duas medias no proprio aviso', avisoTxt.slice(-90));

  // Os blocos agora mostram variacao — mas rotulada "por dia".
  const corpoTxt = sec.querySelector('#mm-corpo').textContent;
  chk(/por dia/.test(corpoTxt), 'os blocos comparam, e dizem que e POR DIA');
  const varsDia = [...sec.querySelectorAll('.mm-var')].filter(e => /por dia/.test(e.textContent));
  chk(varsDia.length >= 6, 'em todos eles', varsDia.length + ' variacoes por dia');
  chk(sec.querySelectorAll('.mm-var.nada').length === 0,
      'e NENHUM bloco diz mais "sem dado para comparar" — porque ha o que comparar');

  // A CONTA, conferivel na mao: Soutag 4,0 mi / 9 dias = 444 mil/dia;
  // agosto 3,5 mi / 30 dias = 117 mil/dia. Cresce muito porque o mes de
  // comparacao desta fixture tem 30 dias.
  const convDia = blocos('.mm-2 .mm-bloco');
  const mediaSou = txt('.mm-media', convDia[0]);
  chk(/R\$ 444 mil\/dia/.test(mediaSou), 'a media do mes base sai por extenso', mediaSou);
  chk(/ago\/26 R\$ 117 mil\/dia/.test(mediaSou), 'e a do mes de comparacao, nomeada', mediaSou);
  // 4.000.000/9 = 444.444/dia  contra  3.500.000/30 = 116.667/dia  =>  +281%
  chk(/subiu 281% por dia/.test(txt('.mm-var', convDia[0])),
      '444.444 / 116.667 = +281% por dia', txt('.mm-var', convDia[0]));

  // Os NUMEROS GRANDES continuam sendo os TOTAIS do periodo — a media diaria
  // e uma leitura a mais, nao a substituicao do faturamento.
  chk(txt('.mm-num', convDia[0]) === 'R$ 4,0 mi', 'o numero grande segue sendo o total', txt('.mm-num', convDia[0]));

  H('10b · o botao "comparar os mesmos dias" SO se ele resolver');
  const conserto = sec.querySelector('.mm-btn-conserto');
  chk(!!conserto, 'aqui agosto tem os dias 1 a 9, entao o botao aparece');
  chk(/1 a 9/.test(conserto.textContent), 'e diz em que dia vai cortar', conserto.textContent);
  chk(!sec.querySelector('.mm-nota-caixa'), 'e nao ha nota explicando ausencia de botao');
  chk(sec.querySelector('#mm-alcance').value === '', 'o alcance esta em "Mes inteiro" antes');
  conserto.click();
  await esperar(80);
  chk(sec.querySelector('#mm-alcance').value === '9',
      'o clique alinha no ultimo dia com dado do mes base (dia 9)',
      sec.querySelector('#mm-alcance').value);
  chk(_ultimaUrl.indexOf('ate_dia=9') > 0, 'e refaz a consulta com ate_dia=9', _ultimaUrl);

  // ── E A FORMA REAL DE HOJE: agosto 21–31, que NAO alinha ──
  await pintar('nao_alinhavel');
  chk(!sec.querySelector('.mm-btn-conserto'),

  const pxPeriodo = parseFloat(getComputedStyle(elPer).fontSize);
  const pxNum = parseFloat(getComputedStyle(sec.querySelector('.mm-num')).fontSize);

  // em 10,2px — abaixo do minimo 4,5 do WCAG AA para texto pequeno. Uma linha
  // que so existe para ser lida nao pode ser a menos legivel do bloco, e
  // "discreto" nao e desculpa para invisivel.
  const lum = (c) => {
    const [r, g, b] = c.match(/\d+/g).map(Number).map(v => {
      v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const contraste = (a2, b2) => {
    const l1 = lum(a2), l2 = lum(b2);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);

    // dados do bloco, e a dica de toque vem por ultimo.
    const b0 = sec.querySelector('.mm-3 .mm-bloco');
    const per0 = b0.querySelector('.mm-periodo'), sub0 = b0.querySelector('.mm-num');
    chk(per0.getBoundingClientRect().top > sub0.getBoundingClientRect().bottom,
        'no celular: o periodo vem depois do numero, no pe do bloco');
  }

  // ══════════════════════════════════════════════════════════════
  H('26 · MES DE COMPARACAO SEM CONVENIO: cada seção com o seu motivo');
  await pintar('cmp_sem_convenio');
  // ITEM 4: a prova de que o filtro pegou e o faturamento comparando.
  const combSC = blocos('.mm-3 .mm-bloco');
  chk(/subiu 11%/.test(txt('.mm-var', combSC[0])),
      'o faturamento por combustivel COMPARA normalmente', txt('.mm-var', combSC[0]));
  chk(/subiu 9,1%/.test(txt('.mm-total .mm-var')), 'e o total tambem', txt('.mm-total .mm-var'));
  // ITEM 3: e so o convenio avisa, com o motivo ESTRUTURAL.
  const notaSC = [...sec.querySelectorAll('.mm-nota')].map(e => e.textContent).join(' ');
  chk(/Conv.nio \(Soutag\/99\) s. tem registro desde 21\/08\/2026/.test(notaSC),
      'o convenio diz desde quando existe', notaSC.slice(0, 90));
  chk(/compara normalmente/.test(notaSC),
      'e diz explicitamente que o faturamento compara — e o que mata a impressao de filtro quebrado');
  const convSC = blocos('.mm-2 .mm-bloco');
  chk(convSC.every(b => !/sem dado para comparar/.test(b.textContent)),
      'e os blocos NAO repetem a frase generica que fazia parecer defeito');
  chk(convSC.every(b => /sem compara/.test(b.textContent)),
      'eles dizem so "sem comparacao"; o porque esta na nota, uma vez');
  // Os numeros do convenio continuam la — nao comparar nao e nao mostrar.
  chk(txt('.mm-num', convSC[0]) === 'R$ 4,0 mi', 'o valor do convenio segue na tela', txt('.mm-num', convSC[0]));
  chk(!!convSC[0].querySelector('.mm-periodo'), 'com o periodo dele');

  // ══════════════════════════════════════════════════════════════
  H('27 · MES DE COMPARACAO VAZIO: diz o motivo, nao so o efeito');
  await pintar('sem_dado');
  const avisoSD = txt('.mm-aviso-caixa');
  chk(/Sem dado para comparar em julho de 2026/.test(avisoSD), 'diz qual mes', avisoSD.slice(0, 60));
  chk(/rollup da TecnoX come.a em 21\/08\/2026/.test(avisoSD),
      'E POR QUE — sem isto, "sem dado" se le como filtro quebrado', avisoSD);
  chk(/est.o corretos/.test(avisoSD),
      'e afirma que os numeros da tela estao certos');
  // A prova visivel de que a consulta funcionou: tudo do mes base continua la.
  chk(txt('.mm-total .mm-num') === 'R$ 18,0 mi', 'o total do mes base segue', txt('.mm-total .mm-num'));
  chk(sec.querySelectorAll('.mm-periodo').length >= 6, 'e todo bloco ainda mostra a sua janela');
  // A TELA NAO PODE MENTIR SOBRE SI MESMA. Neste cenario julho nao tem NADA,
  // entao o faturamento tambem nao compara — e a nota do convenio nao pode
  // afirmar que ele compara. A 1a versao afirmava, porque a frase era fixa.
  const notaSD = [...sec.querySelectorAll('.mm-nota')].map(e => e.textContent).join(' ');
  chk(/s. tem registro desde 21\/08\/2026/.test(notaSD),
      'a nota do convenio segue dizendo desde quando ele existe', notaSD);
  chk(!/compara normalmente/.test(notaSD),
      'mas NAO afirma que o faturamento compara — porque aqui ele nao compara', notaSD);
  const combSD = blocos('.mm-3 .mm-bloco');
  chk(/sem dado para comparar/.test(combSD[0].textContent),
      'e os blocos de combustivel dizem honestamente que nao ha comparacao');

  H('14 · o DRE nao foi tocado por nada disto');
  const r = await fetch('/modulos/painel-adm/dre.js').then(x => x.text());
  chk(r.indexOf('window.renderDre') > 0, 'o dre.js segue no lugar');
  chk(r.indexOf('JBGraf') < 0 && r.indexOf('movimentacao-mes') < 0,
      'e SEM nenhuma referencia a esta tela nem a extracao que nao foi feita');
  chk(r.indexOf('function svgLinhas') > 0 && r.indexOf('function ligarTooltipGrafico') > 0,
      'o desenhador e o balao dele continuam dentro do proprio IIFE');
  const meu = await fetch('/modulos/painel-adm/movimentacao-mes.js').then(x => x.text());
  // SEM OS COMENTARIOS: o cabecalho deste arquivo CITA svgLinhas para explicar
  // por que ele nao foi reusado, e um indexOf cru acusava a propria explicacao.
  const codigo = meu.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^ *\/\/.*$/gm, '');
  chk(codigo.indexOf('svgLinhas') < 0 && codigo.indexOf('#s-dre') < 0 &&
      codigo.indexOf('renderDre') < 0,
      'e esta tela nao chama nada de la — gráfico proprio, como pedido');
  chk(meu.indexOf('svgLinhas') > 0,
      '(o nome so aparece no comentario que explica POR QUE nao foi reusado)');

  out.push('\n' + (falhas
    ? '<span class="bad">FALHAS: ' + falhas + ' de ' + total + '</span>'
    : '<span class="ok">TUDO OK · ' + total + ' afirmações</span>'));
  pintarRes();
  // Deixa o cenario bom na tela para inspecao visual manual.
  await pintar('comparavel');
})().catch(e => {
  out.push('<span class="bad">ERRO: ' + e.message + '</span>\n' + (e.stack || ''));
  pintarRes();
});
</script>
