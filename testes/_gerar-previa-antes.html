<!doctype html>
<meta charset="utf-8">
<title>gerar referência — prévia do DRE ANTES da mudança</title>
<link rel="stylesheet" href="/shared/css/base.css">
<div id="palco"><section class="scr active" id="s-dre"></section></div>
<pre id="saida" style="white-space:pre-wrap;font-size:11px">gerando…</pre>
<script>
window.getUsuarioLogado = function () { return { id:'h', nome:'H', perfil:'ADM', ti:true }; };
window.JBRETAS_CONFIG = { API_URL: 'http://api-de-teste' };
window.jbretasGetItem = function () { return 't'; };
window.caminhoRaiz = function () { return '/'; };
window.apiFetch = function () { return Promise.resolve({ totais:null, linhas:[] }); };
var FIX = null;
window.fetch = function () {
  return Promise.resolve({ status: FIX.dre.status, json: function(){ return Promise.resolve(FIX.dre.body); } });
};
function js(src){return new Promise(function(ok,er){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){er(new Error(src))};document.body.appendChild(s);});}
(async function(){
  FIX = await new Promise(function(ok,er){var x=new XMLHttpRequest();x.open('GET','/testes/fixtures-import.json');
    x.onload=function(){ok(JSON.parse(x.responseText));};x.onerror=er;x.send();});
  try { await js('/modulos/painel-adm/custo-margem.js'); } catch(e) {}
  await js('/testes/_dre-antes.js');
  window.renderDre(document.getElementById('s-dre'));
  await new Promise(r=>setTimeout(r,250));
  window.__dreImpAbrir();
  await window.__dreImpFile({ files:[new File(['x'],'Venda de produtos 15092026.xls')], value:'' });
  await new Promise(r=>setTimeout(r,200));
  window.__REF__ = document.getElementById('dri-body').innerHTML;
  document.getElementById('saida').textContent = 'pronto: ' + window.__REF__.length + ' caracteres';
})().catch(function(e){ document.getElementById('saida').textContent = 'ERRO: '+e.message; });
</script>
